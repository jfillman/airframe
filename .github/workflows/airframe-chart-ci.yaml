name: airframe-chart-ci

# AF-10b, AF-2. Two jobs:
#  - chart:     helm lint + the render tests in charts/airframe-application/tests (no secrets),
#               plus the AF-2 gates: values.yaml is generated from values.schema.json and must
#               never drift (--check), description coverage must stay >= 95%, and the compiled
#               schema must still validate cleanly (0% typo acceptance).
#  - scorecard: the AI-friendliness scorecard (hangar/tools/airframe-scorecard) compared with
#               its committed baseline; fails on any regression. It reads the live fleet files,
#               which live in PRIVATE gitops repos, so it only runs when the FLEET_READ_TOKEN
#               secret exists. Without it the job skips rather than scoring partial data.

on:
  pull_request:
    paths: ["charts/**", "xrds/**", "compositions/**", "contract/**", "docs/**", "AGENTS.md", ".github/workflows/airframe-chart-ci.yaml"]
  push:
    branches: [main]
    paths: ["charts/**", "xrds/**", "compositions/**", "contract/**"]

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml jsonschema cryptography
      - run: helm lint charts/airframe-application
        # the chart warns on the empty default name; only real failures matter
      - run: charts/airframe-application/tests/run.sh
      - run: helm lint charts/cluster-registry -f charts/cluster-registry/tests/clusters.example.yaml
      - run: "helm template r charts/cluster-registry -f charts/cluster-registry/tests/clusters.example.yaml | grep -q 'name: kiac-dev'"
      - run: python3 tools/build-compositions --check
      - run: python3 tools/gen_airframe_schema.py --check --coverage
      - run: python3 tools/gen_component_outputs.py --check
      - run: python3 tools/gen_contract.py --check
      - run: python3 tools/test_capabilities_coldstart.py
      - run: python3 tools/test_xr_validate.py
      # A3: every xrds/*.meta.yaml sidecar agrees with its composition renders (11 seeded drifts must be caught),
      # and airframe-verify's step runners work against a fake cluster and a fake Dex
      - run: python3 tools/test_sidecars.py
      - run: python3 tools/test_airframe_verify.py

  # C3: every composition's render fixtures (compositions/*/example/cases.yaml) through the real
  # functions with `crossplane render` (the runner has Docker; locally without Docker the same
  # test runs through tools/render-pipeline), compared with the committed expectations.
  # C3/C7: every composition's render fixtures (compositions/*/example/cases.yaml) through the real
  # functions, compared with the committed expectations. The functions run as containers started
  # here so function-auto-ready can carry --feature-gates=CELHealthcheckCustomizations=true (the
  # catalog's readiness rules are CEL); tools/render-pipeline drives them over gRPC exactly as a
  # developer does locally. crossplane render's Docker runtime cannot pass that flag and its
  # Development runtime did not engage on the runner (containers started anyway, renders hung), so
  # the harness is the CI renderer; its output was cross-checked against crossplane render on every
  # case before the feature gate was needed (airframe#65).
  compositions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml crossplane-function-sdk-python==0.15.1
      # function-dex has no CI of its own; its suite includes the test xrds/dex.meta.yaml's sources
      # name as `checkedBy` (tools/test_sidecars.py only checks that the test exists)
      - name: function-dex unit tests
        working-directory: functions/function-dex
        run: pip install click && python3 -m unittest tests.test_fn
      - name: start the two functions (auto-ready with its CEL feature gate)
        run: |
          docker run -d --name fn-gotpl -p 127.0.0.1:9443:9443 xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.12.3 --insecure --address=0.0.0.0:9443
          docker run -d --name fn-ready -p 127.0.0.1:9444:9443 xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.0 --insecure --address=0.0.0.0:9443 --feature-gates=CELHealthcheckCustomizations=true
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/9443) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/9444) 2>/dev/null && break; sleep 2; done
          docker ps --format '{{.Names}} {{.Status}}'
      - name: smoke render (one composition, fail fast if the functions are unreachable)
        run: timeout 180 python3 tools/test_compositions.py --renderer render-pipeline slo
      - run: python3 tools/test_compositions.py --renderer render-pipeline
      - name: function logs (diagnostics)
        if: always()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}'
          docker logs --tail 30 fn-gotpl 2>&1 | tail -30
          docker logs --tail 30 fn-ready 2>&1 | tail -30

  scorecard:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.FLEET_READ_TOKEN != '' }}
    steps:
      - name: skip without token
        if: env.HAS_TOKEN != 'true'
        run: echo "FLEET_READ_TOKEN not set; scorecard skipped (fleet repos are private)."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with: {path: tech/airframe}
      - uses: azure/setup-helm@v4
        if: env.HAS_TOKEN == 'true'
      - name: check out sibling repos
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          cd tech
          for r in hangar glidepath apron gitops-cluster-dev gitops-cluster-dev-tenants gitops-cluster-kind-prod \
                   flight-api baggage-api boarding-api \
                   gitops-flight-api gitops-baggage-api gitops-boarding-api gitops-infra-skyport-broker; do
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/jfillman/${r}.git"
          done
      - name: scorecard vs baseline
        if: env.HAS_TOKEN == 'true'
        run: |
          pip install pyyaml jsonschema
          B=$(ls tech/hangar/tools/airframe-scorecard/baseline-*.json | sort | tail -1)
          python3 tech/hangar/tools/airframe-scorecard/scorecard.py --tech tech --baseline "$B"
      - name: AF-2 mutation test against the live fleet
        if: env.HAS_TOKEN == 'true'
        run: |
          pip install pyyaml jsonschema
          cd tech/airframe && python3 tools/test_af2_mutations.py
