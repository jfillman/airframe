name: airframe-validate-image

# Builds ghcr.io/jfillman/airframe-validate:<tag> (linux/amd64 + linux/arm64) on every release tag. It carries the
# chart, the XRDs and tools/airframe-validate of that tag; Glidepath's values-check gate runs it against env files.
# After the FIRST push, set the package's visibility to public (GitHub has no API for it): the CI pods pull it
# without credentials, like the toolbox image.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/jfillman/airframe-validate

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/validate.Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
