# The 95th percentile response time stays under max-p95-seconds (default 0.5).
#
# A ClusterAnalysisTemplate: one copy per cluster, installed by that cluster's idp-service-catalog Application,
# referenced from an app's values with `clusterScope: true`:
#
#   rollout:
#     canaryAnalysis:
#       templates:
#         - templateName: latency-check
#           clusterScope: true
#       args:
#         - name: namespace
#           value: app-<app>-<env>
#         - name: app
#           value: <app>
#
# NEEDS REQUEST METRICS: Traefik's traefik_service_request_duration_seconds_bucket scraped by Prometheus, which neither cluster has yet. Until then the query returns nothing and the check passes.
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: latency-check
  labels:
    app.kubernetes.io/part-of: airframe
    hangar.io/analysis-catalog: "true"
spec:
  args:
    - name: namespace
    - name: app
    - name: service-regex
      value: "^$"
    - name: max-error-rate
      value: "0.05"
    - name: min-success-rate
      value: "0.95"
    - name: max-p95-seconds
      value: "0.5"
  metrics:
    - name: p95-latency
      interval: 30s
      count: 6
      failureLimit: 1
      successCondition: "len(result) == 0 || isNaN(result[0]) || result[0] < {{args.max-p95-seconds}}"
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observability:9090
          query: |
            histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~".*{{args.namespace}}.*{{args.app}}.*|{{args.service-regex}}"}[2m])))
