apiVersion: v2
name: airframe-application
description: >-
  One Helm release per (app, cluster, env): the Argo Rollout and everything around it
  (Service, config, secrets, networking, scaling, jobs) plus the Crossplane XRs for the
  app's components and SLOs, from one set of values. Developers edit their environment's
  values files, never this chart's templates.
type: application
version: 0.3.0
appVersion: "1.0.0"
