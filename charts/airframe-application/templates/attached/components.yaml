{{/*
One XR per components: entry. componentKinds maps the entry's type to a kind, spec: passes through
untouched, and the component's own XRD validates it. A new component kind needs one componentKinds row,
never a template change.
*/}}
{{- range .Values.components }}
apiVersion: {{ $.Values.attachedResourceApiVersion }}
kind: {{ include "airframe-application.componentKind" (dict "ctx" $ "type" .type) }}
metadata:
  name: {{ .name }}
  namespace: {{ include "airframe-application.namespace" $ }}
  labels:
    {{- include "airframe-application.labels" $ | nindent 4 }}
    hangar.io/subcomponent: attached-component
    hangar.io/component-type: {{ .type }}
spec:
  environmentRef:
    name: {{ include "airframe-application.environmentRef" $ }}
  {{- with .spec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
{{- end }}
