{{/*
A RolloutWatch XR for the Rollout, whenever there is one. Same name and namespace as the Rollout: its
composition finds the Rollout by that name. It reports Degraded rollouts to the diagnosis Job, and to Slack
with notifications.slack.enabled.
*/}}
{{- if eq (include "airframe-application.hasRollout" .) "true" }}
apiVersion: {{ .Values.attachedResourceApiVersion }}
kind: RolloutWatch
metadata:
  name: {{ .Values.appName }}
  namespace: {{ include "airframe-application.namespace" . }}
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: attached-rollout-watch
  annotations:
    # Tower's catalog type for platform-made XRs. Set here because RolloutWatch is the one XR this chart,
    # not an xr-requests commit, creates.
    terasky.backstage.io/component-type: platform
spec:
  environmentRef:
    name: {{ include "airframe-application.environmentRef" . }}
  appName: {{ .Values.appName }}
  cluster: {{ .Values.cluster }}
  env: {{ .Values.envName }}
  {{- if .Values.notifications.slack.enabled }}
  notifications:
    slack:
      enabled: true
      channel: {{ .Values.notifications.slack.channel | quote }}
  {{- end }}
{{- end }}
