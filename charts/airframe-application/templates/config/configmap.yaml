{{/*
One ConfigMap per configMaps: entry that sets data:. An existingConfigMap: entry refers to one created
elsewhere, so nothing renders here; configMapObjectName validates both shapes.
*/}}
{{- range .Values.configMaps }}
{{- if hasKey . "data" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}
  namespace: {{ include "airframe-application.namespace" $ }}
  labels:
    {{- include "airframe-application.labels" $ | nindent 4 }}
    hangar.io/subcomponent: config
data:
  {{- toYaml .data | nindent 2 }}
---
{{- end }}
{{- end }}
