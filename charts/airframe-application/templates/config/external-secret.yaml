{{/*
One ExternalSecret, app-secrets, holding every secrets: entry. The workload* helpers decide how each entry is
consumed (env, file, or both); this object is the same either way.

Which store and which Infisical key, by the cluster's registry type (clusterType, never its name):
- dev: everything comes from the shared store <app>-<cluster>. The dev cluster has one Infisical environment per
  app, so a non-shared key is read as <envName>/<name> to keep pr-12 and pr-13 apart; a shared one as <name>.
- upper: the per-environment store <app>-<cluster>-<env> by default; `shared: true` entries read the shared store
  through a per-entry sourceRef. Keys are bare names: each store is scoped to its own Infisical environment.

No remoteRef.property: ESO's Infisical provider reads it as a field inside a JSON value, and these are flat secrets.
*/}}
{{- if .Values.secrets }}
{{- if not .Values.cluster }}{{ fail "secrets: is set but cluster is empty: cluster must be this cluster's registry name (ApplicationEnvironment and Glidepath set it)" }}{{ end }}
{{- if not .Values.clusterType }}{{ fail (printf "secrets: is set but clusterType is empty: set it to this cluster's registry type (dev or upper) for cluster %q" .Values.cluster) }}{{ end }}
{{- $isDevCluster := eq .Values.clusterType "dev" }}
{{- $sharedStore := printf "%s-%s" .Values.appName .Values.cluster }}
{{- $envStore := printf "%s-%s-%s" .Values.appName .Values.cluster .Values.envName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: {{ include "airframe-application.namespace" . }}
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ if $isDevCluster }}{{ $sharedStore }}{{ else }}{{ $envStore }}{{ end }}
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .name }}
      {{- if and .shared (not $isDevCluster) }}
      sourceRef:
        storeRef:
          name: {{ $sharedStore }}
          kind: ClusterSecretStore
      {{- end }}
      remoteRef:
        key: {{ if and $isDevCluster (not .shared) }}{{ $.Values.envName }}/{{ end }}{{ .name }}
    {{- end }}
{{- end }}
