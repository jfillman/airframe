{{/*
notify-secrets: the Slack webhook for AI-triage diagnoses, read by the diagnosis Job function-rollout-watcher
composes, not by the app. Always the shared store and the bare key slack-webhook-url: the webhook is app-wide,
not per environment.
*/}}
{{- if .Values.notifications.slack.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notify-secrets
  namespace: {{ include "airframe-application.namespace" . }}
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: notify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ printf "%s-%s" .Values.appName .Values.cluster }}
    kind: ClusterSecretStore
  target:
    name: notify-secrets
    creationPolicy: Owner
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: slack-webhook-url
{{- end }}
