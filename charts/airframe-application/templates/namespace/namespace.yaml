{{/*
The app's Namespace, declared so ArgoCD tracks it and prunes it when the Application is deleted (a namespace
that only CreateNamespace=true creates survives that). Namespace labels and annotations go in
namespace.labels/annotations: an explicit Namespace overrides ArgoCD's managedNamespaceMetadata.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "airframe-application.namespace" . }}
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    {{- with .Values.namespace.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.namespace.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
