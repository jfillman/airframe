{{/*
A Gateway API HTTPRoute to the first rollout.ports entry. Needs hostnames and parentRefs (the platform
Gateway, hangar in hangar-gateway). The route sits in the app's namespace next to its Service, so the
backendRef needs no ReferenceGrant; the cross-namespace parentRef is allowed by the Gateway listener's
allowedRoutes.
*/}}
{{- if and .Values.httpRoute.enabled (eq (include "airframe-application.hasRollout" .) "true") }}
{{- if not .Values.httpRoute.hostnames }}
{{- fail "httpRoute.enabled is true but httpRoute.hostnames is empty - at least one hostname is required" }}
{{- end }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.enabled is true but httpRoute.parentRefs is empty - at least one parentRef (the platform Gateway) is required" }}
{{- end }}
{{- $firstPort := index .Values.rollout.ports 0 }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.appName }}
  namespace: {{ include "airframe-application.namespace" . }}
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: networking
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.httpRoute.parentRefs }}
    - name: {{ .name }}
      {{- if .namespace }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: {{ .Values.httpRoute.pathType }}
            value: {{ .Values.httpRoute.path }}
      backendRefs:
        - name: {{ .Values.appName }}
          port: {{ $firstPort.containerPort }}
{{- end }}
