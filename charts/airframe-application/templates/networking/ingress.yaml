{{- if and .Values.ingress.enabled (eq (include "airframe-application.hasRollout" .) "true") }}
{{- $firstPort := index .Values.rollout.ports 0 }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName }}
  namespace: {{ include "airframe-application.namespace" . }}
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: networking
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" .Values.appName) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ .Values.appName }}
                port:
                  name: {{ $firstPort.name }}
{{- end }}
