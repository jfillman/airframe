{{/*
templates/release-tracking/rbac.yaml - narrow identity for the PreSync/PostSync/
SyncFail outcome-hook Jobs (hooks.yaml, this same directory): get-only on exactly
the platform-outcome-relay-token Secret this app's own namespace holds. That Secret
name is hardcoded here (not a values.yaml field) because it's also hardcoded inside
platform-cicd/catalog/lib/argocd-outcome-hook.sh, the script both hook Jobs run -
the two have to agree on a literal, and the script is the one baked into an image
this chart doesn't control, so this follows it, not the other way round.

The Secret itself is hand-provisioned once per app namespace on this cluster - see
platform-cicd/hack/bootstrap-upper-cluster.sh - never committed to git, never
passed through this chart. This identity can read that one Secret's one value,
nothing else - no wildcard get-on-all-secrets.

argocd.argoproj.io/hook: PreSync (added 2026-09-14, alongside the new PreSync
outcome-hook Job in hooks.yaml) is load-bearing, not incidental: these three
resources used to be plain (non-hook) manifests, applied during ArgoCD's regular
Sync phase - fine for PostSync/SyncFail, which both run AFTER Sync, but a real
deadlock for PreSync, which runs BEFORE it. Confirmed live 2026-09-14 on
checkout-api's brand-new `proofing` env on kiac-prod: the PreSync hook Job's own
Pod creation failed with "serviceaccount platform-outcome-hook not found" on that
env's very first-ever sync (an already-onboarded env never hit this - its
ServiceAccount already existed from a prior sync, so the ordering bug was
invisible there), and since a failed PreSync hook blocks the Sync phase from ever
starting, the whole Application got stuck OutOfSync with no path to create the
very ServiceAccount it was waiting on. Making these three PreSync hooks too (no
hook-delete-policy set, so - unlike hooks.yaml's own Jobs - they're created once
and left in place, never deleted) puts them in the SAME phase as the outcome-hook
Jobs; the explicit sync-wave below (more negative than hooks.yaml's own
Jobs, which are left at the implicit default of "0") is what then guarantees
these apply BEFORE those Jobs within that shared phase - same-wave hooks have no
guaranteed ordering against each other.

REVERTED 2026-09-15 from a same-day PreSync,PostSync,SyncFail widening: that
change was a misdiagnosis. Its own commit message already suspected the truth
("most likely two overlapping sync operations racing") but "fixed" it by
re-asserting this identity in all three phases instead of addressing the
overlap - which made the real problem WORSE. Live-confirmed via
argocd-apps-application-controller-0's logs on checkout-api's `proofing` env:
a single git-triggered release fired FOUR overlapping sync operations within
~4 seconds (syncId 00558 through 00561), because every hook resource this
chart re-creates emits "Requesting app refresh caused by object update", and
with selfHeal:true each of those refreshes can itself queue a brand-new
top-level sync on top of the one still running - the widening tripled that
churn by having THIS resource re-created in PostSync and SyncFail too, not
just PreSync. hooks.yaml's own Jobs (hook-delete-policy: BeforeHookCreation)
each genuinely ran and succeeded on every one of those four overlapping
operations ("Reached expected number of succeeded pods", confirmed in the
same logs) - but each new operation's BeforeHookCreation deletes the prior
operation's Job before recreating its own, and when the last of several
racing operations doesn't cleanly finish its own recreate step, the net
result is zero persisted Job objects even though the outcome relay was
notified correctly (redundantly) every time. PreSync-only is the original,
narrower fix for the actual ordering deadlock; it doesn't reintroduce that
bug (a brand-new namespace's first-ever sync still creates this before
hooks.yaml's PreSync Job runs) and it removes 2 of these 3 resources' worth
of avoidable churn per sync going forward.
*/}}
{{- if .Values.releaseTracking }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-outcome-hook
  namespace: {{ include "airframe-application.namespace" . }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: outcome-hook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-outcome-hook
  namespace: {{ include "airframe-application.namespace" . }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: outcome-hook
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["platform-outcome-relay-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-outcome-hook
  namespace: {{ include "airframe-application.namespace" . }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: outcome-hook
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-outcome-hook }
subjects:
  - kind: ServiceAccount
    name: platform-outcome-hook
    namespace: {{ include "airframe-application.namespace" . }}
{{- end }}
