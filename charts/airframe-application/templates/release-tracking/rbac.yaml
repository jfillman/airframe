{{/*
templates/release-tracking/rbac.yaml - narrow identity for the PreSync/PostSync/
SyncFail outcome-hook Jobs (hooks.yaml, this same directory): get-only on exactly
the platform-outcome-relay-token Secret this app's own namespace holds. That Secret
name is hardcoded here (not a values.yaml field) because it's also hardcoded inside
platform-cicd/catalog/lib/argocd-outcome-hook.sh, the script both hook Jobs run -
the two have to agree on a literal, and the script is the one baked into an image
this chart doesn't control, so this follows it, not the other way round.

The Secret itself is hand-provisioned once per app namespace on this cluster - see
platform-cicd/hack/bootstrap-upper-cluster.sh - never committed to git, never
passed through this chart. This identity can read that one Secret's one value,
nothing else - no wildcard get-on-all-secrets.

argocd.argoproj.io/hook: PreSync,PostSync,SyncFail (added 2026-09-14, alongside
the new PreSync outcome-hook Job in hooks.yaml; widened from PreSync-only to all
three phases the same day) is load-bearing, not incidental: these three resources
used to be plain (non-hook) manifests, applied during ArgoCD's regular Sync phase -
fine for PostSync/SyncFail on their own, which both run AFTER Sync, but a real
deadlock for PreSync, which runs BEFORE it. Confirmed live 2026-09-14 on
checkout-api's brand-new `proofing` env on kiac-prod: the PreSync hook Job's own
Pod creation failed with "serviceaccount platform-outcome-hook not found" on that
env's very first-ever sync (an already-onboarded env never hit this - its
ServiceAccount already existed from a prior sync, so the ordering bug was
invisible there), and since a failed PreSync hook blocks the Sync phase from ever
starting, the whole Application got stuck OutOfSync with no path to create the
very ServiceAccount it was waiting on.

Originally shipped as PreSync-only, on the reasoning that no hook-delete-policy
means these are created once and left in place, never deleted, so being present
for PreSync implied being present for PostSync/SyncFail too. Widened to all three
phases the same day on a live report of platform-outcome-postsync itself failing
with the identical "serviceaccount ... not found" error, in what live sync-result
history showed was actually a fully successful run once checked - most likely two
overlapping sync operations racing (this incident involved a lot of manual
argocd.argoproj.io/refresh nudging on top of automated selfHeal retries). Rather
than rely on "no delete-policy should mean it persists" holding across every
timing edge case, each phase that genuinely needs this identity now re-asserts it
directly - the only guarantee that can't be raced. The explicit sync-wave below
(more negative than hooks.yaml's own Jobs, left at the implicit default of "0")
still guarantees these apply before those Jobs within whichever shared phase is
running - same-wave hooks have no guaranteed ordering against each other.
*/}}
{{- if .Values.releaseTracking }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-outcome-hook
  namespace: {{ include "airframe-application.namespace" . }}
  annotations:
    argocd.argoproj.io/hook: PreSync,PostSync,SyncFail
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: outcome-hook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-outcome-hook
  namespace: {{ include "airframe-application.namespace" . }}
  annotations:
    argocd.argoproj.io/hook: PreSync,PostSync,SyncFail
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: outcome-hook
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["platform-outcome-relay-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-outcome-hook
  namespace: {{ include "airframe-application.namespace" . }}
  annotations:
    argocd.argoproj.io/hook: PreSync,PostSync,SyncFail
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: outcome-hook
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-outcome-hook }
subjects:
  - kind: ServiceAccount
    name: platform-outcome-hook
    namespace: {{ include "airframe-application.namespace" . }}
{{- end }}
