{{/*
templates/release-tracking/relay-token-external-secret.yaml - real ESO-managed
replacement for the hand-`kubectl create secret platform-outcome-relay-token`
step (platform-cicd/hack/bootstrap-upper-cluster.sh) every app onboarded to a
cluster-mapped env used to need. Rendered only alongside the outcome-hook Jobs
(rbac.yaml/hooks.yaml, this same directory, both also gated on .Values.releaseTracking)
- no point syncing a token release-tracking's own hook script never reads without it.

Sourced from THIS cluster's own platform-cicd Infisical project (values.yaml's
platformSecretStore - platform-cicd-kind-prod's own ClusterSecretStore on an upper
cluster, hand-authored per docs/admin/secrets-management.md, same shape as
platform-cicd-control-plane's kind-dev one). The token VALUE still has to be planted
into Infisical by hand once per cluster (there's no bootstrapping around real secret
material) - what this removes is the N-times-per-app manual Secret copy, replaced by
one ESO sync per app namespace, automatic for every app onboarded to this cluster from
here on.

Secret name (platform-outcome-relay-token) is unchanged and still has to match
rbac.yaml's own hardcoded resourceNames entry and platform-cicd/catalog/lib/
argocd-outcome-hook.sh's own read - see rbac.yaml's header for why that name is fixed,
not a values field.
*/}}
{{/*
argocd.argoproj.io/hook: PreSync (added 2026-09-14, same fix and same day as
rbac.yaml's own identical addition - see that file's header for the full
incident). This was a plain Sync-phase resource, which deadlocks a brand-new
env's PreSync outcome-hook Job the same way the RBAC did. Confirmed live
immediately after the RBAC fix landed: same env, same PreSync Job, now failing on
"secrets platform-outcome-relay-token not found" instead of the SA it needed
before.

REVERTED 2026-09-15 from a same-day PreSync,PostSync,SyncFail widening - see
rbac.yaml's header for the full story: that widening was based on a
misdiagnosed incident (a genuinely successful run misread as a missing-Secret
failure, when the real cause was overlapping self-heal sync operations), and
tripling how often this resource gets re-created per sync made that overlap
measurably worse rather than fixing anything. Reverted alongside rbac.yaml
back to PreSync-only, which already persists (no hook-delete-policy) into
PostSync/SyncFail without needing to be re-asserted there.

Wave-ordering alone isn't quite sufficient here, unlike rbac.yaml's ServiceAccount/
Role/RoleBinding: this cluster's ArgoCD has no resource.customizations health check
registered for external-secrets.io/ExternalSecret (checked argocd-cm directly), so
ArgoCD treats it as "Healthy" the instant the ExternalSecret OBJECT applies - it does
NOT wait for ESO's own controller to actually reconcile that into a real Secret,
which is a genuinely separate, asynchronous step. The earlier wave here still gets
this object created before the outcome-hook Job's wave starts, but
argocd-outcome-hook.sh's own secret read now also polls for a few seconds rather
than failing on the first miss, to absorb whatever of that ESO gap wave-ordering
doesn't cover.
*/}}
{{- if .Values.releaseTracking }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-outcome-relay-token
  namespace: {{ include "airframe-application.namespace" . }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: outcome-hook
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.platformSecretStore.name }}
    kind: {{ .Values.platformSecretStore.kind }}
  target:
    name: platform-outcome-relay-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform-outcome-relay-token
{{- end }}
