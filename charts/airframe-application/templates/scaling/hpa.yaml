{{/*
CPU-based HorizontalPodAutoscaler. Argo Rollouts supports a Rollout as the scale target.
*/}}
{{- if and .Values.autoscaling.enabled (eq (include "airframe-application.hasRollout" .) "true") }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.appName }}
  namespace: {{ include "airframe-application.namespace" . }}
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: scaling
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: {{ .Values.appName }}
  minReplicas: {{ .Values.autoscaling.min }}
  maxReplicas: {{ .Values.autoscaling.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUPercent }}
{{- end }}
