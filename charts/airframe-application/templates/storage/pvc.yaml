{{/*
One PersistentVolumeClaim per volumes: entry. The workload* helpers mount it on the Rollout and every Job
and CronJob.
*/}}
{{- range .Values.volumes }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}
  namespace: {{ include "airframe-application.namespace" $ }}
  labels:
    {{- include "airframe-application.labels" $ | nindent 4 }}
    hangar.io/subcomponent: storage
spec:
  accessModes:
    {{- toYaml (.accessModes | default (list "ReadWriteOnce")) | nindent 4 }}
  {{- if .storageClassName }}
  storageClassName: {{ .storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size }}
---
{{- end }}
