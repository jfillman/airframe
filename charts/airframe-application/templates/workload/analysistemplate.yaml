{{/*
App-specific AnalysisTemplates. The shared ClusterAnalysisTemplates live in analysis/ and are installed once
per cluster. Reference either by name from rollout.steps or rollout.canaryAnalysis; the chart doesn't wire
them in. An arg a metric uses as {{args.<name>}} must be declared in this template's own args, not only
supplied by the Rollout.
*/}}
{{- range .Values.analysisTemplates }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .name }}
  namespace: {{ include "airframe-application.namespace" $ }}
  labels:
    {{- include "airframe-application.labels" $ | nindent 4 }}
    hangar.io/subcomponent: workload
spec:
  {{- if .args }}
  args:
    {{- toYaml .args | nindent 4 }}
  {{- end }}
  metrics:
    {{- toYaml .metrics | nindent 4 }}
---
{{- end }}
