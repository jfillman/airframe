{{/*
One Job per jobs: entry. By default a Helm pre-install,pre-upgrade hook (ArgoCD runs it before the sync), so
a migration runs before the new Rollout comes up, and it is recreated on every release. hook: false makes it
a plain Job. The container comes from airframe-application.batchContainer.
*/}}
{{- range .Values.jobs }}
{{- $container := fromYaml (include "airframe-application.batchContainer" (dict "ctx" $ "entry" .)) }}
{{- $volumes := fromYamlArray (include "airframe-application.workloadVolumes" $) }}
{{- $podSpec := dict "serviceAccountName" (include "airframe-application.serviceAccountName" $) "restartPolicy" "OnFailure" "containers" (list $container) }}
{{- if $volumes }}{{- $_ := set $podSpec "volumes" $volumes }}{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .name }}
  namespace: {{ include "airframe-application.namespace" $ }}
  labels:
    {{- include "airframe-application.labels" $ | nindent 4 }}
    hangar.io/subcomponent: workload
  {{- if or (not (hasKey . "hook")) .hook }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: {{ include "airframe-application.intOr" (dict "map" . "key" "backoffLimit" "default" 3) }}
  template:
    metadata:
      labels:
        {{- include "airframe-application.labels" $ | nindent 8 }}
    spec:
      {{- toYaml $podSpec | nindent 6 }}
---
{{- end }}
