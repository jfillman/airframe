{{/*
The Argo Rollout: the app's long-running workload. Renders only when the environment runs a service
(rollout.enabled) and an image has been released (airframe-application.hasRollout).

The pod spec is built in order - main container, extraContainers, volumes, serviceAccountName,
securityContext - and rollout.podSpec is merged on top last. env/envFrom/volumeMounts/volumes come from the
workload* helpers in _helpers.tpl, which Jobs and CronJobs share.
*/}}
{{- if eq (include "airframe-application.hasRollout" .) "true" }}
{{- $releaseId := "" }}
{{- if .Values.releaseTracking }}{{- $releaseId = .Values.releaseTracking.releaseId | default "" }}{{- end }}
{{- $image := include "airframe-application.image" . | fromYaml }}
{{- $firstPort := index .Values.rollout.ports 0 }}
{{- $defaultProbe := dict "httpGet" (dict "path" "/" "port" $firstPort.name) }}
{{- $mainContainer := dict
      "name" .Values.appName
      "image" (printf "%s:%s" $image.repository $image.tag)
      "ports" (list)
}}
{{- range .Values.rollout.ports }}
{{- $_ := set $mainContainer "ports" (append (get $mainContainer "ports") (dict "name" .name "containerPort" .containerPort)) }}
{{- end }}
{{- if .Values.rollout.command }}{{- $_ := set $mainContainer "command" .Values.rollout.command }}{{- end }}
{{- if .Values.rollout.args }}{{- $_ := set $mainContainer "args" .Values.rollout.args }}{{- end }}
{{- if .Values.rollout.resources }}{{- $_ := set $mainContainer "resources" .Values.rollout.resources }}{{- end }}
{{- if .Values.rollout.containerSecurityContext }}{{- $_ := set $mainContainer "securityContext" .Values.rollout.containerSecurityContext }}{{- end }}
{{- $_ := set $mainContainer "livenessProbe" (.Values.rollout.livenessProbe | default $defaultProbe) }}
{{- $_ := set $mainContainer "readinessProbe" (.Values.rollout.readinessProbe | default $defaultProbe) }}
{{- $env := fromYamlArray (include "airframe-application.workloadEnv" .) }}
{{- if $env }}{{- $_ := set $mainContainer "env" $env }}{{- end }}
{{- $envFrom := fromYamlArray (include "airframe-application.workloadEnvFrom" .) }}
{{- if $envFrom }}{{- $_ := set $mainContainer "envFrom" $envFrom }}{{- end }}
{{- $volumeMounts := fromYamlArray (include "airframe-application.workloadVolumeMounts" .) }}
{{- $volumes := fromYamlArray (include "airframe-application.workloadVolumes" .) }}
{{- if $volumeMounts }}{{- $_ := set $mainContainer "volumeMounts" $volumeMounts }}{{- end }}
{{- $containers := list $mainContainer }}
{{- range .Values.rollout.extraContainers }}{{- $containers = append $containers . }}{{- end }}
{{- $podSpec := dict "containers" $containers "serviceAccountName" (include "airframe-application.serviceAccountName" .) }}
{{- if $volumes }}{{- $_ := set $podSpec "volumes" $volumes }}{{- end }}
{{- if .Values.rollout.podSecurityContext }}{{- $_ := set $podSpec "securityContext" .Values.rollout.podSecurityContext }}{{- end }}
{{- if .Values.rollout.podSpec }}
{{- if hasKey .Values.rollout.podSpec "containers" }}
{{- fail "rollout.podSpec must not set containers - use the curated container fields (command/args/ports/livenessProbe/...) for the main container, or rollout.extraContainers for sidecars. mergeOverwrite replaces whole arrays rather than merging by index, so podSpec.containers would replace the chart-rendered container list instead of extending it." }}
{{- end }}
{{- $podSpec = mergeOverwrite $podSpec .Values.rollout.podSpec }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.appName }}
  namespace: {{ include "airframe-application.namespace" . }}
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: workload
    {{- if $releaseId }}
    hangar.io/release-tracked: "true"
    {{- end }}
    {{- with include "airframe-application.userMeta" (dict "root" $ "kind" "labels" "field" "rollout.labels" "map" .Values.rollout.labels) }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- $userAnnotations := include "airframe-application.userMeta" (dict "root" $ "kind" "annotations" "field" "rollout.annotations" "map" .Values.rollout.annotations) }}
  {{- if or $releaseId $userAnnotations }}
  annotations:
    {{- if $releaseId }}
    {{- /* Release identity for the Argo Rollouts notifications engine, which can read a
    Rollout's metadata (Argo CD's cannot). On the Rollout, never the pod template, so it never
    forces a new ReplicaSet. The label above is what the notification subscription selects.
    release-id is "<chain-id>:<cluster>/<env>" (glidepath's open-release-pr); app-namespace is
    the dev-cluster namespace holding the release record, joined by release-id. */}}
    hangar.io/release-id: {{ $releaseId | quote }}
    {{- with $.Values.releaseTracking.appNamespace }}
    hangar.io/app-namespace: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- with $userAnnotations }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  replicas: {{ .Values.rollout.replicas }}
  {{- /* Fast-track rollback (Argo Rollouts): going back to one of the last N revisions skips steps and analysis. */}}
  {{- with .Values.rollout.rollbackWindow }}
  rollbackWindow:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "airframe-application.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "airframe-application.labels" . | nindent 8 }}
        {{- with include "airframe-application.userMeta" (dict "root" $ "kind" "labels" "field" "rollout.podLabels" "map" .Values.rollout.podLabels) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- $otelRuntime := include "airframe-application.otelInjectRuntime" . }}
      {{- if or .Values.configMaps .Values.secrets .Values.rollout.podAnnotations $otelRuntime }}
      annotations:
        {{- /* OpenTelemetry Operator auto-instrumentation: the operator's pod webhook adds the agent at admission
        (fail-open, so pods still start if the operator is down). service.name and service.version come from
        app.kubernetes.io/name and /version (the Instrumentation sets useLabelsForResourceAttributes). */}}
        {{- if $otelRuntime }}
        instrumentation.opentelemetry.io/inject-{{ $otelRuntime }}: {{ .Values.observability.instrumentation | quote }}
        resource.opentelemetry.io/deployment.environment.name: {{ .Values.envName | quote }}
        {{- end }}
        {{- /* A new Rollout revision when config changes without changing the pod spec.
        checksum/configmaps hashes the rendered ConfigMaps (existingConfigMap content is
        out of sight). checksum/secrets hashes the ExternalSecret declaration only: a
        secret's value lives in Infisical, so rotating it does not roll the pods. */}}
        {{- if .Values.configMaps }}
        checksum/configmaps: {{ include (print $.Template.BasePath "/config/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.secrets }}
        checksum/secrets: {{ include (print $.Template.BasePath "/config/external-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with include "airframe-application.userMeta" (dict "root" $ "kind" "annotations" "field" "rollout.podAnnotations" "map" .Values.rollout.podAnnotations) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- toYaml $podSpec | nindent 6 }}
  strategy:
    {{- if eq .Values.rollout.strategy "blueGreen" }}
    {{- if not (and (kindIs "invalid" .Values.rollout.maxSurge) (kindIs "invalid" .Values.rollout.maxUnavailable)) }}
    {{- fail "rollout.maxSurge/maxUnavailable apply to the canary strategy only; blueGreen always runs a full preview ReplicaSet" }}
    {{- end }}
    blueGreen:
      {{- /* service.yaml always renders <appName> and <appName>-preview, so rollout.blueGreen
      may not rename them. */}}
      {{- if and .Values.rollout.blueGreen (or (hasKey .Values.rollout.blueGreen "activeService") (hasKey .Values.rollout.blueGreen "previewService")) }}
      {{- fail "rollout.blueGreen must not set activeService/previewService - service.yaml always renders {{appName}} and {{appName}}-preview, and the Rollout spec must reference those same fixed names. Use rollout.blueGreen for autoPromotionEnabled/scaleDownDelaySeconds/prePromotionAnalysis/postPromotionAnalysis/previewReplicaCount/antiAffinity instead." }}
      {{- end }}
      activeService: {{ .Values.appName }}
      previewService: {{ .Values.appName }}-preview
      {{- if .Values.rollout.blueGreen }}
      {{- toYaml .Values.rollout.blueGreen | nindent 6 }}
      {{- end }}
    {{- else }}
    canary:
      {{- /* Surge/unavailable while shifting. Unset keeps Argo Rollouts' defaults (25%/25%, which round to one extra
      pod even at replicas: 1). null means unset - kindIs "invalid", since 0 is a real value; maxSurge 0 + maxUnavailable 1 never runs two copies at once. */}}
      {{- if and (eq (toString .Values.rollout.maxSurge) "0") (eq (toString .Values.rollout.maxUnavailable) "0") }}
      {{- fail "rollout.maxSurge and rollout.maxUnavailable cannot both be 0: the Rollout could never replace a pod" }}
      {{- end }}
      {{- if not (kindIs "invalid" .Values.rollout.maxSurge) }}
      maxSurge: {{ .Values.rollout.maxSurge }}
      {{- end }}
      {{- if not (kindIs "invalid" .Values.rollout.maxUnavailable) }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
      {{- end }}
      {{- if .Values.rollout.canaryAnalysis }}
      analysis:
        {{- toYaml .Values.rollout.canaryAnalysis | nindent 8 }}
      {{- end }}
      steps:
        {{- if .Values.rollout.steps }}
        {{- toYaml .Values.rollout.steps | nindent 8 }}
        {{- else }}
        {{- /* No rollout.steps: one setWeight 100 step, an ordinary rolling update. */}}
        - setWeight: 100
        {{- end }}
    {{- end }}
{{- end }}
