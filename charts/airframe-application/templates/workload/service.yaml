{{/*
One Service targeting the Rollout's pods, one port per rollout.ports entry - the
first entry "doubles as the Service/ingress target" (§3). A second, `-preview`
Service is rendered only for strategy: blueGreen, matching what Argo Rollouts'
blueGreen.previewService actually needs (rollout.yaml references both names).
*/}}
{{- if eq (include "airframe-application.hasRollout" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: {{ include "airframe-application.namespace" . }}
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: workload
spec:
  selector:
    {{- include "airframe-application.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.rollout.ports }}
    - name: {{ .name }}
      port: {{ .containerPort }}
      targetPort: {{ .name }}
    {{- end }}
---
{{- if eq .Values.rollout.strategy "blueGreen" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}-preview
  namespace: {{ include "airframe-application.namespace" . }}
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: workload
spec:
  selector:
    {{- include "airframe-application.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.rollout.ports }}
    - name: {{ .name }}
      port: {{ .containerPort }}
      targetPort: {{ .name }}
    {{- end }}
{{- end }}
{{- end }}
