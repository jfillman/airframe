{{/*
The app's ServiceAccount, used by every pod the chart renders. registry-credentials is always added as a
pull secret: the platform distributes that Secret to every managed namespace.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "airframe-application.serviceAccountName" . }}
  namespace: {{ include "airframe-application.namespace" . }}
  labels:
    {{- include "airframe-application.labels" . | nindent 4 }}
    hangar.io/subcomponent: workload
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- $pullSecrets := append .Values.serviceAccount.imagePullSecrets (dict "name" "registry-credentials") }}
{{- with $pullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
