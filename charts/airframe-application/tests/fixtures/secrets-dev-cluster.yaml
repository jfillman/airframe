# secrets: on the dev cluster (clusterType: dev, the cluster's registry type): every entry reads the one shared
# store <app>-<cluster>, a non-shared one under an <envName>/ prefix. The cluster's name plays no part.
appName: guard-test
cluster: example-dev
clusterType: dev
envName: pr-12
secrets:
  - {name: API_KEY}
  - {name: SLACK_URL, shared: true}
