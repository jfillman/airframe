# secrets: on an upper cluster (clusterType: upper): a non-shared entry reads the per-env store
# <app>-<cluster>-<env>, a shared one the shared store, neither with a prefix.
appName: guard-test
cluster: example-prod
clusterType: upper
envName: staging
secrets:
  - {name: API_KEY}
  - {name: SLACK_URL, shared: true}
