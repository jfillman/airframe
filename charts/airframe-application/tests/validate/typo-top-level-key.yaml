components:
- name: cache
  spec:
    persistence: false
    size: small
  type: redis
- name: board-mq
  spec:
    brokerRef:
      name: skyport-broker
      namespace: app-skyport-broker-dev
    consume:
    - flights.events
    mode: attach
    queuePrefix: boarding
    vhost: flights
  type: rabbitmq
env:
- name: REDIS_URL
  value: redis://cache-master:6379
- name: FLIGHT_API_URL
  value: http://flight-api.app-flight-api-dev.svc.cluster.local:8080
- name: RABBITMQ_HOST
  valueFrom:
    configMapKeyRef:
      key: host
      name: board-mq-connection
- name: RABBITMQ_VHOST
  valueFrom:
    configMapKeyRef:
      key: vhost
      name: board-mq-connection
- name: RABBITMQ_USER
  valueFrom:
    secretKeyRef:
      key: username
      name: board-mq-user-credentials
- name: RABBITMQ_PASSWORD
  valueFrom:
    secretKeyRef:
      key: password
      name: board-mq-user-credentials
envName: dev
rolout:
  image:
    repository: ghcr.io/jfillman/boarding-api
    tag: 1.1.0-8f9acd8
secrets:
- key: REDIS_PASSWORD
  name: redis-password
