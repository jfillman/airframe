# airframe-application default values.
#
# GENERATED FILE - do not hand-edit. Source of truth: values.schema.json (AF-2).
# Regenerate with: python3 tools/gen_airframe_schema.py --write-values
# CI runs the same generator with --check and fails if this file would change.

# This application's name. Used as the Helm release name's basis, the default ServiceAccount name, and
# the default databaseName for a PostgreSQL component. A DNS-1123 label: lowercase alphanumeric and
# hyphens, must start and end with an alphanumeric.
appName: ''

# app runs a workload; infra is a components-only service. A label for people and tools: the chart
# decides what to render from rollout.enabled, not from this.
appType: app

# This cluster's name in the cluster registry, which is also its kubectl context name. Used to name
# this app's SecretStores (<appName>-<cluster>) and to label what the chart renders. The
# ApplicationEnvironment composition writes it for Flight environments and Glidepath sets it for
# Ground environments; never a literal in the chart.
cluster: ''

# The environment name (dev, staging, prod, or a PR number). Named envName, not env, because env is
# already this schema's top-level container env-var list - a same-named field would collide in one
# flat values map.
envName: ''

# This cluster's role, copied from its cluster-registry record's `type` (dev: the control-plane
# cluster that hosts Ground environments and the one shared SecretStore per app; upper: any other
# cluster). Decides where secrets: entries are read from. The chart compares no cluster names.
# Required whenever secrets: is non-empty: the render fails without it rather than guess.
# ApplicationEnvironment writes upper for Flight environments; Glidepath sets dev for Ground
# environments.
clusterType: ''

# The platform's environment-namespace convention, as a pattern over {type}, {app} and {env} (it must
# contain {app} and {env}). The platform passes it, the same way it passes envName: Glidepath from its
# glidepath-app.envNamespacePattern helper for Ground and PR environments, the cluster's
# tenant-onboarding ApplicationSet for Flight environments. env[].fromService resolves another app's
# namespace with it, so the chart never hard-codes the convention. Empty means not passed: a
# fromService entry then fails the render rather than guess.
serviceNamespacePattern: ''

# Extra labels/annotations stamped on this release's own Namespace object.
namespace:
  # e.g. hangar.io/ephemeral-env: "true" for the PR-preview TTL sweep selector.
  labels: {}
  # Extra annotations on this release's Namespace object.
  annotations: {}

# Machine-owned: written by the release pipeline (Glidepath) into the release file, never by hand in a
# human-owned env file. Takes precedence over the deprecated rollout.image. No workload renders
# (Rollout/Service/ServiceMonitor) until both release.image fields are set.
release:
  # The image this release runs. repository and tag are required for a workload to render; digest pins
  # it; source records where it came from.
  image:
    # Image repository without a tag, e.g. ghcr.io/example-org/boarding-api (an example).
    repository: ''
    # Image tag.
    tag: ''
    # The image's manifest (index) digest, sha256:<hex>; empty means not pinned. When set the workload
    # runs repository:tag@digest, so the tag cannot move what runs (ADR-0029).
    digest: ''
    # Where the image was built and where its evidence was verified before promotion, without a tag, e.g.
    # ghcr.io/example-org/boarding-api (an example). Equal to repository until a separate Flight registry
    # is configured. Not rendered; read by the release gates and Tower.
    source: ''

# Opaque escape hatch, deliberately excluded from the strictness rule: written by glidepath's
# open-release-pr.yaml, never hand-authored. Null when this env hasn't gone through a release pipeline
# yet. Only releaseId and appNamespace are read (glidepath ADR-0021): releaseId is rendered onto the
# Rollout as the hangar.io/release-id annotation, with a hangar.io/release-tracked label, so the Argo
# Rollouts notifications engine can report the release; appNamespace is the dev-cluster namespace of
# the release record. Older release files also carry relayUrl, relayHostAliasIP, configJsonB64 and
# other fields for the removed hook Jobs; they are ignored. Setting releaseTracking on a release with
# no Rollout fails the render.
releaseTracking: null

# Kubernetes ServiceAccount for every workload this chart renders.
serviceAccount: {annotations: {}, create: true, imagePullSecrets: [], name: '', projectedTokens: []}

# Unused since the release-tracking hook Jobs and their relay-token ExternalSecret were removed
# (glidepath ADR-0021 phase 3b); kept so existing env files that set it still validate.
platformSecretStore: {kind: ClusterSecretStore, name: platform-secret-store}

# The Argo Rollout workload. Use rollout.enabled: false for an environment with no long-running
# service; null is read the same way.
rollout:
  # Whether this environment runs a long-running service at all. false means only Jobs, CronJobs and
  # components: no Rollout, Service, HPA or PDB, and Glidepath refuses to release an image to it. The
  # rest of rollout: is kept, so turning it back on restores the same settings. Whether anything is
  # deployed yet is not this field: that is release.image (the release file). rollout: null still means
  # false, for older files.
  enabled: true
  # DEPRECATED: use release.image instead. Still read when release.image is not set.
  image:
    # Image repository without a tag.
    repository: ''
    # Image tag.
    tag: ''
  # Desired pod count.
  replicas: 2
  # Container resources for the main workload.
  resources: {}
  # canary (the default) or blueGreen.
  strategy: canary
  # Raw passthrough escape hatch - a real Argo Rollouts canary/blueGreen step list
  # (setWeight/pause/analysis/experiment). Tower's Config tab offers a structured builder for the common
  # shapes but falls back to raw YAML for anything else, matching this schema's own looseness here.
  # Empty renders one setWeight: 100 step, an ordinary rolling update.
  steps: []
  # Raw passthrough - spec.strategy.canary.analysis. Typical shape: {templates: [{templateName}], args:
  # [...], startingStep}. Rendered only when strategy is canary and this is non-empty.
  canaryAnalysis: {}
  # Raw passthrough for the blueGreen strategy block, minus activeService/previewService (chart-owned).
  # Rendered only when strategy is blueGreen.
  blueGreen: {}
  # spec.rollbackWindow: a change back to one of the Rollout's last `revisions` revisions skips the
  # canary steps and analysis and goes straight to 100% (Argo Rollouts' fast-track rollback). That
  # revision already ran here; a Glidepath rollback (ADR-0021 phase 4) is exactly that case. null turns
  # it off (an empty object does not: Helm merges it with this default).
  rollbackWindow: {revisions: 3}
  # How many pods above replicas the canary may add while it shifts (Argo Rollouts
  # spec.strategy.canary.maxSurge): an integer or a percentage. null (the default): Argo Rollouts'
  # default, 25%, which rounds up to 1 extra pod even at replicas: 1. Set 0 (with maxUnavailable 1) for
  # a single-replica app that must never run two copies at once, or on a node with no room for a second
  # pod; the old pod stops before the new one starts, a short outage. Canary only; blueGreen always runs
  # a preview ReplicaSet.
  maxSurge: null
  # How many pods below replicas the canary may drop to while it shifts
  # (spec.strategy.canary.maxUnavailable): an integer or a percentage. null (the default): Argo
  # Rollouts' default. maxSurge and maxUnavailable cannot both be 0. Canary only.
  maxUnavailable: null
  # Overrides the container's entrypoint.
  command: []
  # Overrides the container's command args.
  args: []
  # Container ports to expose on the main workload.
  ports: [{containerPort: 8080, name: http}]
  # Empty object ({}) renders the default probe, an HTTP GET of / on the first port. Exactly one of
  # httpGet/tcpSocket/exec when non-empty.
  livenessProbe: {}
  # Empty object ({}) renders the default probe, an HTTP GET of / on the first port. Exactly one of
  # httpGet/tcpSocket/exec when non-empty.
  readinessProbe: {}
  # Raw passthrough - Kubernetes PodSecurityContext, not modeled field-by-field here. Defaults to
  # non-root UID/GID 65532, the same IDs as Tower's break-glass debug container, so its process access
  # can read the app's files through /proc/1/root. Keys you set merge onto this default (Helm merges
  # maps); null drops it entirely, e.g. for an image that must run as root.
  podSecurityContext: {fsGroup: 65532, runAsGroup: 65532, runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
  # Raw passthrough - Kubernetes SecurityContext for the main container, not modeled field-by-field
  # here. Keys you set merge onto this default; null drops it.
  containerSecurityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
  # Raw passthrough - additional container specs, appended as-is.
  extraContainers: []
  # Raw passthrough map, deep-merged last onto .spec.template.spec. NOT for containers[0] (use the
  # curated fields above) or additional containers (use extraContainers).
  podSpec: {}
  # Extra labels on the Rollout object itself. Must not set a label the chart owns (app.kubernetes.io/*,
  # hangar.io/*, helm.sh/chart): the render fails with the key named.
  labels: {}
  # Extra annotations on the Rollout object itself.
  annotations: {}
  # Extra labels on the pod template (so on every pod). Must not set a label the chart owns; the
  # selector labels in particular can never change.
  podLabels: {}
  # Extra annotations on the pod template (so on every pod), for example Prometheus scrape hints, Vault
  # or Reloader settings. Changing one rolls the pods, like any pod template change. checksum/configmaps
  # and checksum/secrets are chart-owned.
  podAnnotations: {}
  # Extra labels on the Service (and the -preview Service for blueGreen). Must not set a label the chart
  # owns.
  serviceLabels: {}
  # Extra annotations on the Service (and the -preview Service for blueGreen).
  serviceAnnotations: {}

# App-specific Argo Rollouts AnalysisTemplates, rendered in this namespace. Reference them by name
# from rollout.steps or rollout.canaryAnalysis; the chart does not wire them in.
analysisTemplates: []

# Container environment variables for the main workload.
env: []

# ConfigMaps mounted or projected as env vars into the main workload.
configMaps: []

# Secrets, aggregated into one app-secrets Secret via ExternalSecret/ClusterSecretStore, consumed by
# the main container.
secrets: []

# AI-triage diagnosis notifications, threaded into the RolloutWatch XR this chart renders
# unconditionally.
notifications:
  # Slack notification settings for AI-triage diagnosis.
  slack:
    # Turns this feature on.
    enabled: false
    # e.g. #your-channel. Optional; the webhook's own configured default is used otherwise.
    channel: ''

# PVC-backed volumes for the main workload.
volumes: []

# Scheduled batch tasks (nightly cleanup, report generation, ...). Share
# env/secrets/configMaps/volumes with the main container automatically.
cronJobs: []

# One-off batch tasks - the common 'run a DB migration before the new Rollout comes up' pattern. Same
# image/env/secrets/configMaps/volumes defaulting as cronJobs.
jobs: []

# HorizontalPodAutoscaler settings for the main workload.
autoscaling: {enabled: false, max: 10, min: 2, targetCPUPercent: 70}

# Set at most one of minAvailable/maxUnavailable.
podDisruptionBudget: {enabled: false, maxUnavailable: null, minAvailable: 1}

# Classic Ingress. Gateway API (httpRoute below) is the mechanism most new callers actually want on
# this fleet's real clusters.
ingress: {annotations: {}, enabled: false, host: '', path: /, pathType: Prefix, tls: false, tlsSecretName: ''}

# Gateway API HTTPRoute, first-class alongside classic ingress. This platform's convention:
# <app>.<cluster-or-env-qualifier>.<fleet domain> (the fleet's own local DNS suffix; nothing here
# assumes one).
httpRoute: {annotations: {}, enabled: false, hostnames: [], parentRefs: [], path: /, pathType: PathPrefix}

# Prometheus scraping of the main workload's first rollout.ports entry, via kube-prometheus-stack. Off
# by default: Hangar apps send metrics and traces over OTLP to the cluster's collector, and a scrape
# of an app that serves no /metrics is a target that is always down (and a 404 traced every 30s). Turn
# it on for an app that exposes Prometheus metrics.
serviceMonitor: {additionalLabels: {}, enabled: false, interval: 30s, path: /metrics, port: ''}

# The cluster's observability stack, as the tenant-onboarding ApplicationSet passes it (from Apron's
# cluster config and the app's kind). Empty fields turn each part off, so a cluster without the stack,
# or a Ground environment, renders exactly as before.
observability: {instrumentation: '', namespace: '', runtime: ''}

# Traffic policy for the main workload's namespace.
networkPolicy: {allowEgressTo: [], allowIngressFrom: [], allowIngressFromIngressController: true, enabled: true, extraEgressRules: [], extraIngressRules: [], ingressControllerNamespaceSelector: {matchLabels: {kubernetes.io/metadata.name: hangar-gateway}}}

# Attached-tier component instances (Redis, PostgreSQL, RabbitMQ, ...). Each entry's spec is validated
# against that component's own XRD schema by the compiled schema (airframe_schema.compiled_schema()),
# not by this file directly - see tools/airframe-validate.
components: []

# Rendered into the SLO XRD (xrds/slo.yaml), which wraps Sloth. No window/burn-rate fields here -
# Sloth computes those from just objective.
slos: []

# The apiVersion group used to look up component/SLO XRs by componentKinds. Update here, not
# per-template, if the group ever changes.
attachedResourceApiVersion: catalog.hangar.io/v1alpha1

# Deliberate lookup map exception: component type string -> XR kind. A new component kind needs a row
# here, not a template change.
componentKinds: {dex: Dex, mongodb: MongoDB, postgresql: PostgreSQL, rabbitmq: RabbitMQ, redis: Redis}

# Last-resort escape hatch - a raw list of arbitrary Kubernetes objects, rendered as-is, no labels
# stamped.
extraManifests: []
