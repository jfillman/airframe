{{/*
templates/relay-token-external-secret.yaml - real ESO-managed
platform-outcome-relay-token Secret airframe-application's release-tracking Jobs
read (charts/airframe-application/templates/release-tracking/hooks.yaml). Split out
of airframe-application into this separate chart/Application on 2026-09-18 - see
this chart's Chart.yaml and rbac.yaml (same directory) for the full incident this
fixes.

Deliberately a plain resource, no hook annotation - unlike airframe-application's
old copy of this file, which needed PreSync (then briefly PreSync,PostSync,SyncFail,
reverted) specifically to win a race against its OWN chart's PreSync hook Jobs
within the SAME Application. That race doesn't exist here: this chart has no hook
Jobs of its own, so there's nothing within THIS Application's sync this resource
needs to precede - it just needs to exist before airframe-application's hooks run,
which (after the very first onboarding sync of both Applications - see Chart.yaml)
it always already does.

Sourced from this cluster's own platform-cicd Infisical project via
.Values.platformSecretStore - same ClusterSecretStore airframe-application's old
copy used, hand-authored per docs/admin/secrets-management.md. The token value
itself still has to be planted into Infisical by hand once per cluster; this only
removes the N-times-per-app manual Secret copy.
*/}}
{{- if .Values.releaseTracking }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-outcome-relay-token
  namespace: {{ include "airframe-identity.namespace" . }}
  labels:
    {{- include "airframe-identity.labels" . | nindent 4 }}
    hangar.io/subcomponent: outcome-hook
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.platformSecretStore.name }}
    kind: {{ .Values.platformSecretStore.kind }}
  target:
    name: platform-outcome-relay-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform-outcome-relay-token
{{- end }}
