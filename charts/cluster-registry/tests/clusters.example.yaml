infisical:
  orgId: 00000000-0000-0000-0000-000000000001
  url: http://infisical.example:31800/api
  inClusterUrl: http://infisical.infisical.svc.cluster.local:8080/api
clusters:
  - name: kind-dev
    zone: lower
    roles: [control-plane, workloads]
    tenantsRepo: gitops-cluster-dev-tenants
    aliases: [kiac-dev]
    airframe: { cicdReady: true, infisicalHost: true, autopilotReady: true }
  - name: kind-prod
    zone: upper
    roles: [workloads, platform-services]
    airframe: { crossplaneReady: true }
    glidepath: { relaySecretName: cluster-kind-prod-relay-token }
