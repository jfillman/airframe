# The fleet's cluster records, normally the hub cluster repo's clusters.yaml passed as a value file (the format is
# documented in apron's docs/clusters-file.md; Glidepath reads the same file). This chart reads the shared fields and
# each record's `airframe:` section, and ignores everything else - so an install without Glidepath needs only those.
#
# - name: example-prod
#   zone: upper                      # lower | upper (glidepath ADR-0024)
#   roles: [workloads]               # control-plane | workloads | platform-services
#   tenantsRepo: gitops-cluster-example-prod-tenants
#   aliases: []                      # other names this cluster also answers to (one ConfigMap each)
#   airframe: { crossplaneReady: true }   # cicdReady, crossplaneReady, infisicalHost, autopilotReady (dev only)
#   serviceAccountIssuer: https://issuer.example/oidc/example-prod   # optional: the cluster's public issuer
clusters: []
# The fleet's one Infisical server (review C9): the top-level `infisical:` block of the same clusters.yaml.
#   infisical:
#     orgId: <uuid>                    # the organization every app's Infisical project lives in
#     url: http://host:port/api        # how a cluster that does NOT host Infisical reaches its API
#     inClusterUrl: http://svc...:8080/api   # how the cluster marked airframe.infisicalHost reaches it
# Rendered into every record as infisicalUrl (inClusterUrl on the infisicalHost cluster, url elsewhere) and
# infisicalOrgId; the SecretStore Composition reads both instead of hard-coding them.
infisical: {}

# The AWS account cloud targets live in: the top-level `aws:` block of the same clusters.yaml. Optional.
#   aws:
#     accountId: "123456789012"                       # quoted: 12 digits, a leading zero must survive
#     permissionsBoundaryPolicy: HangarCloudTargetBoundary   # customer managed policy name in that account
# Rendered into every record as awsAccountId and awsPermissionsBoundaryArn. The AwsLambdaTarget and AwsEcsTarget
# Compositions put that boundary on every IAM role they create; the Crossplane identity's policy refuses any other
# (airframe docs/admin/cloud-credentials.md).
aws: {}

# Where the fleet's repos live: the top-level `scm:` block of the same clusters.yaml. Required once any cluster is set.
#   scm:
#     owner: example-org             # GitHub user or organization: every app, gitops-<app> and tenants repo lives here
# Rendered into every record as scmOwner. The Bootstrap-tier, TektonCICD and ApplicationEnvironment Compositions build
# repo URLs and Go module paths from it instead of hard-coding an owner.
scm: {}

# Where the Compositions look the records up (ExtraResources matchName in crossplane-system).
namespace: crossplane-system
