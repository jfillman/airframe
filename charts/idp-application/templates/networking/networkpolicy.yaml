{{/*
Default reflects §3's "isolate traffic to its own namespace": deny cross-namespace
ingress except same-namespace pods and (when ingress.enabled OR httpRoute.enabled)
the ingress/Gateway data plane; egress left open by default - so Egress is
deliberately NOT in policyTypes unless allowEgressTo/extraEgressRules adds a real
rule (an empty policyTypes: [Egress] would mean "deny all egress", the opposite of
the documented default). Both toggles share the one selector/namespace - real gap
found live 2026-09-06 rolling out httpRoute: (checkout-api's first HTTPRoute got
Accepted/ResolvedRefs by the Gateway but every real request 504'd - this rule only
checked ingress.enabled, so a release with httpRoute.enabled: true and classic
ingress.enabled: false/default never allow-listed the Gateway's own data-plane
namespace at all). See values.yaml's networkPolicy.ingressControllerNamespaceSelector
comment for the current confirmed value.

allowIngressFrom:/allowEgressTo: (idp-application.networkPolicyPeer/
networkPolicyPorts, added 2026-08-13) render one self-contained rule per entry -
extraIngressRules:/extraEgressRules: (raw NetworkPolicyIngressRule/EgressRule
passthrough, unchanged) remain the escape hatch for anything the simplified shape
can't express.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.appName }}
  namespace: {{ include "idp-application.namespace" . }}
  labels:
    {{- include "idp-application.labels" . | nindent 4 }}
    platform.io/subcomponent: networking
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    {{- if or .Values.networkPolicy.allowEgressTo .Values.networkPolicy.extraEgressRules }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - podSelector: {}
        {{- if and .Values.networkPolicy.allowIngressFromIngressController (or .Values.ingress.enabled .Values.httpRoute.enabled) }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 12 }}
        {{- end }}
    {{- range .Values.networkPolicy.allowIngressFrom }}
    - from:
        - {{- include "idp-application.networkPolicyPeer" . | nindent 10 }}
      {{- if .ports }}
      ports:
        {{- include "idp-application.networkPolicyPorts" . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- range .Values.networkPolicy.extraIngressRules }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if or .Values.networkPolicy.allowEgressTo .Values.networkPolicy.extraEgressRules }}
  egress:
    {{- range .Values.networkPolicy.allowEgressTo }}
    - to:
        - {{- include "idp-application.networkPolicyPeer" . | nindent 10 }}
      {{- if .ports }}
      ports:
        {{- include "idp-application.networkPolicyPorts" . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- range .Values.networkPolicy.extraEgressRules }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
