# SHARED PARTIAL (compositions/_shared/render-github-resources/secretstore-xr.yaml): every application composition's
# templates/render-github-resources/secretstore-xr.yaml is a symlink to this file, so the six compositions cannot drift apart
# again (review C3: four 'identical' templates had grown four to five variants). Per-composition
# differences come in through the variables that templates/render-github-resources/00-inputs.yaml defines before this
# file is concatenated after it: none. Edit here, run tools/build-compositions, then
# tools/test_compositions.py and review every composition's expected/ diff.
#
# Commits a shared-mode SecretStore XR request for the app's dev cluster into
# tenants/<app>/xr-requests/secretstore.yaml in that cluster's tenants repo, where its
# xr-requests ApplicationSet applies it into app-<app>-cicd. The store exists as soon as the
# app is onboarded, before any release. The dev cluster gets only the shared store, never
# per-environment ones. $clusterOk, $tenantsRepo, $devCluster and $xrName come from
# 00-devcluster-gate.yaml, which checks spec.devCluster against the cluster registry.
#
# The content is deterministic, so overwriteOnCreate is safe here.
#
# No Delete in managementPolicies: the gate is a live lookup that can briefly come back empty.
# With Delete allowed, that would drop this file from the desired set, Crossplane would delete
# it, ArgoCD would prune the SecretStore it declares, and the Infisical resources would follow.
# That chain deleted two apps' Infisical projects through ApplicationEnvironment's copy of this
# file (secretstore-xrs.yaml).
<<- if $clusterOk >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-secretstore-xr
  annotations:
    <<setResourceNameAnnotation "secretstore-xr">>
spec:
  managementPolicies: ["Create", "Update", "Observe", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$tenantsRepo>>
    file: <<printf "tenants/%s/xr-requests/secretstore.yaml" $xrName>>
    overwriteOnCreate: true
    content: |
      apiVersion: catalog.hangar.io/v1alpha1
      kind: SecretStore
      metadata:
        name: <<printf "%s-%s" $xrName $devCluster>>
      spec:
        appRef:
          name: <<$xrName>>
        cluster: <<$devCluster>>
    commitMessage: <<printf "Onboard %s: add tenants/%s/xr-requests/secretstore.yaml" $xrName $xrName | toJson>>
<<- end >>
