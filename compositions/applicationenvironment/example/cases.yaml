# Render cases for tools/test_compositions.py: each renders example/<xr> with the listed required
# (extra) and observed fixtures and is compared with example/expected/<name>.yaml; `expect` adds
# readable assertions. Regenerate expectations with `tools/test_compositions.py --update <composition>`.
cases:
- name: gate-fail
  xr: xr-staging.yaml
  expect:
    conditions:
      ClusterReady: ClusterNotEligible
- name: staging-springboot
  xr: xr-staging.yaml
  required: &id001
  - cluster-registry-ready.yaml
  - springboot-app-exists.yaml
  expect:
    conditions:
      ClusterReady: ClusterEligible
      AppResolved: AppResolved
- name: staging-python
  xr: xr-staging.yaml
  required:
  - cluster-registry-ready.yaml
  - pythonapp-exists.yaml
  expect:
    conditions:
      AppResolved: AppResolved
- name: staging-go
  xr: xr-staging.yaml
  required:
  - cluster-registry-ready.yaml
  - goapp-exists.yaml
  expect:
    conditions:
      AppResolved: AppResolved
- name: staging-app-missing
  xr: xr-staging.yaml
  required:
  - cluster-registry-ready.yaml
  expect:
    conditions:
      ClusterReady: ClusterEligible
      AppResolved: AppNotFound
- name: scaffold-ready
  xr: xr-staging.yaml
  required: *id001
  observed:
  - observed-scaffold-ready.yaml
  expect:
    conditions: &id003
      ClusterReady: ClusterEligible
      AppResolved: AppResolved
    present: &id002
    - values-yaml
    status:
      scaffold:
        done: *id002
- name: scaffold-retired
  xr: xr-staging-scaffolded.yaml
  required: *id001
  expect:
    conditions: *id003
    absent: *id002
    status:
      scaffold:
        done: *id002
