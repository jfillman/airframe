# --required-resources fixture: simulates the real cluster-registry ConfigMap
# (rendered by charts/cluster-registry; example name example-prod) once a cluster
# admin has actually verified the scoped Crossplane+Attached-tier install and
# flipped crossplaneReady to "true" for real. Paired with xr-staging.yaml for the
# gate-pass render.
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-prod
  namespace: crossplane-system
  labels:
    hangar.io/cluster-registry: "true"
data:
  scmOwner: example-org
  type: upper
  crossplaneReady: "true"
