# xr-staging.yaml with clearanceGate: true: the environment's identity.yaml must carry `clearanceGate: true` (the
# tenant-onboarding ApplicationSet turns it into the opt-in annotation on the generated Application). Every other
# example leaves it off, and their identity.yaml has no such line.
apiVersion: catalog.hangar.io/v1alpha1
kind: ApplicationEnvironment
metadata:
  name: widget-service-example-prod-staging
  namespace: demo-apps
spec:
  appName: widget-service
  cluster: example-prod
  env: staging
  clearanceGate: true
