# ExtraResources lookup resolving which real XR kind $appName actually is - one of
# NodeJSApplication, SpringBootApplication, PythonApplication, GoApplication or InfraService
# (InfraService added 2026-09-25: skyport-broker's kind-prod env sat at "Unready resources:
# app-usage" because its Usage pointed at a NodeJSApplication that doesn't exist).
# Added once SpringBootApplication went from "future" (xrds/applicationenvironment.yaml's
# own appName description already anticipated it, written before either existed) to
# real and app-usage.yaml's previously-hardcoded `kind: NodeJSApplication` was found
# live to break it. Extended again for PythonApplication/GoApplication - found live
# the same way: search-api-kind-prod-prod's Usage resolved to `of: {kind:
# NodeJSApplication}` (this gate's own prior default-if-neither-resolves fallback),
# which doesn't exist for a PythonApplication-owned app, stuck at Ready: False the
# same way order-api's did before this gate existed at all.
#
# That hardcoding wasn't just wrong labeling: app-usage.yaml's own header claimed a
# Usage whose `of` target doesn't exist is "simply never matched...harmless no-op" -
# true only for the deletion-protection webhook's purpose. In practice the Usage
# controller never sets a status.conditions[Ready] on an unmatched Usage, and
# function-auto-ready gates THIS composite's own Ready condition on every composed
# resource reaching Ready - so a SpringBootApplication-owned env stayed
# "Unready resources: app-usage" forever. Confirmed live: order-api-kind-prod-prod
# stuck at Ready: False until this fix; checkout-api-kind-prod-prod (a real
# NodeJSApplication) unaffected throughout, its Usage already Ready: True.
#
# Four separate ExtraResources requirements, not one - Crossplane requirements are
# typed per GVK, no "try kind A, fall back to kind B, ..." primitive exists. Defaults
# to NodeJSApplication if none resolve yet - same "not found yet, retry next
# reconcile" two-pass shape every other gate in this Composition already has, and
# preserves this Composition's prior behavior for the common case.
#
# $appName/$xrNamespace redeclared locally rather than reused from 00-cluster-gate.yaml
# - matches this catalog's existing per-file redeclaration convention (see
# compositions/secretstore's own templates, each independently redeclaring $spec/
# $appName), and keeps this file's own alphabetical position (globbed before
# app-usage.yaml, which is all that actually matters) independent of
# 00-cluster-gate.yaml's.
#
# Phase C: the old catalog.idp.io group is retired, so only catalog.hangar.io is looked up (five
# ExtraResources requirements, one per app kind). $appGroup is still threaded into app-usage.yaml's
# of.apiVersion.
<<- $spec := .observed.composite.resource.spec >>
<<- $appName := $spec.appName >>
<<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
<<- $allExtra := .extraResources | default dict >>
<<- $nodejsHangarEntry := index $allExtra "app-kind-nodejs-hangar" | default dict >>
<<- $nodejsHangarItems := index $nodejsHangarEntry "items" | default list >>
<<- $springbootHangarEntry := index $allExtra "app-kind-springboot-hangar" | default dict >>
<<- $springbootHangarItems := index $springbootHangarEntry "items" | default list >>
<<- $pythonHangarEntry := index $allExtra "app-kind-python-hangar" | default dict >>
<<- $pythonHangarItems := index $pythonHangarEntry "items" | default list >>
<<- $goHangarEntry := index $allExtra "app-kind-go-hangar" | default dict >>
<<- $goHangarItems := index $goHangarEntry "items" | default list >>
<<- $infraHangarEntry := index $allExtra "app-kind-infra-hangar" | default dict >>
<<- $infraHangarItems := index $infraHangarEntry "items" | default list >>
<<- $appKind := "NodeJSApplication" >>
<<- $appGroup := "catalog.hangar.io" >>
<<- if gt (len $nodejsHangarItems) 0 >>
  <<- $appKind = "NodeJSApplication" >>
  <<- $appGroup = "catalog.hangar.io" >>
<<- else if gt (len $springbootHangarItems) 0 >>
  <<- $appKind = "SpringBootApplication" >>
  <<- $appGroup = "catalog.hangar.io" >>
<<- else if gt (len $pythonHangarItems) 0 >>
  <<- $appKind = "PythonApplication" >>
  <<- $appGroup = "catalog.hangar.io" >>
<<- else if gt (len $goHangarItems) 0 >>
  <<- $appKind = "GoApplication" >>
  <<- $appGroup = "catalog.hangar.io" >>
<<- else if gt (len $infraHangarItems) 0 >>
  <<- $appKind = "InfraService" >>
  <<- $appGroup = "catalog.hangar.io" >>
<<- end >>
apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
kind: ExtraResources
requirements:
  app-kind-nodejs-hangar:
    apiVersion: catalog.hangar.io/v1alpha1
    kind: NodeJSApplication
    namespace: <<$xrNamespace>>
    matchName: <<$appName>>
  app-kind-springboot-hangar:
    apiVersion: catalog.hangar.io/v1alpha1
    kind: SpringBootApplication
    namespace: <<$xrNamespace>>
    matchName: <<$appName>>
  app-kind-python-hangar:
    apiVersion: catalog.hangar.io/v1alpha1
    kind: PythonApplication
    namespace: <<$xrNamespace>>
    matchName: <<$appName>>
  app-kind-go-hangar:
    apiVersion: catalog.hangar.io/v1alpha1
    kind: GoApplication
    namespace: <<$xrNamespace>>
    matchName: <<$appName>>
  app-kind-infra-hangar:
    apiVersion: catalog.hangar.io/v1alpha1
    kind: InfraService
    namespace: <<$xrNamespace>>
    matchName: <<$appName>>
