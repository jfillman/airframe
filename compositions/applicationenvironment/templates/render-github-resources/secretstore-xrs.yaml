# Commits two SecretStore XR requests into this cluster's tenants repo
# (tenants/<app>/xr-requests/), where that cluster's xr-requests ApplicationSet applies them:
#   secretstore-shared.yaml   shared mode: the project and its wide store. Every environment of
#                             this app on this cluster writes the same file with the same
#                             content, so the repeated writes are harmless.
#   secretstore-<env>.yaml    per-environment mode: this environment's narrowed store.
# Both are gated on $clusterOk; $appName, $env, $cluster, $xrName and $tenantsRepo come from
# 00-cluster-gate.yaml.
#
# crossplane.io/external-name follows the observed object, and uses the computed
# "<repo>:<file>:" form only for a file that doesn't exist yet. It is quoted because the
# trailing colon is invalid plain YAML.
#
# No Delete in managementPolicies, on both. The cluster gate is a live lookup that can briefly
# come back empty. With Delete allowed, one environment's reconcile could delete the shared file
# the others still need, ArgoCD would prune that SecretStore, and its Infisical project would go
# with it. That deleted two apps' projects on 2026-09-16, before projects lost Delete as well.
<<- if $clusterOk >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-secretstore-shared-xr
  annotations:
    <<setResourceNameAnnotation "secretstore-shared-xr">>
    crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:%s:" $tenantsRepo (printf "tenants/%s/xr-requests/secretstore-shared.yaml" $appName)) (index (.observed.resources | default dict) "secretstore-shared-xr" | default dict)>>"
spec:
  managementPolicies: ["Create", "Update", "Observe", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$tenantsRepo>>
    file: <<printf "tenants/%s/xr-requests/secretstore-shared.yaml" $appName>>
    overwriteOnCreate: true
    content: |
      apiVersion: catalog.hangar.io/v1alpha1
      kind: SecretStore
      metadata:
        name: <<printf "%s-%s" $appName $cluster>>
      spec:
        appRef:
          name: <<$appName>>
        cluster: <<$cluster>>
    commitMessage: <<printf "Onboard %s %s: add tenants/%s/xr-requests/secretstore-shared.yaml" $appName $env $appName | toJson>>
---
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-secretstore-env-xr
  annotations:
    <<setResourceNameAnnotation "secretstore-env-xr">>
    crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:%s:" $tenantsRepo (printf "tenants/%s/xr-requests/secretstore-%s.yaml" $appName $env)) (index (.observed.resources | default dict) "secretstore-env-xr" | default dict)>>"
spec:
  managementPolicies: ["Create", "Update", "Observe", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$tenantsRepo>>
    file: <<printf "tenants/%s/xr-requests/secretstore-%s.yaml" $appName $env>>
    overwriteOnCreate: true
    content: |
      apiVersion: catalog.hangar.io/v1alpha1
      kind: SecretStore
      metadata:
        name: <<printf "%s-%s-%s" $appName $cluster $env>>
      spec:
        appRef:
          name: <<$appName>>
        cluster: <<$cluster>>
        environmentSlug: <<$env>>
    commitMessage: <<printf "Onboard %s %s: add tenants/%s/xr-requests/secretstore-%s.yaml" $appName $env $appName $env | toJson>>
<<- end >>
