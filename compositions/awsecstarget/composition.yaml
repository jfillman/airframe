                region: <<$region>>
                vpcIdRef:
                  name: <<$xrName>>-vpc
                tags:
                  Name: <<$family>>-public
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: Route
            metadata:
              name: <<$xrName>>-default-route
              annotations:
                <<setResourceNameAnnotation "route">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                destinationCidrBlock: 0.0.0.0/0
                routeTableIdRef:
                  name: <<$xrName>>-rt
                gatewayIdRef:
                  name: <<$xrName>>-igw
