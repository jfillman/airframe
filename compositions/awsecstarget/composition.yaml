# GENERATED FILE - do not hand-edit the pipeline's `input.inline.template` blocks below. Edit
# templates/render-target-resources/*.yaml or templates/target-status/*.yaml instead, then run
# ./build-composition.sh to regenerate this file.
#
# AwsEcsTarget: the minimum AWS infrastructure a container deploys into on ECS Fargate (execution
# role, an optional dedicated public network, cluster, task definition, service) - see
# xrds/awsecstarget.yaml's header. Two function-go-templating steps around function-auto-ready, the
# same shape as every Bootstrap-tier Composition in this catalog.
#
# Delimiters: << >> instead of Go's default {{ }}, matching every other Composition in this catalog.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: awsecstargets.catalog.hangar.io
spec:
  compositeTypeRef:
    apiVersion: catalog.hangar.io/v1alpha1
    kind: AwsEcsTarget
  mode: Pipeline
  pipeline:
    - step: render-target-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # Shared inputs for this step (Go template variables declared at this unindented scope persist for
            # the rest of the step's execution across the --- separators - the same concatenated-template
            # convention every multi-file Composition in this catalog uses; this file sorts first), followed by
            # the task execution role.
            #
            # Every managed resource in this directory references the AWS ClusterProviderConfig named `default`
            # (gitops-cluster-dev/10-crds-operators/crossplane/provider-aws-config.yaml).
            #
            # The execution role is what Fargate uses to pull the image and ship logs: AWS's own
            # AmazonECSTaskExecutionRolePolicy plus logs:CreateLogGroup, because the task definition asks the
            # awslogs driver to create its log group on first use (awslogs-create-group) - that keeps a
            # CloudWatch Logs provider out of the picture entirely.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $appName := $spec.appName | default $xrName >>
            <<- $env := $spec.env | default "dev" >>
            <<- $region := $spec.region | default "us-east-1" >>
            <<- $architecture := $spec.architecture | default "arm64" >>
            <<- $cpuArch := "ARM64" >>
            <<- if eq $architecture "x86_64" >><<- $cpuArch = "X86_64" >><<- end >>
            <<- $cpu := $spec.cpu | default "256" >>
            <<- $memory := $spec.memory | default "512" >>
            <<- $port := $spec.containerPort | default 8080 >>
            <<- $desired := 1 >>
            <<- if hasKey $spec "desiredCount" >><<- $desired = $spec.desiredCount >><<- end >>
            <<- $bootstrapImage := $spec.bootstrapImage | default "public.ecr.aws/nginx/nginx:stable-alpine" >>
            <<- $family := printf "%s-%s" $appName $env >>
            <<- $network := $spec.network | default dict >>
            <<- $networkMode := $network.mode | default "create" >>
            <<- $vpcCidr := $network.vpcCidr | default "10.42.0.0/16" >>
            <<- $subnetCidr := replace "/16" "/24" $vpcCidr >>
            <<- $az := $network.availabilityZone | default (printf "%sa" $region) >>
            <<- $tags := dict "hangar.io/target" $xrName "hangar.io/component" "aws-ecs-target" "hangar.io/app" $appName "hangar.io/env" $env >>
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            metadata:
              name: <<$xrName>>-exec
              annotations:
                <<setResourceNameAnnotation "iam-role">>
                crossplane.io/external-name: <<printf "%s-ecs-exec" (trunc 55 $family)>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                description: <<printf "ECS task execution role for %s (Airframe AwsEcsTarget %s)" $family $xrName | toJson>>
                assumeRolePolicy: |
                  {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs-tasks.amazonaws.com"},"Action":"sts:AssumeRole"}]}
                inlinePolicy:
                  - name: create-log-group
                    policy: |
                      {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["logs:CreateLogGroup"],"Resource":"*"}]}
                tags:
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: RolePolicyAttachment
            metadata:
              name: <<$xrName>>-exec-policy
              annotations:
                <<setResourceNameAnnotation "iam-role-policy">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                policyArn: arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
                roleRef:
                  name: <<$xrName>>-exec
            ---
            # network.mode: create (the default) - a dedicated, self-contained place for the task to run: one
            # VPC, one public subnet in one availability zone, an internet gateway, a default route and a
            # security group that opens containerPort to the internet. Deleting the XR removes all of it.
            # network.mode: existing renders nothing here; service.yaml uses the ids from spec instead.
            #
            # An allow-all egress rule IS composed, on purpose: AWS gives every new security group an allow-all
            # egress rule, but the Upbound provider (upjet over terraform-provider-aws) revokes it unconditionally
            # right after creating the group ("so users don't unknowingly have/use it"), leaving the group with no
            # egress at all. Without the rule below a Fargate task cannot reach ECR or CloudWatch Logs and never
            # starts (CannotPullContainerError). Both rules are SecurityGroupRule objects, not inline blocks, so
            # the provider never fights the group over them.
            <<- if eq $networkMode "create" >>
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: VPC
            metadata:
              name: <<$xrName>>-vpc
              annotations:
                <<setResourceNameAnnotation "vpc">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                cidrBlock: <<$vpcCidr>>
                enableDnsSupport: true
                enableDnsHostnames: true
                tags:
                  Name: <<$family>>
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: Subnet
            metadata:
              name: <<$xrName>>-subnet
              annotations:
                <<setResourceNameAnnotation "subnet">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                availabilityZone: <<$az>>
                cidrBlock: <<$subnetCidr>>
                mapPublicIpOnLaunch: true
                vpcIdRef:
                  name: <<$xrName>>-vpc
                tags:
                  Name: <<$family>>-public
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: InternetGateway
            metadata:
              name: <<$xrName>>-igw
              annotations:
                <<setResourceNameAnnotation "internet-gateway">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                vpcIdRef:
                  name: <<$xrName>>-vpc
                tags:
                  Name: <<$family>>
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: RouteTable
            metadata:
              name: <<$xrName>>-rt
              annotations:
                <<setResourceNameAnnotation "route-table">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                vpcIdRef:
                  name: <<$xrName>>-vpc
                tags:
                  Name: <<$family>>-public
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: Route
            metadata:
              name: <<$xrName>>-default-route
              annotations:
                <<setResourceNameAnnotation "route">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                destinationCidrBlock: 0.0.0.0/0
                routeTableIdRef:
                  name: <<$xrName>>-rt
                gatewayIdRef:
                  name: <<$xrName>>-igw
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: RouteTableAssociation
            metadata:
              name: <<$xrName>>-rta
              annotations:
                <<setResourceNameAnnotation "route-table-association">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                routeTableIdRef:
                  name: <<$xrName>>-rt
                subnetIdRef:
                  name: <<$xrName>>-subnet
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroup
            metadata:
              name: <<$xrName>>-sg
              annotations:
                <<setResourceNameAnnotation "security-group">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                name: <<$family>>-ecs
                description: <<printf "Fargate tasks of %s - containerPort open to the internet (Airframe AwsEcsTarget %s)" $family $xrName | toJson>>
                vpcIdRef:
                  name: <<$xrName>>-vpc
                tags:
                  Name: <<$family>>-ecs
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroupRule
            metadata:
              name: <<$xrName>>-sg-ingress
              annotations:
                <<setResourceNameAnnotation "security-group-ingress">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                type: ingress
                protocol: tcp
                fromPort: <<$port | int>>
                toPort: <<$port | int>>
                cidrBlocks:
                  - 0.0.0.0/0
                description: <<printf "%s containerPort" $family | toJson>>
                securityGroupIdRef:
                  name: <<$xrName>>-sg
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroupRule
            metadata:
              name: <<$xrName>>-sg-egress
              annotations:
                <<setResourceNameAnnotation "security-group-egress">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                type: egress
                protocol: "-1"
                fromPort: 0
                toPort: 0
                cidrBlocks:
                  - 0.0.0.0/0
                description: <<printf "%s outbound (image pull, logs, the app's own calls)" $family | toJson>>
                securityGroupIdRef:
                  name: <<$xrName>>-sg
            <<- end >>
            ---
            # The cluster, the first task-definition revision and the service.
            #
            # Task definition: Glidepath's deploy-ecs.yaml registers a NEW revision of this family on every
            # deploy, copying every field of the container definition and swapping only `image` - so the
            # container is named <appName> (the deploy.ecs.containerName the app's cicd.yaml must carry),
            # listens on containerPort, gets PORT in its environment, and logs to CloudWatch under
            # /ecs/<family> (the group is created on first use, see the role in 00-inputs-and-iam.yaml). No
            # command or entrypoint, because the real image would inherit it. containerDefinitions is a JSON
            # string field on the provider, hence the double toJson.
            #
            # Both the task definition and the service are composed WITHOUT the Update management policy:
            # deploy-ecs re-points the service at each new revision, and Crossplane must never revert that to
            # revision 1. trackLatest keeps the task-definition resource observing the newest ACTIVE revision
            # instead of the one it created.
            apiVersion: ecs.aws.m.upbound.io/v1beta1
            kind: Cluster
            metadata:
              name: <<$xrName>>-cluster
              annotations:
                <<setResourceNameAnnotation "ecs-cluster">>
                crossplane.io/external-name: <<$appName>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                tags:
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            <<- $container := dict "name" $appName "image" $bootstrapImage "essential" true >>
            <<- $_ := set $container "portMappings" (list (dict "containerPort" (int $port) "protocol" "tcp")) >>
            <<- $_ := set $container "environment" (list (dict "name" "PORT" "value" (toString (int $port)))) >>
            <<- $_ := set $container "logConfiguration" (dict "logDriver" "awslogs" "options" (dict "awslogs-group" (printf "/ecs/%s" $family) "awslogs-region" $region "awslogs-stream-prefix" "ecs" "awslogs-create-group" "true")) >>
            apiVersion: ecs.aws.m.upbound.io/v1beta1
            kind: TaskDefinition
            metadata:
              name: <<$xrName>>-taskdef
              annotations:
                <<setResourceNameAnnotation "task-definition">>
            spec:
              managementPolicies: ["Observe", "Create", "Delete", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                family: <<$family>>
                cpu: <<$cpu | quote>>
                memory: <<$memory | quote>>
                networkMode: awsvpc
                requiresCompatibilities:
                  - FARGATE
                runtimePlatform:
                  cpuArchitecture: <<$cpuArch>>
                  operatingSystemFamily: LINUX
                executionRoleArnRef:
                  name: <<$xrName>>-exec
                trackLatest: true
                containerDefinitions: <<list $container | toJson | toJson>>
                tags:
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ecs.aws.m.upbound.io/v1beta1
            kind: Service
            metadata:
              name: <<$xrName>>-service
              annotations:
                <<setResourceNameAnnotation "ecs-service">>
                crossplane.io/external-name: <<$family>>
            spec:
              managementPolicies: ["Observe", "Create", "Delete", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                clusterRef:
                  name: <<$xrName>>-cluster
                taskDefinitionRef:
                  name: <<$xrName>>-taskdef
                launchType: FARGATE
                platformVersion: LATEST
                desiredCount: <<$desired | int>>
                waitForSteadyState: false
                forceDelete: true
                networkConfiguration:
                  assignPublicIp: true
                  <<- if eq $networkMode "create" >>
                  subnetRefs:
                    - name: <<$xrName>>-subnet
                  securityGroupRefs:
                    - name: <<$xrName>>-sg
                  <<- else >>
                  subnets:
                    <<- range $network.subnetIds >>
                    - <<. | quote>>
                    <<- end >>
                  securityGroups:
                    <<- range $network.securityGroupIds >>
                    - <<. | quote>>
                    <<- end >>
                  <<- end >>
                tags:
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
    - step: target-status
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # TargetReady (closed reason set, see xrds/awsecstarget.meta.yaml) plus the XR's own status: the
            # names Glidepath's deploy.ecs block needs, the deploy block itself as text (status.cicd), and the
            # subnet/security-group ids a smoke test needs to find the task's public IP. The composite document
            # carries no composition-resource-name annotation, so function-go-templating updates the composite's
            # status instead of composing a resource.
            <<- $xr := .observed.composite.resource >>
            <<- $xrName := $xr.metadata.name >>
            <<- $spec := $xr.spec >>
            <<- $appName := $spec.appName | default $xrName >>
            <<- $env := $spec.env | default "dev" >>
            <<- $region := $spec.region | default "us-east-1" >>
            <<- $port := $spec.containerPort | default 8080 >>
            <<- $family := printf "%s-%s" $appName $env >>
            <<- $network := $spec.network | default dict >>
            <<- $networkMode := $network.mode | default "create" >>
            <<- $obs := .observed.resources | default dict >>
            <<- $ready := dict >>
            <<- range $name := list "task-definition" "ecs-service" "ecs-cluster" >>
              <<- $isReady := false >>
              <<- range (dig "resource" "status" "conditions" list (index $obs $name | default dict)) >>
                <<- if and (eq .type "Ready") (eq .status "True") >><<- $isReady = true >><<- end >>
              <<- end >>
              <<- $_ := set $ready $name $isReady >>
            <<- end >>
            <<- $subnetIds := list >>
            <<- $sgIds := list >>
            <<- if eq $networkMode "create" >>
              <<- $sid := dig "resource" "status" "atProvider" "id" "" (index $obs "subnet" | default dict) >>
              <<- if $sid >><<- $subnetIds = list $sid >><<- end >>
              <<- $gid := dig "resource" "status" "atProvider" "id" "" (index $obs "security-group" | default dict) >>
              <<- if $gid >><<- $sgIds = list $gid >><<- end >>
            <<- else >>
              <<- $subnetIds = $network.subnetIds | default list >>
              <<- $sgIds = $network.securityGroupIds | default list >>
            <<- end >>
            <<- $reason := "AwsEcsTargetProvisioning" >>
            <<- $status := "False" >>
            <<- $message := "Waiting for the network, execution role, cluster and task definition to be observed (just created, or the AWS provider has no credentials yet)." >>
            <<- if index $ready "ecs-service" >>
              <<- $reason = "AwsEcsTargetReady" >>
              <<- $status = "True" >>
              <<- $message = printf "ECS service %s on cluster %s (%s) runs task-definition family %s; Glidepath can deploy to it (status.cicd has the deploy block)." $family $appName $region $family >>
            <<- else if and (index $ready "task-definition") (index $ready "ecs-cluster") >>
              <<- $reason = "AwsEcsTargetServicePending" >>
              <<- $message = printf "Cluster %s and task definition %s exist; waiting for the service to report ready." $appName $family >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: TargetReady
                status: <<$status | quote>>
                reason: <<$reason>>
                message: <<$message | quote>>
                target: CompositeAndClaim
            ---
            apiVersion: <<$xr.apiVersion>>
            kind: AwsEcsTarget
            status:
              cluster: <<$appName>>
              service: <<$family>>
              taskDefinitionFamily: <<$family>>
              containerName: <<$appName>>
              region: <<$region>>
              containerPort: <<$port | int>>
              <<- if $subnetIds >>
              subnetIds:
                <<- range $subnetIds >>
                - <<. | quote>>
                <<- end >>
              <<- end >>
              <<- if $sgIds >>
              securityGroupIds:
                <<- range $sgIds >>
                - <<. | quote>>
                <<- end >>
              <<- end >>
              cicd: |
                deploy:
                  target: aws-ecs
                  ecs:
                    cluster: <<$appName>>
                    service: <<$family>>
                    containerName: <<$appName>>
                    region: <<$region>>
            ---
        delims:
          left: "<<"
          right: ">>"
