                tags:
                  Name: <<$family>>-public
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: InternetGateway
            metadata:
              name: <<$xrName>>-igw
              annotations:
                <<setResourceNameAnnotation "internet-gateway">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                vpcIdRef:
                  name: <<$xrName>>-vpc
                tags:
                  Name: <<$family>>
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: RouteTable
