            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: RouteTableAssociation
            metadata:
              name: <<$xrName>>-rta
              annotations:
                <<setResourceNameAnnotation "route-table-association">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                routeTableIdRef:
                  name: <<$xrName>>-rt
                subnetIdRef:
                  name: <<$xrName>>-subnet
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroup
            metadata:
              name: <<$xrName>>-sg
              annotations:
                <<setResourceNameAnnotation "security-group">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                name: <<$family>>-ecs
                description: <<printf "Fargate tasks of %s - containerPort open to the internet (Airframe AwsEcsTarget %s)" $family $xrName | toJson>>
                vpcIdRef:
                  name: <<$xrName>>-vpc
                tags:
                  Name: <<$family>>-ecs
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroupRule
            metadata:
              name: <<$xrName>>-sg-ingress
              annotations:
                <<setResourceNameAnnotation "security-group-ingress">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                type: ingress
                protocol: tcp
                fromPort: <<$port | int>>
                toPort: <<$port | int>>
                cidrBlocks:
                  - 0.0.0.0/0
                description: <<printf "%s containerPort" $family | toJson>>
                securityGroupIdRef:
                  name: <<$xrName>>-sg
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroupRule
            metadata:
              name: <<$xrName>>-sg-egress
              annotations:
                <<setResourceNameAnnotation "security-group-egress">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                type: egress
                protocol: "-1"
                fromPort: 0
                toPort: 0
                cidrBlocks:
                  - 0.0.0.0/0
                description: <<printf "%s outbound (image pull, logs, the app's own calls)" $family | toJson>>
                securityGroupIdRef:
                  name: <<$xrName>>-sg
            <<- end >>
            ---
            # The cluster, the first task-definition revision and the service.
            #
            # Task definition: Glidepath's deploy-ecs.yaml registers a NEW revision of this family on every
            # deploy, copying every field of the container definition and swapping only `image` - so the
            # container is named <appName> (the deploy.ecs.containerName the app's cicd.yaml must carry),
            # listens on containerPort, gets PORT in its environment, and logs to CloudWatch under
            # /ecs/<family> (the group is created on first use, see the role in 00-inputs-and-iam.yaml). No
            # command or entrypoint, because the real image would inherit it. containerDefinitions is a JSON
            # string field on the provider, hence the double toJson.
            #
            # Both the task definition and the service are composed WITHOUT the Update management policy:
            # deploy-ecs re-points the service at each new revision, and Crossplane must never revert that to
            # revision 1. trackLatest keeps the task-definition resource observing the newest ACTIVE revision
            # instead of the one it created.
            apiVersion: ecs.aws.m.upbound.io/v1beta1
            kind: Cluster
            metadata:
              name: <<$xrName>>-cluster
              annotations:
                <<setResourceNameAnnotation "ecs-cluster">>
                crossplane.io/external-name: <<$appName>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                tags:
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            <<- $container := dict "name" $appName "image" $bootstrapImage "essential" true >>
            <<- $_ := set $container "portMappings" (list (dict "containerPort" (int $port) "protocol" "tcp")) >>
            <<- $_ := set $container "environment" (list (dict "name" "PORT" "value" (toString (int $port)))) >>
            <<- $_ := set $container "logConfiguration" (dict "logDriver" "awslogs" "options" (dict "awslogs-group" (printf "/ecs/%s" $family) "awslogs-region" $region "awslogs-stream-prefix" "ecs" "awslogs-create-group" "true")) >>
            apiVersion: ecs.aws.m.upbound.io/v1beta1
            kind: TaskDefinition
            metadata:
              name: <<$xrName>>-taskdef
              annotations:
                <<setResourceNameAnnotation "task-definition">>
            spec:
              managementPolicies: ["Observe", "Create", "Delete", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                family: <<$family>>
                cpu: <<$cpu | quote>>
                memory: <<$memory | quote>>
                networkMode: awsvpc
                requiresCompatibilities:
                  - FARGATE
                runtimePlatform:
                  cpuArchitecture: <<$cpuArch>>
                  operatingSystemFamily: LINUX
                executionRoleArnRef:
                  name: <<$xrName>>-exec
                trackLatest: true
                containerDefinitions: <<list $container | toJson | toJson>>
                tags:
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ecs.aws.m.upbound.io/v1beta1
            kind: Service
            metadata:
              name: <<$xrName>>-service
              annotations:
                <<setResourceNameAnnotation "ecs-service">>
                crossplane.io/external-name: <<$family>>
            spec:
              managementPolicies: ["Observe", "Create", "Delete", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                clusterRef:
                  name: <<$xrName>>-cluster
                taskDefinitionRef:
                  name: <<$xrName>>-taskdef
                launchType: FARGATE
                platformVersion: LATEST
                desiredCount: <<$desired | int>>
                waitForSteadyState: false
                forceDelete: true
                networkConfiguration:
                  assignPublicIp: true
                  <<- if eq $networkMode "create" >>
                  subnetRefs:
                    - name: <<$xrName>>-subnet
                  securityGroupRefs:
                    - name: <<$xrName>>-sg
                  <<- else >>
                  subnets:
                    <<- range $network.subnetIds >>
                    - <<. | quote>>
                    <<- end >>
                  securityGroups:
                    <<- range $network.securityGroupIds >>
                    - <<. | quote>>
                    <<- end >>
                  <<- end >>
                tags:
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            # What Glidepath's deploy-ecs.yaml needs to deploy to this service with no stored key (2026-10-16, the ECS half of
            # ~/tech/SPEC-glidepath-deployer-federation.md; Airframe docs/admin/cloud-credentials.md).
            #
            # ECR repository <family> (the service's name): deploy-ecs copies every build here from ghcr.io, because Fargate can
            # pull a private image only from ECR (or with a Secrets Manager credential per task definition). The task's
            # execution role already may pull from it (AmazonECSTaskExecutionRolePolicy). forceDelete so deleting the XR removes
            # a repository that holds images - this target is disposable by design.
            #
            # Deploy role glidepath-deploy-ecs-<family cut to 43> (IAM's 64 characters: 21 + 43; deploy-ecs computes the same
            # name from deploy.ecs.service). Trust: AssumeRoleWithWebIdentity from the control-plane cluster's ServiceAccount
            # issuer, only for the ServiceAccount glidepath-cloud-deployer in this XR's namespace, only with audience
            # sts.amazonaws.com. Permissions: push to and read this repository; describe and register task definitions (ECS
            # can't narrow those by ARN: a new revision has none yet); describe and update this one service; pass this target's
            # execution role to ECS (registering a task definition that names it requires that). Nothing else. The fleet's
            # permissions boundary caps it again, and the Crossplane identity can't create it without that boundary.
            #
            # The role is created only once the registry carries the account, the boundary and the issuer (no access-key mode;
            # TargetReady then says AwsEcsTargetNeedsWebIdentity). Once it exists it is always rendered: if the registry can't be
            # read for a reconcile, it is re-declared from its own observed spec instead of being dropped, which would delete it
            # in AWS (business rule CRED-09).
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $repoName := $family >>
            <<- $clusterName := $appName >>
            <<- $deployRoleName := printf "glidepath-deploy-ecs-%s" (trunc 43 $family) >>
            <<- $execRoleName := printf "%s-ecs-exec" (trunc 55 $family) >>
            apiVersion: ecr.aws.m.upbound.io/v1beta1
            kind: Repository
            metadata:
              name: <<$xrName>>-repository
              annotations:
                <<setResourceNameAnnotation "ecr-repository">>
                crossplane.io/external-name: <<$repoName>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                imageTagMutability: MUTABLE
                forceDelete: true
                imageScanningConfiguration:
                  scanOnPush: false
                tags:
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            <<- $deployRoleObs := index (.observed.resources | default dict) "deploy-role" | default dict >>
            <<- if and $deployRoleObs (not (and $awsAccountId $awsBoundaryArn $saIssuer)) >>
            ---
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            metadata:
              name: <<$xrName>>-deploy
              annotations:
                <<setResourceNameAnnotation "deploy-role">>
                crossplane.io/external-name: <<dig "resource" "metadata" "annotations" "crossplane.io/external-name" $deployRoleName $deployRoleObs>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                <<- toYaml (dig "resource" "spec" "forProvider" dict $deployRoleObs) | nindent 4 >>
            <<- else if and $awsAccountId $awsBoundaryArn $saIssuer >>
            <<- $issuerHost := trimPrefix "https://" $saIssuer >>
            <<- $trust := dict "Version" "2012-10-17" "Statement" (list (dict
                  "Effect" "Allow"
                  "Principal" (dict "Federated" (printf "arn:aws:iam::%s:oidc-provider/%s" $awsAccountId $issuerHost))
                  "Action" "sts:AssumeRoleWithWebIdentity"
                  "Condition" (dict "StringEquals" (dict
                    (printf "%s:aud" $issuerHost) "sts.amazonaws.com"
                    (printf "%s:sub" $issuerHost) (printf "system:serviceaccount:%s:glidepath-cloud-deployer" $xrNamespace))))) >>
            <<- $repoArn := printf "arn:aws:ecr:%s:%s:repository/%s" $region $awsAccountId $repoName >>
            <<- $serviceArn := printf "arn:aws:ecs:%s:%s:service/%s/%s" $region $awsAccountId $clusterName $family >>
            <<- $execRoleArn := printf "arn:aws:iam::%s:role/%s" $awsAccountId $execRoleName >>
            <<- $policy := dict "Version" "2012-10-17" "Statement" (list
                  (dict "Sid" "EcrLogin" "Effect" "Allow" "Action" "ecr:GetAuthorizationToken" "Resource" "*")
                  (dict "Sid" "ThisRepository" "Effect" "Allow"
                    "Action" (list "ecr:BatchCheckLayerAvailability" "ecr:BatchGetImage" "ecr:GetDownloadUrlForLayer"
                                   "ecr:DescribeImages" "ecr:DescribeRepositories" "ecr:InitiateLayerUpload"
                                   "ecr:UploadLayerPart" "ecr:CompleteLayerUpload" "ecr:PutImage")
                    "Resource" $repoArn)
                  (dict "Sid" "TaskDefinitions" "Effect" "Allow"
                    "Action" (list "ecs:DescribeTaskDefinition" "ecs:RegisterTaskDefinition" "ecs:TagResource")
                    "Resource" "*"
                    "Condition" (dict "StringEquals" (dict "aws:RequestedRegion" $region)))
                  (dict "Sid" "ThisService" "Effect" "Allow"
                    "Action" (list "ecs:DescribeServices" "ecs:UpdateService")
                    "Resource" $serviceArn)
                  (dict "Sid" "PassThisExecutionRole" "Effect" "Allow"
                    "Action" "iam:PassRole"
                    "Resource" $execRoleArn
                    "Condition" (dict "StringEquals" (dict "iam:PassedToService" "ecs-tasks.amazonaws.com")))) >>
            ---
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            metadata:
              name: <<$xrName>>-deploy
              annotations:
                <<setResourceNameAnnotation "deploy-role">>
                crossplane.io/external-name: <<$deployRoleName>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                description: <<printf "Deploys the %s ECS service from %s (Airframe AwsEcsTarget %s)" $family $xrNamespace $xrName | toJson>>
                assumeRolePolicy: <<toJson $trust | quote>>
                inlinePolicy:
                  - name: deploy-this-service
                    policy: <<toJson $policy | quote>>
                permissionsBoundary: <<$awsBoundaryArn | quote>>
                tags:
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            <<- end >>
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
    - step: target-status
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # SHARED PARTIAL (compositions/_shared/render-target-resources/00-cloud-identity.yaml): the cloud-target compositions'
            # templates/render-target-resources/00-cloud-identity.yaml are symlinks to this file. Edit here, run
            # tools/build-compositions, then tools/test_compositions.py and review every affected composition's expected/ diff.
            #
            # Reads the fleet's AWS facts from the cluster registry (charts/cluster-registry, the hub's clusters.yaml): the
            # record of the control-plane cluster (type: dev), which is where these XRs, their Crossplane providers and the
            # Glidepath pipelines that deploy into them run. A cloud-target XR does not know its cluster's name, hence a label
            # selector and a filter rather than matchName.
            #
            #   $awsBoundaryArn  aws.permissionsBoundaryPolicy as an ARN. Every IAM role these compositions create carries it,
            #                    because the Crossplane identity's policy (HangarCrossplaneCloudTargets) refuses to create a role,
            #                    or grant one anything, without it (docs/admin/cloud-credentials.md).
            #   $awsAccountId    aws.accountId.
            #   $saIssuer        the control-plane cluster's public ServiceAccount issuer (serviceAccountIssuer), or "".
            #
            # All three are "" until the registry carries them, and the templates then render what they did before (no
            # boundary). The cloud account's policy, not this template, is what enforces the boundary.
            <<- $registryItems := index (.extraResources | default dict) "cluster-registry" | default dict >>
            <<- $awsBoundaryArn := "" >>
            <<- $awsAccountId := "" >>
            <<- $saIssuer := "" >>
            <<- range (index $registryItems "items" | default list) >>
              <<- $data := .resource.data | default dict >>
              <<- if eq (index $data "type" | default "") "dev" >>
                <<- $awsBoundaryArn = index $data "awsPermissionsBoundaryArn" | default "" >>
                <<- $awsAccountId = index $data "awsAccountId" | default "" >>
                <<- $saIssuer = index $data "serviceAccountIssuer" | default "" >>
              <<- end >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              cluster-registry:
                apiVersion: v1
                kind: ConfigMap
                namespace: crossplane-system
                matchLabels:
                  hangar.io/cluster-registry: "true"
            ---
            # TargetReady (closed reason set, see xrds/awsecstarget.meta.yaml) plus the XR's own status: the
            # names Glidepath's deploy.ecs block needs, the deploy block itself as text (status.cicd), and the
            # subnet/security-group ids a smoke test needs to find the task's public IP. The composite document
            # carries no composition-resource-name annotation, so function-go-templating updates the composite's
            # status instead of composing a resource.
            <<- $xr := .observed.composite.resource >>
            <<- $xrName := $xr.metadata.name >>
            <<- $spec := $xr.spec >>
            <<- $appName := $spec.appName | default $xrName >>
            <<- $env := $spec.env | default "dev" >>
            <<- $region := $spec.region | default "us-east-1" >>
            <<- $port := $spec.containerPort | default 8080 >>
            <<- $family := printf "%s-%s" $appName $env >>
            <<- $network := $spec.network | default dict >>
            <<- $networkMode := $network.mode | default "create" >>
            <<- $obs := .observed.resources | default dict >>
            <<- $ready := dict >>
            <<- range $name := list "task-definition" "ecs-service" "ecs-cluster" "ecr-repository" "deploy-role" >>
              <<- $isReady := false >>
              <<- range (dig "resource" "status" "conditions" list (index $obs $name | default dict)) >>
                <<- if and (eq .type "Ready") (eq .status "True") >><<- $isReady = true >><<- end >>
              <<- end >>
              <<- $_ := set $ready $name $isReady >>
            <<- end >>
            <<- $subnetIds := list >>
            <<- $sgIds := list >>
            <<- if eq $networkMode "create" >>
              <<- $sid := dig "resource" "status" "atProvider" "id" "" (index $obs "subnet" | default dict) >>
              <<- if $sid >><<- $subnetIds = list $sid >><<- end >>
              <<- $gid := dig "resource" "status" "atProvider" "id" "" (index $obs "security-group" | default dict) >>
              <<- if $gid >><<- $sgIds = list $gid >><<- end >>
            <<- else >>
              <<- $subnetIds = $network.subnetIds | default list >>
              <<- $sgIds = $network.securityGroupIds | default list >>
            <<- end >>
            <<- $reason := "AwsEcsTargetProvisioning" >>
            <<- $status := "False" >>
            <<- $message := "Waiting for the network, execution role, cluster, task definition, ECR repository and deploy role to be observed (just created, or the AWS provider has no credentials yet)." >>
            <<- $deployRoleObs := index $obs "deploy-role" | default dict >>
            <<- if and (not $deployRoleObs) (not (and $awsAccountId $awsBoundaryArn $saIssuer)) >>
              <<- $reason = "AwsEcsTargetNeedsWebIdentity" >>
              <<- $message = "This cluster has no web identity for AWS: its clusters.yaml entry needs aws.accountId, aws.permissionsBoundaryPolicy and serviceAccountIssuer (Airframe docs/admin/cloud-credentials.md). Glidepath deploys to an ECS service only through its deploy role; there is no access-key mode." >>
            <<- else if and (index $ready "ecs-service") (index $ready "deploy-role") (index $ready "ecr-repository") >>
              <<- $reason = "AwsEcsTargetReady" >>
              <<- $status = "True" >>
              <<- $message = printf "ECS service %s on cluster %s (%s) runs task-definition family %s; Glidepath can deploy to it (status.cicd has the deploy block)." $family $appName $region $family >>
            <<- else if and (index $ready "task-definition") (index $ready "ecs-cluster") >>
              <<- $reason = "AwsEcsTargetServicePending" >>
              <<- $message = printf "Cluster %s and task definition %s exist; waiting for the service, its ECR repository and its deploy role to report ready." $appName $family >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: TargetReady
                status: <<$status | quote>>
                reason: <<$reason>>
                message: <<$message | quote>>
                target: CompositeAndClaim
            ---
            apiVersion: <<$xr.apiVersion>>
            kind: AwsEcsTarget
            status:
              cluster: <<$appName>>
              service: <<$family>>
              taskDefinitionFamily: <<$family>>
              containerName: <<$appName>>
              region: <<$region>>
              containerPort: <<$port | int>>
              <<- if $subnetIds >>
              subnetIds:
                <<- range $subnetIds >>
                - <<. | quote>>
                <<- end >>
              <<- end >>
              <<- if $sgIds >>
              securityGroupIds:
                <<- range $sgIds >>
                - <<. | quote>>
                <<- end >>
              <<- end >>
              cicd: |
                deploy:
                  target: aws-ecs
                  ecs:
                    cluster: <<$appName>>
                    service: <<$family>>
                    containerName: <<$appName>>
                    region: <<$region>>
            ---
        delims:
          left: "<<"
          right: ">>"
