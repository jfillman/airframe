            kind: Role
            metadata:
              name: <<$xrName>>-deploy
              annotations:
                <<setResourceNameAnnotation "deploy-role">>
                crossplane.io/external-name: <<$deployRoleName>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                description: <<printf "Deploys the %s Lambda function from %s (Airframe AwsLambdaTarget %s)" $functionName $xrNamespace $xrName | toJson>>
                assumeRolePolicy: <<toJson $trust | quote>>
                inlinePolicy:
                  - name: deploy-this-function
                    policy: <<toJson $policy | quote>>
                permissionsBoundary: <<$awsBoundaryArn | quote>>
                tags:
                  hangar.io/target: <<$xrName>>
                  hangar.io/component: aws-lambda-target
            <<- end >>
            ---
            # The ECR repository deploy-lambda.yaml copies every build into. Named after the function: that
            # task finds the repository by reading the function's CURRENT image URI, so repository and function
            # are one unit here. forceDelete so deleting the XR removes a repository that holds images (the
            # bootstrap tag at least, every deployed build after that) - this target is disposable by design.
            #
            # Every managed resource in this directory references the AWS ClusterProviderConfig named
            # `default` (gitops-cluster-dev/10-crds-operators/crossplane/provider-aws-config.yaml) - the
            # cloud credential belongs to the provider, never to an XR.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $functionName := $spec.functionName | default $xrName >>
            <<- $region := $spec.region | default "us-east-1" >>
            apiVersion: ecr.aws.m.upbound.io/v1beta1
            kind: Repository
            metadata:
              name: <<$xrName>>-repository
              annotations:
                <<setResourceNameAnnotation "ecr-repository">>
                crossplane.io/external-name: <<$functionName>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                imageTagMutability: MUTABLE
                forceDelete: true
                imageScanningConfiguration:
                  scanOnPush: false
                tags:
                  hangar.io/target: <<$xrName>>
                  hangar.io/component: aws-lambda-target
            ---
            # A public Function URL (auth NONE) and the resource-policy statement that lets anyone invoke it
            # through that URL - what a smoke test curls. Rendered once the Function has been observed, so the
            # provider does not spend reconciles failing to resolve the reference. hasKey, not `default`: Sprig's
            # default would turn an explicit `functionUrl: false` back into true.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $region := $spec.region | default "us-east-1" >>
            <<- $wantUrl := true >>
            <<- if hasKey $spec "functionUrl" >><<- $wantUrl = $spec.functionUrl >><<- end >>
            <<- $fnObs := index (.observed.resources | default dict) "lambda-function" | default dict >>
            <<- if and $wantUrl $fnObs >>
            apiVersion: lambda.aws.m.upbound.io/v1beta1
            kind: FunctionURL
            metadata:
              name: <<$xrName>>-url
              annotations:
                <<setResourceNameAnnotation "function-url">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                authorizationType: NONE
                functionNameRef:
                  name: <<$xrName>>-function
            ---
            apiVersion: lambda.aws.m.upbound.io/v1beta1
            kind: Permission
            metadata:
              name: <<$xrName>>-url-public
              annotations:
                <<setResourceNameAnnotation "function-url-permission">>
                # The statement id IS the external name for a Lambda permission (the provider's id is
                # <function>/<statementId>). Without it the first create succeeds but the next observe looks
                # for an empty statement, reports "does not exist", and every poll retries AddPermission and
                # gets a 409; the resource sits in Creating forever and the composite never turns Ready. Seen
                # live on the first smoke-fn target, 2026-10-08.
                crossplane.io/external-name: FunctionURLAllowPublicAccess
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                statementId: FunctionURLAllowPublicAccess
                action: lambda:InvokeFunctionUrl
                principal: "*"
                functionUrlAuthType: NONE
                functionNameRef:
                  name: <<$xrName>>-function
            <<- end >>
            ---
            # The function's execution role: trusted by lambda.amazonaws.com, with AWS's own
            # AWSLambdaBasicExecutionRole (CloudWatch Logs) and nothing else. IAM role names are capped at 64
            # characters, hence the trunc. It carries the fleet's permissions boundary ($awsBoundaryArn, from
            # 00-cloud-identity.yaml) whenever the cluster registry provides one, and keeps the one it has if the registry can't
            # be read for a reconcile: omitting the field would ask the provider to remove the boundary, which the Crossplane
            # identity's policy refuses (an error loop, and a weaker role if it ever succeeded).
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $boundary := $awsBoundaryArn >>
            <<- if not $boundary >>
            <<- $boundary = dig "resource" "spec" "forProvider" "permissionsBoundary" "" (index (.observed.resources | default dict) "iam-role" | default dict) >>
            <<- end >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $functionName := $spec.functionName | default $xrName >>
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            metadata:
              name: <<$xrName>>-exec
              annotations:
                <<setResourceNameAnnotation "iam-role">>
                crossplane.io/external-name: <<printf "%s-exec" (trunc 59 $functionName)>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                description: <<printf "Execution role for the %s Lambda function (Airframe AwsLambdaTarget %s)" $functionName $xrName | toJson>>
                assumeRolePolicy: |
                  {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}
                <<- if $boundary >>
                permissionsBoundary: <<$boundary | quote>>
                <<- end >>
                tags:
                  hangar.io/target: <<$xrName>>
                  hangar.io/component: aws-lambda-target
            ---
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: RolePolicyAttachment
            metadata:
              name: <<$xrName>>-exec-logs
              annotations:
                <<setResourceNameAnnotation "iam-role-policy">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                policyArn: arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                roleRef:
                  name: <<$xrName>>-exec
            ---
            # The function itself, image-packaged, pointing at the bootstrap tag - rendered only once the
            # bootstrap Job has succeeded, so the provider never has to retry a create that Lambda would refuse.
            #
            # managementPolicies WITHOUT Update: deploy-lambda.yaml changes this function's image on every
            # deploy (`aws lambda update-function-code`). Under the default "*" policy Crossplane would revert
            # it to the bootstrap image on its next reconcile - the same class of fight the catalog's
            # RepositoryFile scaffolds had with developer edits. Observe/Create/Delete keeps the function
            # owned (deleting the XR deletes it) without ever writing to it after creation.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $functionName := $spec.functionName | default $xrName >>
            <<- $region := $spec.region | default "us-east-1" >>
            <<- $architecture := $spec.architecture | default "arm64" >>
            <<- $memorySize := $spec.memorySize | default 256 >>
            <<- $timeout := $spec.timeout | default 10 >>
            <<- $repoObs := index (.observed.resources | default dict) "ecr-repository" | default dict >>
            <<- $repoUrl := dig "resource" "status" "atProvider" "repositoryUrl" "" $repoObs >>
            <<- $jobObs := index (.observed.resources | default dict) "bootstrap-job" | default dict >>
            <<- $jobSucceeded := dig "resource" "status" "succeeded" 0 $jobObs >>
            <<- /* A function that exists stays in the desired state whatever happens to the bootstrap Job (deleted to retry,
                   re-created, gated on something new): leaving the desired state means Crossplane deletes it in AWS, with the
                   deployed code and the Function URL (a new URL comes back). The Job only decides when it is first created. */ ->>
            <<- $fnObs := index (.observed.resources | default dict) "lambda-function" | default dict >>
            <<- if or $fnObs (and $repoUrl (ge (int $jobSucceeded) 1)) >>
            apiVersion: lambda.aws.m.upbound.io/v1beta1
            kind: Function
            metadata:
              name: <<$xrName>>-function
              annotations:
                <<setResourceNameAnnotation "lambda-function">>
                crossplane.io/external-name: <<$functionName>>
            spec:
              managementPolicies: ["Observe", "Create", "Delete", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                description: <<printf "Deployed by Glidepath (deploy.target: aws-lambda); infrastructure by Airframe AwsLambdaTarget %s" $xrName | toJson>>
                packageType: Image
                imageUri: <<$repoUrl>>:bootstrap
                architectures:
                  - <<$architecture>>
                memorySize: <<$memorySize | int>>
                timeout: <<$timeout | int>>
                roleRef:
                  name: <<$xrName>>-exec
                tags:
                  hangar.io/target: <<$xrName>>
                  hangar.io/component: aws-lambda-target
            <<- end >>
            ---
        delims:
          left: "<<"
          right: ">>"
