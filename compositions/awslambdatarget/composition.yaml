                  (dict "Sid" "EcrLogin" "Effect" "Allow" "Action" "ecr:GetAuthorizationToken" "Resource" "*")
                  (dict "Sid" "ThisRepository" "Effect" "Allow"
                    "Action" (list "ecr:BatchCheckLayerAvailability" "ecr:BatchGetImage" "ecr:GetDownloadUrlForLayer"
