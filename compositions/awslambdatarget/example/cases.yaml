# Render cases for tools/test_compositions.py: each renders example/<xr> with the listed required
# (extra) and observed fixtures and is compared with example/expected/<name>.yaml; `expect` adds
# readable assertions. Regenerate expectations with `tools/test_compositions.py --update <composition>`.
cases:
- name: fresh
  xr: xr-defaults.yaml
  expect:
    conditions:
      TargetReady: AwsLambdaTargetProvisioning
- name: repository-and-role
  xr: xr-defaults.yaml
  observed:
  - observed-repository.yaml
  - observed-role.yaml
  expect:
    conditions:
      TargetReady: AwsLambdaTargetBootstrapping
- name: job-succeeded
  xr: xr-defaults.yaml
  observed:
  - observed-repository.yaml
  - observed-role.yaml
  - observed-job-succeeded.yaml
- name: ready
  xr: xr-defaults.yaml
  observed:
  - observed-repository.yaml
  - observed-role.yaml
  - observed-job-succeeded.yaml
  - observed-function-and-url.yaml
  expect:
    conditions:
      TargetReady: AwsLambdaTargetReady
- name: permissions-boundary
  xr: xr-defaults.yaml
  required:
  - cluster-registry-with-aws.yaml
  observed:
  - observed-repository.yaml
  - observed-role.yaml
  expect:
    conditions:
      TargetReady: AwsLambdaTargetBootstrapping
- name: federated
  xr: xr-defaults.yaml
  required:
  - cluster-registry-with-aws.yaml
  observed:
  - observed-repository.yaml
  - observed-role.yaml
  - observed-deploy-role.yaml
  expect:
    conditions:
      TargetReady: AwsLambdaTargetBootstrapping
# Regression (incident 2026-10-16): switching an existing, key-based target to federation while its deploy role is not
# observed yet must keep the Job (in key mode, unchanged), the function, its URL and its permission.
- name: switch-keeps-existing
  xr: xr-defaults.yaml
  required:
  - cluster-registry-with-aws.yaml
  observed:
  - observed-repository.yaml
  - observed-role.yaml
  - observed-job-succeeded.yaml
  - observed-function-and-url.yaml
  expect:
    conditions:
      TargetReady: AwsLambdaTargetReady
# A function whose bootstrap Job is gone (deleted to retry) stays in the desired state.
- name: job-gone-keeps-function
  xr: xr-defaults.yaml
  observed:
  - observed-repository.yaml
  - observed-role.yaml
  - observed-function-and-url.yaml
  expect:
    conditions:
      TargetReady: AwsLambdaTargetReady
