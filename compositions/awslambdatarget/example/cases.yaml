# Render cases for tools/test_compositions.py: each renders example/<xr> with the listed required
# (extra) and observed fixtures and is compared with example/expected/<name>.yaml; `expect` adds
# readable assertions. Regenerate expectations with `tools/test_compositions.py --update <composition>`.
cases:
- name: fresh
  xr: xr-defaults.yaml
  expect:
    conditions:
      TargetReady: AwsLambdaTargetProvisioning
- name: repository-and-role
  xr: xr-defaults.yaml
  observed:
  - observed-repository.yaml
  - observed-role.yaml
  expect:
    conditions:
      TargetReady: AwsLambdaTargetBootstrapping
- name: job-succeeded
  xr: xr-defaults.yaml
  observed:
  - observed-repository.yaml
  - observed-role.yaml
  - observed-job-succeeded.yaml
- name: ready
  xr: xr-defaults.yaml
  observed:
  - observed-repository.yaml
  - observed-role.yaml
  - observed-job-succeeded.yaml
  - observed-function-and-url.yaml
  expect:
    conditions:
      TargetReady: AwsLambdaTargetReady
