# Lambda will not create an image-packaged function until an image exists in the repository, and
# no Crossplane provider can push one. This Job seeds the repository with the public AWS Lambda base
# image for the chosen runtime, under the tag `bootstrap`, for the function's one architecture
# (Lambda rejects multi-architecture indexes, hence crane's --platform). Same two images and the
# same login dance as Glidepath's deploy-lambda.yaml, with the same credentials: the Job runs as the
# ServiceAccount glidepath-cloud-deployer and assumes this target's deploy role (deploy-role.yaml) with a
# projected token. Nothing is stored. There is no access-key mode any more (removed 2026-10-16, after phase 4 of
# the deploy federation): on a cluster whose registry lacks the AWS account, the boundary or the issuer, no Job is
# created and TargetReady says AwsLambdaTargetNeedsWebIdentity.
#
# Created once the Repository has been observed with its URL and the deploy role with its ARN.
# A Job's pod template is immutable, so a later change of spec.runtime or spec.architecture cannot
# be applied to it: delete the Job and let the next reconcile recreate it (the function stays), or
# recreate the XR. Never given a ttlSecondsAfterFinished - Crossplane would recreate a pruned Job on
# the next reconcile and re-run it. No activeDeadlineSeconds either: until the app's glidepath-app chart has
# created the ServiceAccount, the Job controller simply cannot create the pod and retries; a deadline would turn
# that wait into a failure. Only a real error (trust, no egress) consumes backoffLimit.
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $spec := .observed.composite.resource.spec >>
<<- $region := $spec.region | default "us-east-1" >>
<<- $architecture := $spec.architecture | default "arm64" >>
<<- $platform := "linux/arm64" >>
<<- if eq $architecture "x86_64" >><<- $platform = "linux/amd64" >><<- end >>
<<- $runtime := $spec.runtime | default "nodejs22" >>
<<- $bootstrapImage := "public.ecr.aws/lambda/nodejs:22" >>
<<- if eq $runtime "python3.13" >><<- $bootstrapImage = "public.ecr.aws/lambda/python:3.13" >><<- end >>
<<- if eq $runtime "go" >><<- $bootstrapImage = "public.ecr.aws/lambda/provided:al2023" >><<- end >>
<<- $deployRoleObs := index (.observed.resources | default dict) "deploy-role" | default dict >>
<<- $deployRoleArn := dig "resource" "status" "atProvider" "arn" "" $deployRoleObs >>
<<- $repoObs := index (.observed.resources | default dict) "ecr-repository" | default dict >>
<<- $repoUrl := dig "resource" "status" "atProvider" "repositoryUrl" "" $repoObs >>
<<- /* Once the Job exists, keep rendering it: dropping it from the desired state makes Crossplane delete it, and a
       Job's pod template cannot be updated in place. Incident 2026-10-16: the federation switch dropped smoke-fn's Job
       for one reconcile while its deploy role did not exist yet, and (before v0.3.144) the function, URL and
       permission went with it. Nor may it hang on an observed value that can be missing for a reconcile (an informer
       resync, an etcd stall: on 2026-10-16 a missing Repository URL deleted both of kiac-dev's Jobs twice). The
       repository URL and the role ARN come back from the Job's own spec, which this template wrote; and the Job is
       rendered even if that fails too: a wrong spec is an apply error, a missing one is a deletion. A Job created by
       the old access-key mode (before v0.3.147) renders as an apply error ("field is immutable"); delete it and the
       next reconcile creates a web-identity one. */ ->>
<<- $jobObs := index (.observed.resources | default dict) "bootstrap-job" | default dict >>
<<- if $jobObs >>
<<- range (dig "resource" "spec" "template" "spec" "containers" list $jobObs) >>
<<- if and (not $repoUrl) (eq (.name | default "") "copy-bootstrap-image") .args >>
<<- $repoUrl = trimSuffix ":bootstrap" (last .args) >>
<<- end >>
<<- end >>
<<- range (dig "resource" "spec" "template" "spec" "initContainers" list $jobObs) >>
<<- range (.env | default list) >>
<<- if and (not $deployRoleArn) (eq (.name | default "") "AWS_ROLE_ARN") >>
<<- $deployRoleArn = .value | default "" >>
<<- end >>
<<- end >>
<<- end >>
<<- end >>
<<- if or $jobObs (and $repoUrl $deployRoleArn) >>
<<- $registryHost := index (splitList "/" $repoUrl) 0 >>
apiVersion: batch/v1
kind: Job
metadata:
  name: <<$xrName>>-ecr-bootstrap
  annotations:
    <<setResourceNameAnnotation "bootstrap-job">>
  labels:
    hangar.io/target: <<$xrName>>
    hangar.io/component: aws-lambda-target
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: aws-lambda-target-bootstrap
        hangar.io/target: <<$xrName>>
    spec:
      restartPolicy: Never
      serviceAccountName: glidepath-cloud-deployer
      automountServiceAccountToken: false
      volumes:
        - name: aws-web-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
        - name: work
          emptyDir: {}
      initContainers:
        - name: ecr-login
          image: public.ecr.aws/aws-cli/aws-cli:2.37.9
          volumeMounts:
            - name: aws-web-identity
              mountPath: /var/run/secrets/aws-web-identity
              readOnly: true
            - name: work
              mountPath: /work
          env:
            - name: AWS_DEFAULT_REGION
              value: <<$region>>
            - name: REGISTRY_HOST
              value: <<$registryHost>>
            # The AWS CLI exchanges the token for a session itself when these two are set.
            - name: AWS_ROLE_ARN
              value: <<$deployRoleArn>>
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/aws-web-identity/token
            - name: AWS_ROLE_SESSION_NAME
              value: <<printf "bootstrap-%s" $xrName | trunc 64>>
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              TOKEN="$(aws ecr get-login-password)"
              AUTH="$(printf 'AWS:%s' "${TOKEN}" | base64 -w0)"
              mkdir -p /work/docker
              printf '{"auths":{"%s":{"auth":"%s"}}}' "${REGISTRY_HOST}" "${AUTH}" > /work/docker/config.json
              echo "logged in to ${REGISTRY_HOST}"
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      containers:
        - name: copy-bootstrap-image
          image: gcr.io/go-containerregistry/crane@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
          volumeMounts:
            - name: work
              mountPath: /work
          env:
            - name: DOCKER_CONFIG
              value: /work/docker
          args: ["copy", "--platform", "<<$platform>>", "<<$bootstrapImage>>", "<<$repoUrl>>:bootstrap"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
<<- end >>
