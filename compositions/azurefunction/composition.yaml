# GENERATED FILE - do not hand-edit the pipeline's `input.inline.template` blocks
# below. Edit templates/render-github-resources/*.yaml or
# templates/cicd-onboarding-status/*.yaml instead, then run ./build-composition.sh to
# regenerate this file.
#
# Two function-go-templating steps, not one (compositions/nodejsapplication's own
# pattern, ported here): render-github-resources composes the real provider-github
# managed resources plus a composed TektonCICD child (CI/CD onboarding lives there
# now, not inline - see xrds/tektoncicd.yaml), cicd-onboarding-status proxies that
# child's own DevClusterReady/CicdOnboarded conditions onto this XR afterward.
#
# Delimiters: << >> instead of Go's default {{ }}, matching every other Composition
# in this catalog - here it dodges Go source's own braces needing no escaping at all.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: azurefunctions.catalog.hangar.io
spec:
  compositeTypeRef:
    apiVersion: catalog.hangar.io/v1alpha1
    kind: AzureFunction
  mode: Pipeline
  pipeline:
    - step: render-github-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # SHARED PARTIAL (compositions/_shared/render-github-resources/00-devcluster-gate.yaml): every application composition's
            # templates/render-github-resources/00-devcluster-gate.yaml is a symlink to this file, so the six compositions cannot drift apart
            # again (review C3: four 'identical' templates had grown four to five variants). Per-composition
            # differences come in through the variables that templates/render-github-resources/00-inputs.yaml defines before this
            # file is concatenated after it: none (this file defines $xrName, $spec, $devCluster, $clusterOk, $tenantsRepo for the files after it). Edit here, run tools/build-compositions, then
            # tools/test_compositions.py and review every composition's expected/ diff.
            # Real Crossplane extra-resources lookup against the cluster registry
            # (gitops-cluster-dev/00-bootstrap/cluster-registry/, service-catalog-design.md §0) -
            # same mechanism/pattern as applicationenvironment's own 00-cluster-gate.yaml, adapted
            # here now that spec.devCluster is real and required (2026-08-18): this XRD used to be
            # permanently centralized on a hardcoded "kind-dev" (see this Composition's own git
            # history), correct only as long as exactly one dev cluster ever existed. The fleet now
            # supports multiple - an app is pinned to exactly one via spec.devCluster, and THIS
            # gate is what validates that choice live rather than trusting the string blindly.
            #
            # type: dev + cicdReady: "true" (not type: upper + crossplaneReady, which
            # ApplicationEnvironment's own gate checks) - a dev cluster is defined by running
            # platform-cicd's control plane, and cicdReady is exactly the field that flips true
            # once that's GitOps-managed and live-verified on a given cluster (see kind-dev.yaml's
            # own history).
            #
            # $clusterOk/$xrName/$devCluster/$tenantsRepo are declared once here, not redeclared
            # per file below - Go template variables declared at this (unindented) scope persist
            # for the rest of THIS pipeline step's execution across the --- separators (same
            # concatenated-template convention 00-cluster-gate.yaml's own header documents).
            # cicd-onboarding-status/status.yaml is a SEPARATE pipeline step (its own template
            # execution scope) and redeclares this same lookup itself, same as
            # applicationenvironment/templates/status/status.yaml does for its own gate.
            #
            # $tenantsRepo now comes from the registry entry's own data.tenantsRepo, not a
            # hardcoded "gitops-cluster-dev-tenants" literal - kind-dev's tenants repo is a legacy
            # name that breaks the gitops-cluster-<cluster>-tenants convention every upper cluster
            # uses (renaming the real, live repo was out of scope - too disruptive to already-wired
            # ArgoCD Applications). Recorded as registry data instead so a future second dev
            # cluster can follow the clean convention without another hardcoded exception here.
            #
            # Deliberately ONE YAML document in this file, not two - see 00-cluster-gate.yaml's own
            # header for why (computing everything up front via template actions with no literal
            # output, before the ExtraResources document itself, avoids an untested "does
            # function-go-templating tolerate a blank rendered document" question entirely).
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $devCluster := $spec.devCluster >>
            <<- $allExtra := .extraResources | default dict >>
            <<- $entry := index $allExtra "devcluster-registry-entry" | default dict >>
            <<- $items := index $entry "items" | default list >>
            <<- $clusterOk := false >>
            <<- $clusterType := "" >>
            <<- $cicdReady := "" >>
            <<- $tenantsRepo := "" >>
            <<- if gt (len $items) 0 >>
              <<- $cm := (index $items 0).resource >>
              <<- $clusterType = $cm.data.type >>
              <<- $cicdReady = index $cm.data "cicdReady" | default "" >>
              <<- $tenantsRepo = index $cm.data "tenantsRepo" | default "" >>
              <<- if and (eq $clusterType "dev") (eq $cicdReady "true") >>
                <<- $clusterOk = true >>
              <<- end >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              devcluster-registry-entry:
                apiVersion: v1
                kind: ConfigMap
                namespace: crossplane-system
                matchName: <<$devCluster>>
            ---
            # Per-composition inputs for the shared partials in compositions/_shared/render-github-resources/
            # (00-devcluster-gate, secretstore-xr, tekton-cicd-child are symlinks there). Variables only; no output.
            <<- $hasGitopsRepo := false >>
            ---
            # SHARED PARTIAL (compositions/_shared/render-github-resources/00-scaffold-done.yaml). Variables only;
            # no output. Spliced before any scaffold document (00- prefix) so every create-once RepositoryFile in
            # the step can ask "was I already scaffolded?".
            #
            # $scaffoldDone is the XR's scaffold ledger: status.scaffold.done, the composition-resource-names of
            # every create-once RepositoryFile (managementPolicies without "Update") this XR has already seen
            # reach Ready. zz-scaffold-ledger.yaml (same directory) writes it; a create-once document wraps itself
            # in `if not (has "<its name>" $scaffoldDone)` so it stops being composed once it is in the ledger,
            # and Crossplane then deletes the managed resource - with no "Delete" policy the GitHub file stays.
            # "Scaffold once, reconcile never": the file is real developer source after that first write, so
            # there is nothing for the provider to observe every poll, and a later composition change to the
            # template (or to the resource's identity fields) cannot touch an already-scaffolded repo.
            #
            # Why a ledger and not "compose until observed Ready, then stop": that was tried (2026-09-23 canary)
            # and loops - stop composing, Crossplane deletes the MR, the next reconcile observes nothing and
            # cannot tell "already scaffolded" from "brand new", so it creates again. The ledger is the durable
            # memory. It lives in XR status (declared in the XRD, so the API server keeps it), is re-emitted on
            # every reconcile as (observed ledger) UNION (create-once files observed Ready now), and a file is
            # only dropped from the render on the reconcile AFTER it entered the ledger - so the ledger write
            # always lands before the managed resource goes away.
            #
            # Cluster rebuild (XR status lost): the ledger is empty, every scaffold file is composed again, and
            # the pinned external-name makes the provider adopt the existing GitHub file (Observe, no write) -
            # then it is Ready, enters the ledger, and retires again. Zero GitHub writes, two reconciles.
            <<- $scaffoldDone := dig "status" "scaffold" "done" list .observed.composite.resource >>
            <<- if not $scaffoldDone >><<- $scaffoldDone = list >><<- end >>
            ---
            # Commits a minimal, real cicd.yaml into the function's own src repo: build, then deploy to the
            # existing Azure Container App that hosts the function app (deploy.target: azure-container-apps).
            #
            # Why azure-container-apps and not an azure-functions target: Azure Functions can be hosted
            # on Azure Container Apps, where the function app IS a Container App (kind functionapp), and
            # updating its image is `az containerapp update --image`, which Glidepath already does. ASSUMPTION,
            # not yet verified against a real subscription: that this update path works on a function app.
            #
            # build.platforms is amd64 only: the mcr.microsoft.com/azure-functions base images are published
            # for amd64 only, so Glidepath's default (amd64 + arm64) would fail the arm64 build.
            #
            # Like the Lambda starter: it never creates the Container Apps environment or the app, and it
            # declares no environments file (no Helm chart).
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $runtime := .observed.composite.resource.spec.runtime >>
            <<- $resourceGroup := .observed.composite.resource.spec.resourceGroup >>
            <<- $appName := .observed.composite.resource.spec.appName | default $xrName >>
            <<- $agent := "nodejs-20" >>
            <<- if eq $runtime "python3.12" >><<- $agent = "python-3.12" >><<- end >>
            <<- if not (has "src-repo-cicd-yaml" $scaffoldDone) >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-cicd-yaml
              annotations:
                <<setResourceNameAnnotation "src-repo-cicd-yaml">>
                crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:cicd.yaml:" $xrName) (index (.observed.resources | default dict) "src-repo-cicd-yaml" | default dict)>>"
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: cicd.yaml
                overwriteOnCreate: true
                content: |
                  apiVersion: platform/v1
                  kind: PipelineConfig

                  build:
                    agent: <<$agent>>
                    platforms:
                      - amd64
                    unitTest:
                      enabled: false # no test script exists yet - add one, then flip this on

                  pipelines:
                    ci:
                      trigger:
                        source: git
                        event: push
                        branch: main
                      steps:
                        - stage: build
                        - stage: deploy
                          env: dev
                  deploy:
                    target: azure-container-apps
                    azureContainerApps:
                      resourceGroup: <<$resourceGroup>>
                      appName: <<$appName>>
                    lowerEnvironments:
                      - dev
                    upperEnvironments: []
                    strategy: rollout
                    promotionOrder:
                      - dev

                  secrets:
                    - name: azure-client-id
                    - name: azure-client-secret
                    - name: azure-tenant-id

                  notifications:
                    backstage:
                      enabled: true # build/deploy results show in Backstage and Tower
                commitMessage: "AzureFunction scaffold: cicd.yaml (build + deploy-to-Container-Apps starter)"

            <<- end >>
            ---
            # SHARED PARTIAL (compositions/_shared/render-github-resources/secretstore-xr.yaml): every application composition's
            # templates/render-github-resources/secretstore-xr.yaml is a symlink to this file, so the six compositions cannot drift apart
            # again (review C3: four 'identical' templates had grown four to five variants). Per-composition
            # differences come in through the variables that templates/render-github-resources/00-inputs.yaml defines before this
            # file is concatenated after it: none. Edit here, run tools/build-compositions, then
            # tools/test_compositions.py and review every composition's expected/ diff.
            # Commits a "shared"-mode SecretStore XR manifest into
            # tenants/<app-name>/xr-requests/secretstore.yaml - picked up by this app's own
            # devCluster's xr-requests ApplicationSet (gitops-cluster-dev/02-argocd-apps/
            # xr-requests/, for kind-dev), the SAME mechanism every other Bootstrap XR
            # already goes through, applied directly (no Helm release needed) into
            # app-<app-name>-cicd on that cluster.
            #
            # Real, deliberate correction of the original design (idp/docs/
            # service-catalog-design.md Item 8's second multi-cluster revision): secrets
            # infrastructure used to be an emergent side effect of airframe-application's own
            # chart rendering an always-on SecretStore XR the first time some env actually
            # got deployed - meant "when does this exist" wasn't discoverable from the
            # Bootstrap XRD list at all, and tied provisioning to "someone happened to ship
            # a real release" rather than to onboarding itself. This is the fix: the SAME
            # unconditional, idempotent commit pattern cicd-identity-yaml.yaml already uses in
            # this same step - overwriteOnCreate:
            # true, deterministic content, no existence-check needed (a NodeJSApplication is
            # created exactly once per app, so there's no "N siblings" ownership question
            # here at all, unlike ApplicationEnvironment's own copy of this same idea).
            #
            # spec.devCluster, not a hardcoded "kind-dev" (2026-08-18): this is the app's OWN
            # dev-cluster secrets store, always exactly one, matching xrds/secretstore.yaml's
            # own "one shared environment for the dev cluster" scope (no per-env store on a
            # dev cluster - see that XRD's header for why). Which dev cluster is no longer a
            # Bootstrap-tier-wide constant - spec.devCluster is real and required (the fleet
            # now supports multiple dev clusters, an app pinned to exactly one) - $clusterOk/
            # $tenantsRepo come from 00-devcluster-gate.yaml (same pipeline step), which also
            # validates spec.devCluster live against the cluster registry before this
            # resource renders at all.
            # managementPolicies (no "Delete") - added 2026-09-16 after a live $clusterOk/
            # devcluster-gate-flap deletion of this exact resource's ApplicationEnvironment-tier
            # sibling (secretstore-xrs.yaml) caused real Infisical project/secret loss
            # (checkout-api-kind-prod, order-api-kind-prod - no managementPolicies field meant
            # the provider default "*" allowed it). This file has no managementPolicies either,
            # and is gated by the same class of transient-false ExtraResources lookup
            # (00-devcluster-gate.yaml) on every reconcile, not just this XR's first pass - the
            # same race is possible here even though there's only ever one owner, not siblings.
            <<- if $clusterOk >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-secretstore-xr
              annotations:
                <<setResourceNameAnnotation "secretstore-xr">>
            spec:
              managementPolicies: ["Create", "Update", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$tenantsRepo>>
                file: <<printf "tenants/%s/xr-requests/secretstore.yaml" $xrName>>
                overwriteOnCreate: true
                content: |
                  apiVersion: catalog.hangar.io/v1alpha1
                  kind: SecretStore
                  metadata:
                    name: <<printf "%s-%s" $xrName $devCluster>>
                  spec:
                    appRef:
                      name: <<$xrName>>
                    cluster: <<$devCluster>>
                commitMessage: <<printf "Onboard %s: add tenants/%s/xr-requests/secretstore.yaml" $xrName $xrName | toJson>>
            <<- end >>
            ---
            # Src repo + boilerplate for an Azure Functions app packaged as a container image. Double-angle-bracket delimiters,
            # same conventions as goapplication's src-repo.yaml (read its header and the policy block below).
            #
            # The Containerfiles follow Microsoft's documented images (mcr.microsoft.com/azure-functions/*),
            # programming models v4 (Node) and v2 (Python), one anonymous HTTP trigger.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $description := $spec.description | default (printf "%s - an Azure Functions app" $xrName) >>
            <<- $runtime := $spec.runtime >>
            <<- $visibility := $spec.visibility >>
            # ---------------------------------------------------------------------------
            # Scaffold files never delete or overwrite developer content, and never re-identify.
            # (Added 2026-09-23 after a real incident - read before changing anything here.)
            #
            # These RepositoryFile resources exist only to seed a brand-new app's repo. After the
            # first commit the file belongs to the developer. They used to be reconciled forever
            # with policies Create, Observe, LateInitialize, Delete and overwriteOnCreate true, which
            # had two real failure modes:
            #   1. A composition change to a field of an ALREADY-COMPOSED resource is a fleet-wide
            #      write even without an Update policy. The 2026-09-22 Dockerfile-to-Containerfile
            #      rename rewrote file: and external-name on every existing resource while the
            #      provider's Terraform state (and the repo) still said Dockerfile. file: is a
            #      force-replace field, so the provider could neither update nor settle, and
            #      crossplane-runtime retried at its 60s backoff cap ignoring --poll: 7 resources,
            #      roughly 16,000 GitHub calls/hour against a 5,000/hour budget shared with Backstage.
            #   2. Delete let a mis-observed 403 or a resource-name change remove a developer-owned
            #      file, and overwriteOnCreate true let a mis-observed 403 overwrite real content.
            #
            # Therefore: no Delete policy (deleting the Kubernetes object can never remove a file
            # from GitHub), overwriteOnCreate false, and the identity fields (file:, external-name)
            # of an EXISTING resource are pinned to what the provider itself reports it manages
            # (status.atProvider.file), falling back to the live spec, then to the template default.
            # The default therefore only ever applies to a resource that does not exist yet, so a
            # future change of the default can never re-identify a live object. A cluster rebuild
            # still adopts existing files: nothing is observed, external-name is set, Observe adopts.
            # Do NOT try to make these objects disappear after creation by rendering nothing: a
            # missing object looks identical to a brand-new one, so the next reconcile recreates it
            # (proved live on 2026-09-23 - an endless create/garbage-collect loop, ~800 GitHub calls
            # in 4 minutes). If retirement is ever wanted it needs a durable marker outside this
            # render, and a multi-pass test.
            # NOTE for editors: never write two adjacent angle-bracket characters in comments (see
            # the note further down) - this block deliberately avoids them.
            # ---------------------------------------------------------------------------
            <<- define "scaffoldFile" ->>
            <<- $f := "" ->>
            <<- if .obs ->>
            <<-   $f = dig "resource" "status" "atProvider" "file" "" .obs ->>
            <<-   if not $f ->><<- $f = dig "resource" "spec" "forProvider" "file" "" .obs ->><<- end ->>
            <<- end ->>
            <<- if $f ->><<- $f ->><<- else ->><<- .default ->><<- end ->>
            <<- end >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: Repository
            metadata:
              name: <<$xrName>>-src
              annotations:
                <<setResourceNameAnnotation "src-repo">>
                crossplane.io/external-name: <<$xrName>>
            # managementPolicies (no "Delete"): deleting this XR must never delete the real GitHub repo.
            spec:
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                name: <<$xrName>>
                description: <<$description | toJson>>
                visibility: <<$visibility>>
                autoInit: true
                hasIssues: true
                deleteBranchOnMerge: true
                securityAndAnalysis:
                  - secretScanning:
                      - status: disabled
                    secretScanningPushProtection:
                      - status: disabled
            ---
            <<- if eq $runtime "nodejs20" >>
            <<- if not (has "src-repo-package-json" $scaffoldDone) >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-package-json
              annotations:
                <<setResourceNameAnnotation "src-repo-package-json">>
                crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:package.json:" $xrName) (index (.observed.resources | default dict) "src-repo-package-json" | default dict)>>"
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: package.json
                overwriteOnCreate: false
                content: |
                  {
                    "name": "<<$xrName>>",
                    "version": "0.1.0",
                    "main": "src/functions/*.js",
                    "dependencies": {
                      "@azure/functions": "^4.0.0"
                    }
                  }
                commitMessage: "AzureFunction scaffold: package.json"
            <<- end >>
            ---
            <<- if not (has "src-repo-host-json" $scaffoldDone) >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-host-json
              annotations:
                <<setResourceNameAnnotation "src-repo-host-json">>
                crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:host.json:" $xrName) (index (.observed.resources | default dict) "src-repo-host-json" | default dict)>>"
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: host.json
                overwriteOnCreate: false
                content: |
                  {
                    "version": "2.0",
                    "extensionBundle": {
                      "id": "Microsoft.Azure.Functions.ExtensionBundle",
                      "version": "[4.*, 5.0.0)"
                    }
                  }
                commitMessage: "AzureFunction scaffold: host.json"
            <<- end >>
            ---
            <<- if not (has "src-repo-hello-js" $scaffoldDone) >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-hello-js
              annotations:
                <<setResourceNameAnnotation "src-repo-hello-js">>
                crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:src/functions/hello.js:" $xrName) (index (.observed.resources | default dict) "src-repo-hello-js" | default dict)>>"
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: src/functions/hello.js
                overwriteOnCreate: false
                content: |
                  const { app } = require('@azure/functions');

                  app.http('hello', {
                    methods: ['GET'],
                    authLevel: 'anonymous',
                    handler: async (request, context) => {
                      return { jsonBody: { message: 'Hello from <<$xrName>>' } };
                    },
                  });
                commitMessage: "AzureFunction scaffold: src/functions/hello.js"
            <<- end >>
            ---
            <<- $obsD := index (.observed.resources | default dict) "src-repo-dockerfile" >>
            <<- $pinnedFile := include "scaffoldFile" (dict "obs" $obsD "default" "Containerfile") >>
            <<- if not (has "src-repo-dockerfile" $scaffoldDone) >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-dockerfile
              annotations:
                <<setResourceNameAnnotation "src-repo-dockerfile">>
                crossplane.io/external-name: "<<$dExt := printf "%s:%s:" $xrName $pinnedFile>><<$oExt := dig "resource" "metadata" "annotations" "crossplane.io/external-name" $dExt (index (.observed.resources | default dict) "src-repo-dockerfile" | default dict)>><<if hasPrefix $dExt $oExt>><<$oExt>><<else>><<$dExt>><<end>>"
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: <<$pinnedFile>>
                overwriteOnCreate: false
                content: |
                  FROM mcr.microsoft.com/azure-functions/node:4-node20
                  ENV AzureWebJobsScriptRoot=/home/site/wwwroot \
                      AzureFunctionsJobHost__Logging__Console__IsEnabled=true
                  WORKDIR /home/site/wwwroot
                  COPY package.json host.json ./
                  RUN npm install --omit=dev
                  COPY src ./src
                commitMessage: "AzureFunction scaffold: Containerfile"
            <<- end >>
            ---
            <<- end >>
            <<- if eq $runtime "python3.12" >>
            <<- if not (has "src-repo-host-json" $scaffoldDone) >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-host-json
              annotations:
                <<setResourceNameAnnotation "src-repo-host-json">>
                crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:host.json:" $xrName) (index (.observed.resources | default dict) "src-repo-host-json" | default dict)>>"
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: host.json
                overwriteOnCreate: false
                content: |
                  {
                    "version": "2.0",
                    "extensionBundle": {
                      "id": "Microsoft.Azure.Functions.ExtensionBundle",
                      "version": "[4.*, 5.0.0)"
                    }
                  }
                commitMessage: "AzureFunction scaffold: host.json"
            <<- end >>
            ---
            <<- if not (has "src-repo-function-app" $scaffoldDone) >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-function-app
              annotations:
                <<setResourceNameAnnotation "src-repo-function-app">>
                crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:function_app.py:" $xrName) (index (.observed.resources | default dict) "src-repo-function-app" | default dict)>>"
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: function_app.py
                overwriteOnCreate: false
                content: |
                  import azure.functions as func

                  app = func.FunctionApp(http_auth_level=func.AuthLevel.ANONYMOUS)


                  @app.route(route="hello", methods=["GET"])
                  def hello(req: func.HttpRequest) -> func.HttpResponse:
                      return func.HttpResponse('{"message": "Hello from <<$xrName>>"}', mimetype="application/json")
                commitMessage: "AzureFunction scaffold: function_app.py"
            <<- end >>
            ---
            <<- if not (has "src-repo-requirements" $scaffoldDone) >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-requirements
              annotations:
                <<setResourceNameAnnotation "src-repo-requirements">>
                crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:requirements.txt:" $xrName) (index (.observed.resources | default dict) "src-repo-requirements" | default dict)>>"
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: requirements.txt
                overwriteOnCreate: false
                content: |
                  azure-functions
                commitMessage: "AzureFunction scaffold: requirements.txt"
            <<- end >>
            ---
            <<- $obsD := index (.observed.resources | default dict) "src-repo-dockerfile" >>
            <<- $pinnedFile := include "scaffoldFile" (dict "obs" $obsD "default" "Containerfile") >>
            <<- if not (has "src-repo-dockerfile" $scaffoldDone) >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-dockerfile
              annotations:
                <<setResourceNameAnnotation "src-repo-dockerfile">>
                crossplane.io/external-name: "<<$dExt := printf "%s:%s:" $xrName $pinnedFile>><<$oExt := dig "resource" "metadata" "annotations" "crossplane.io/external-name" $dExt (index (.observed.resources | default dict) "src-repo-dockerfile" | default dict)>><<if hasPrefix $dExt $oExt>><<$oExt>><<else>><<$dExt>><<end>>"
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: <<$pinnedFile>>
                overwriteOnCreate: false
                content: |
                  FROM mcr.microsoft.com/azure-functions/python:4-python3.12
                  ENV AzureWebJobsScriptRoot=/home/site/wwwroot \
                      AzureFunctionsJobHost__Logging__Console__IsEnabled=true
                  COPY requirements.txt /
                  RUN pip install --no-cache-dir -r /requirements.txt
                  COPY host.json function_app.py /home/site/wwwroot/
                commitMessage: "AzureFunction scaffold: Containerfile"
            <<- end >>
            ---
            <<- end >>
            <<- if not (has "src-repo-gitignore" $scaffoldDone) >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-gitignore
              annotations:
                <<setResourceNameAnnotation "src-repo-gitignore">>
                crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:.gitignore:" $xrName) (index (.observed.resources | default dict) "src-repo-gitignore" | default dict)>>"
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: .gitignore
                overwriteOnCreate: false
                content: |
                  node_modules/
                  __pycache__/
                  *.log
                  .env
                  local.settings.json
                commitMessage: "AzureFunction scaffold: .gitignore"
            <<- end >>
            ---
            <<- if not (has "src-repo-readme" $scaffoldDone) >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-readme
              annotations:
                <<setResourceNameAnnotation "src-repo-readme">>
                crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:README.md:" $xrName) (index (.observed.resources | default dict) "src-repo-readme" | default dict)>>"
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: README.md
                overwriteOnCreate: false
                content: |
                  # <<$xrName>>

                  <<$description>>

                  Scaffolded by `AzureFunction` (Airframe). Runtime: `<<$runtime>>`.

                  Run it locally:

                  ```
                  container build -t <<$xrName>> -f Containerfile .
                  container run --rm -p 8080:80 <<$xrName>>
                  curl -s http://localhost:8080/api/hello
                  ```

                  **Deploys to an existing Azure Container App.** Glidepath updates the image of the Container App
                  that hosts this function app (`deploy.target: azure-container-apps` in `cicd.yaml`); it never
                  creates the Container Apps environment or the app. Create them first, then add `azure-client-id`,
                  `azure-client-secret` and `azure-tenant-id` to this app's Infisical project.

                  The image is built for amd64 only: Microsoft's Functions base images are not published for arm64.
                commitMessage: "AzureFunction scaffold: README.md"

            <<- end >>
            ---
            # Opt-in (spec.target.enabled, 2026-10-08): composes an AzureContainerAppTarget child - the resource
            # group, Container Apps environment and app with public ingress this function deploys into - from
            # this XR's own appName/resourceGroup/runtime, the same values cicd-yaml.yaml scaffolds into the
            # deploy block, so the three can never disagree. The child CREATES and owns spec.resourceGroup
            # (see the XRD field description). A normal child XR composed directly, like the TektonCICD child
            # beside it; unconditional on $clusterOk for the same reason. Off by default: the standalone
            # AzureContainerAppTarget XR is the shape for infrastructure that comes and goes independently.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $target := $spec.target | default dict >>
            <<- if $target.enabled >>
            <<- $runtime := $spec.runtime | default "nodejs20" >>
            <<- $bootstrapImage := "mcr.microsoft.com/azure-functions/node:4-node20" >>
            <<- if eq $runtime "python3.12" >><<- $bootstrapImage = "mcr.microsoft.com/azure-functions/python:4-python3.12" >><<- end >>
            apiVersion: catalog.hangar.io/v1alpha1
            kind: AzureContainerAppTarget
            metadata:
              name: <<$xrName>>-target
              annotations:
                <<setResourceNameAnnotation "azure-container-app-target">>
            spec:
              appName: <<$spec.appName | default $xrName>>
              resourceGroup: <<$spec.resourceGroup>>
              location: <<$target.location | default "eastus">>
              containerPort: 80
              bootstrapImage: <<$bootstrapImage>>
            <<- end >>
            ---
            ---
            # SHARED PARTIAL (compositions/_shared/render-github-resources/tekton-cicd-child.yaml): every application composition's
            # templates/render-github-resources/tekton-cicd-child.yaml is a symlink to this file, so the six compositions cannot drift apart
            # again (review C3: four 'identical' templates had grown four to five variants). Per-composition
            # differences come in through the variables that templates/render-github-resources/00-inputs.yaml defines before this
            # file is concatenated after it: $hasGitopsRepo (false for the function kinds, which deploy to a cloud target and have no gitops repo). Edit here, run tools/build-compositions, then
            # tools/test_compositions.py and review every composition's expected/ diff.
            # Composes a TektonCICD child XR directly - not a GitOps xr-requests commit like
            # SecretStore's own sibling template (secretstore-xr.yaml) uses. TektonCICD only
            # calls the GitHub API (provider-github, cluster-agnostic, reconciled centrally,
            # same as every other resource this pipeline step already composes), so it has
            # none of SecretStore's cross-cluster-credential blocker - see
            # xrds/tektoncicd.yaml's own header for the full reasoning.
            #
            # Unconditional - not locally gated on $clusterOk. TektonCICD's own internal
            # devcluster gate (compositions/tektoncicd/templates/render-tektoncicd-resources/
            # 00-devcluster-gate.yaml) now owns that decision; gating here too would just
            # move the duplication this extraction removes to a different file.
            #
            # gitopsRepoUrl/appRepoUrl computed the same way gitops-repo.yaml/src-repo.yaml's
            # own literals do ($platformOwner "jfillman" - a ProviderConfig-wide credential
            # setting, not a per-app field, same reasoning xrds/nodejsapplication.yaml's own
            # header gives for not exposing owner as a spec field).
            # apiVersion is STICKY to whatever group this app's child already has (Tier 2 domain rename, memory
            # project_tier2_domain_rename_plan.md): an existing child keeps the apiVersion it was created with,
            # a brand-new one (nothing observed yet) is created under catalog.hangar.io.
            #
            # Why not a plain literal: Crossplane treats apiVersion as part of a composed resource's identity, so
            # flipping a literal orphans the existing child and spawns an unready duplicate that fights it over the
            # same external files (hit live 2026-09-30 across all 8 apps, airframe#30). Sticky means deploying this
            # changes nothing for an existing app. Same observed-pinning pattern as src-repo.yaml's scaffoldFile.
            #
            # Explicit override: the annotation hangar.io/tektoncicd-group on THIS XR (value "hangar"; "idp" was removed in Phase C)
            # wins over sticky. Migrating one app = set it to "hangar" in the app's xr-request (git), then delete the
            # old-group child once the new one exists; the new child adopts the same files (the RepositoryFile
            # children have no Delete policy, so the real files survive). Deleting the child ALONE does not flip an
            # app: sticky is computed from the observed child, and the parent re-rendered the old group from a stale
            # view of it within the same second (hit live on skyport-auth, 2026-09-30) - hence the override.
            <<- $obsTektonCicd := index (.observed.resources | default dict) "tektoncicd" | default dict >>
            <<- $tektonCicdApiVersion := dig "resource" "apiVersion" "catalog.hangar.io/v1alpha1" $obsTektonCicd >>
            <<- $tektonCicdGroupOverride := dig "metadata" "annotations" "hangar.io/tektoncicd-group" "" .observed.composite.resource >>
            <<- if eq $tektonCicdGroupOverride "hangar" >>
              <<- $tektonCicdApiVersion = "catalog.hangar.io/v1alpha1" >>
            <<- end >>
            <<- $platformOwner := "jfillman" >>
            apiVersion: <<$tektonCicdApiVersion>>
            kind: TektonCICD
            metadata:
              name: <<$xrName>>-tektoncicd
              annotations:
                <<setResourceNameAnnotation "tektoncicd">>
            spec:
              appName: <<$xrName>>
              <<- if $hasGitopsRepo >>
              gitopsRepoUrl: <<printf "https://github.com/%s/gitops-%s" $platformOwner $xrName>>
              <<- end >>
              appRepoUrl: <<printf "https://github.com/%s/%s" $platformOwner $xrName>>
              devCluster: <<$devCluster>>
              <<- if $spec.extraGitopsRepos >>
              extraGitopsRepos:
              <<- range $spec.extraGitopsRepos >>
                - <<.>>
              <<- end >>
              <<- end >>
            ---
            ---
            # SHARED PARTIAL (compositions/_shared/render-github-resources/zz-scaffold-ledger.yaml). Writes the
            # XR's scaffold ledger (see 00-scaffold-done.yaml for the design). Spliced last (zz- prefix); it only
            # reads observed state, so its position relative to the documents does not matter.
            #
            # A create-once RepositoryFile is recognised by its managementPolicies lacking "Update" - that is this
            # catalog's documented meaning of "scaffold" (create-once-then-hands-off, see any src-repo.yaml header),
            # so nothing has to be marked, and the Update-managed files (cluster-identity.yaml, secretstore XRs,
            # tenant identity) are never ledgered or retired. An MR with no managementPolicies at all is the
            # provider default "*" (everything, Update included) and is left alone too.
            #
            # The ledger is emitted on every reconcile, even when empty, so it never depends on how Crossplane
            # merges a status field the pipeline did not set this time.
            <<- $ledger := list >>
            <<- range $rn, $o := (.observed.resources | default dict) >>
              <<- $res := index $o "resource" | default dict >>
              <<- if eq (index $res "kind" | default "") "RepositoryFile" >>
                <<- $pol := dig "spec" "managementPolicies" list $res >>
                <<- if and (gt (len $pol) 0) (not (has "Update" $pol)) >>
                  <<- range (dig "status" "conditions" list $res) >>
                    <<- if and (eq .type "Ready") (eq .status "True") >><<- $ledger = append $ledger $rn >><<- end >>
                  <<- end >>
                <<- end >>
              <<- end >>
            <<- end >>
            <<- $scaffoldDoneNow := concat $scaffoldDone $ledger | uniq | sortAlpha >>
            apiVersion: <<.observed.composite.resource.apiVersion>>
            kind: <<.observed.composite.resource.kind>>
            status:
              scaffold:
                done: <<$scaffoldDoneNow | toJson>>
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
    - step: cicd-onboarding-status
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # Per-composition inputs for the shared partial compositions/_shared/cicd-onboarding-status/status.yaml
            # (status.yaml here is a symlink to it). Variables only; no output.
            <<- $targetResourceName := "azure-container-app-target" >>
            <<- $targetKind := "AzureContainerAppTarget" >>
            ---
            # SHARED PARTIAL (compositions/_shared/cicd-onboarding-status/status.yaml): every application composition's
            # templates/cicd-onboarding-status/status.yaml is a symlink to this file, so the six compositions cannot drift apart
            # again (review C3: four 'identical' templates had grown four to five variants). Per-composition
            # differences come in through the variables that templates/cicd-onboarding-status/00-inputs.yaml defines before this
            # file is concatenated after it: $targetResourceName and $targetKind (the opt-in cloud-target child of the function kinds; empty for the others, which then never see spec.target.enabled). Edit here, run tools/build-compositions, then
            # tools/test_compositions.py and review every composition's expected/ diff.
            # Proxies DevClusterReady/CicdOnboarded straight from the composed TektonCICD
            # child's own status.conditions onto this XR's status. Identical mechanism to
            # nodejsapplication's own cicd-onboarding-status/status.yaml (straight port, not a
            # redesign) - see that file's own header for the full "why".
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $allObserved := .observed.resources | default dict >>
            <<- $childRes := index $allObserved "tektoncicd" | default dict >>
            <<- $childXR := index $childRes "resource" | default dict >>
            <<- $childStatus := index $childXR "status" | default dict >>
            <<- $childConditions := index $childStatus "conditions" | default list >>
            <<- $devClusterCondition := dict >>
            <<- $cicdOnboardedCondition := dict >>
            <<- $target := .observed.composite.resource.spec.target | default dict >>
            <<- $targetRes := dict >>
            <<- if $targetResourceName >><<- $targetRes = index $allObserved $targetResourceName | default dict >><<- end >>
            <<- $targetCondition := dict >>
            <<- range (dig "resource" "status" "conditions" list $targetRes) >>
              <<- if eq .type "TargetReady" >>
                <<- $targetCondition = . >>
              <<- end >>
            <<- end >>
            <<- range $childConditions >>
              <<- if eq .type "DevClusterReady" >>
                <<- $devClusterCondition = . >>
              <<- else if eq .type "CicdOnboarded" >>
                <<- $cicdOnboardedCondition = . >>
              <<- end >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
            <<- if $devClusterCondition >>
              - type: DevClusterReady
                status: <<$devClusterCondition.status | toJson>>
                reason: <<$devClusterCondition.reason>>
                message: <<$devClusterCondition.message | toJson>>
                target: CompositeAndClaim
            <<- else >>
              - type: DevClusterReady
                status: "False"
                reason: DevClusterNotReady
                message: >-
                  Waiting on the composed TektonCICD child (<<$xrName>>-tektoncicd) to report
                  its own DevClusterReady condition - resolves itself once it does.
                target: CompositeAndClaim
            <<- end >>
            <<- if $cicdOnboardedCondition >>
              - type: CicdOnboarded
                status: <<$cicdOnboardedCondition.status | toJson>>
                reason: <<$cicdOnboardedCondition.reason>>
                message: <<$cicdOnboardedCondition.message | toJson>>
                target: CompositeAndClaim
            <<- else >>
              - type: CicdOnboarded
                status: "False"
                reason: CicdOnboardingPending
                message: >-
                  Waiting on the composed TektonCICD child (<<$xrName>>-tektoncicd) to report
                  its own CicdOnboarded condition - resolves itself once it does.
                target: CompositeAndClaim
            <<- end >>
            <<- if $target.enabled >>
            <<- if $targetCondition >>
              - type: TargetReady
                status: <<$targetCondition.status | toJson>>
                reason: <<$targetCondition.reason>>
                message: <<$targetCondition.message | toJson>>
                target: CompositeAndClaim
            <<- else >>
              - type: TargetReady
                status: "False"
                reason: TargetPending
                message: >-
                  spec.target.enabled is set; waiting on the composed <<$targetKind>> child (<<$xrName>>-target)
                  to report its own TargetReady condition - resolves itself once it does.
                target: CompositeAndClaim
            <<- end >>
            <<- end >>
            ---
        delims:
          left: "<<"
          right: ">>"
