# --observed-resources fixture for the scaffold-ledger cases (see ../README.md and
# compositions/_shared/render-github-resources/00-scaffold-done.yaml): every create-once RepositoryFile
# of the python render, as provider-github reports it once the file is written (Ready=True). The
# render that sees this must still compose all of them (a file leaves the render only on the reconcile
# AFTER it enters the ledger) and must write all their names into status.scaffold.done.
# Generated from expected/python.yaml; regenerate rather than hand-edit if the scaffold set changes.
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: thumb-py-src-cicd-yaml
  namespace: demo-apps
  annotations:
    crossplane.io/composition-resource-name: src-repo-cicd-yaml
    crossplane.io/external-name: 'thumb-py:cicd.yaml:'
spec:
  managementPolicies:
  - Create
  - Observe
  - LateInitialize
  forProvider:
    repository: thumb-py
    file: cicd.yaml
status:
  conditions:
  - type: Ready
    status: 'True'
    reason: Available
  - type: Synced
    status: 'True'
    reason: ReconcileSuccess
---
