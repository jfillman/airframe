# Render cases for tools/test_compositions.py: each renders example/<xr> with the listed required
# (extra) and observed fixtures and is compared with example/expected/<name>.yaml; `expect` adds
# readable assertions. Regenerate expectations with `tools/test_compositions.py --update <composition>`.
cases:
- name: gate-fail
  xr: xr-defaults.yaml
- name: defaults
  xr: xr-defaults.yaml
  required:
  - cluster-registry-dev-ready.yaml
