# The same app created with deployTarget aws-ecs (2026-10-17): composes an AwsEcsTarget for dev and scaffolds a
# cicd.yaml that deploys dev to ECS.
# crossplane render doesn't run the XRD's own OpenAPI schema defaulting - this fixture
# spells out the XRD's actual defaults explicitly. See ../../../xrds/goapplication.yaml
# for these being schema-level defaults, not template-side ones.
apiVersion: catalog.hangar.io/v1alpha1
kind: GoApplication
metadata:
  name: widget-service
  namespace: demo-apps
spec:
  deployTarget: aws-ecs
  ecs:
    region: us-east-1
    architecture: arm64
  devCluster: kind-dev
  goVersion: "1.23"
  port: 8080
  visibility: private
