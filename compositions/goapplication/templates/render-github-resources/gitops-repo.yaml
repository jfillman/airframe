# Empty, scaffolded gitops-<app-name> repo - identical mechanism to
# nodejsapplication's own gitops-repo.yaml (straight port, not a redesign).
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $spec := .observed.composite.resource.spec >>
<<- $visibility := $spec.visibility >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: <<$xrName>>-gitops
  annotations:
    <<setResourceNameAnnotation "gitops-repo">>
    crossplane.io/external-name: <<printf "gitops-%s" $xrName>>
# managementPolicies (no "Delete") - Tier 2 domain-rename finding: this Repository had no
# managementPolicies at all (full "*" default), so deleting this XR would delete the real
# GitHub repo, not just a Kubernetes object. See nodejsapplication/templates/render-github-
# resources/src-repo.yaml's own header for the full writeup. Already live-patched on
# kiac-dev ahead of this landing.
spec:
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    name: <<printf "gitops-%s" $xrName>>
    description: <<printf "GitOps deployment repo for %s - <cluster>/<env>/values.yaml per environment" $xrName | toJson>>
    visibility: <<$visibility>>
    autoInit: true
    securityAndAnalysis:
      - secretScanning:
          - status: disabled
        secretScanningPushProtection:
          - status: disabled
---
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-gitops-readme
  annotations:
    <<setResourceNameAnnotation "gitops-repo-readme">>
spec:
  # No "Delete": this file is real developer/pipeline config after scaffolding (cicd.yaml) or a
  # human-edited README; deleting the XR must never delete it from GitHub. A Tier 2 prune once
  # destroyed cicd.yaml in 5 app repos through this policy.
  managementPolicies: ["Create", "Observe", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<printf "gitops-%s" $xrName>>
    file: README.md
    overwriteOnCreate: true
    content: |
      # gitops-<<$xrName>>

      GitOps deployment repo for `<<$xrName>>`, scaffolded by `GoApplication`
      (Airframe). Empty until this app's first `ApplicationEnvironment`
      resource is created - each environment gets its own `<cluster>/<env>/values.yaml`
      here, rendered by `airframe-application` (Airframe's shared Helm chart).
    commitMessage: "GoApplication scaffold: README.md"
