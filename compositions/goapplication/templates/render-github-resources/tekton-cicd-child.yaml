# Composes a TektonCICD child XR directly - identical mechanism to
# nodejsapplication's own tekton-cicd-child.yaml (straight port, not a redesign -
# see that file's own header, and xrds/tektoncicd.yaml's own header, for the full
# reasoning).
#
# Unconditional - not locally gated on $clusterOk. TektonCICD's own internal
# devcluster gate now owns that decision.
# apiVersion is deliberately still catalog.idp.io, NOT catalog.hangar.io - unlike
# SecretStore's own xr-requests literal (fixed in airframe#26/#27 only after EVERY app's
# SecretStore had already been migrated), no app has migrated TektonCICD yet. Flipping
# this literal directly (done in error, then reverted, in airframe#28) makes every parent
# XR compose a brand-new hangar-group TektonCICD child with the same name - Crossplane
# treats it as a different resource (apiVersion is part of its identity), so the real,
# already-Ready catalog.idp.io child becomes orphaned while the new one starts from
# scratch (Synced: False) - a real fleet-wide regression hit live 2026-09-30 across all 8
# real apps within minutes of shipping. Only flip this once TektonCICD itself has a real
# per-app migration path (see memory project_tier2_domain_rename_plan.md) - the same
# bar SecretStore's own fix cleared before its literal was safe to flip.
<<- $platformOwner := "jfillman" >>
apiVersion: catalog.idp.io/v1alpha1
kind: TektonCICD
metadata:
  name: <<$xrName>>-tektoncicd
  annotations:
    <<setResourceNameAnnotation "tektoncicd">>
spec:
  appName: <<$xrName>>
  gitopsRepoUrl: <<printf "https://github.com/%s/gitops-%s" $platformOwner $xrName>>
  appRepoUrl: <<printf "https://github.com/%s/%s" $platformOwner $xrName>>
  devCluster: <<$devCluster>>
---
