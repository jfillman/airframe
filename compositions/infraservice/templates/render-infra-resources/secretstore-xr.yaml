# Straight copy of nodejsapplication's own secretstore-xr.yaml - same mechanism,
# same reasoning (see that file's own header for the full history). A standalone
# infra service is exactly as entitled to its own (service, cluster)-scoped
# Infisical project/ClusterSecretStore as any app - e.g. a standalone Postgres
# needs somewhere to keep its own admin credentials before any consuming app's
# ExternalSecret can reference them.
<<- if $clusterOk >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-secretstore-xr
  annotations:
    <<setResourceNameAnnotation "secretstore-xr">>
spec:
  managementPolicies: ["Create", "Update", "Observe", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$tenantsRepo>>
    file: <<printf "tenants/%s/xr-requests/secretstore.yaml" $xrName>>
    overwriteOnCreate: true
    content: |
      apiVersion: catalog.idp.io/v1alpha1
      kind: SecretStore
      metadata:
        name: <<printf "%s-%s" $xrName $devCluster>>
      spec:
        appRef:
          name: <<$xrName>>
        cluster: <<$devCluster>>
    commitMessage: <<printf "Onboard %s: add tenants/%s/xr-requests/secretstore.yaml" $xrName $xrName | toJson>>
<<- end >>
