# Composes a TektonCICD child XR directly, same pattern as
# nodejsapplication's own tekton-cicd-child.yaml - see that file's own header for
# why this is a direct composed child, not a GitOps xr-requests commit (TektonCICD
# only calls the GitHub API, cluster-agnostic, no cross-cluster-credential
# blocker).
#
# type: infra, registerPipelinesAsCode: false - the two fields tektoncicd.yaml
# gained specifically for this XRD (2026-09-18). Every other Bootstrap-tier caller
# (NodeJSApplication/SpringBootApplication/GoApplication/PythonApplication) omits
# both and keeps today's "app"/true defaults; InfraService is the first (and so
# far only) caller that sets them explicitly.
#
# gitopsRepoUrl == appRepoUrl, both pointing at gitops-infra-<name> - unlike a real
# app (separate src and gitops repos), InfraService has exactly one repo, playing
# both roles. See cicd-yaml-stub.yaml (this same directory) and
# xrds/infraservice.yaml's own header for why appRepoUrl has to point at a real,
# existing repo at all even though this service has no source code to build.
# apiVersion is STICKY to whatever group this app's child already has (Tier 2 domain rename, memory
# project_tier2_domain_rename_plan.md): an existing child keeps the apiVersion it was created with,
# a brand-new one (nothing observed yet) is created under catalog.hangar.io.
#
# Why not a plain literal: Crossplane treats apiVersion as part of a composed resource's identity, so
# flipping a literal orphans the existing child and spawns an unready duplicate that fights it over the
# same external files (hit live 2026-09-30 across all 8 apps, airframe#30). Sticky means deploying this
# changes nothing for an existing app. To migrate one app, delete its TektonCICD child: its
# RepositoryFile children have no Delete policy (real files survive), and this parent re-renders it
# under the new default, which adopts the same files. Same observed-pinning pattern as src-repo.yaml's
# scaffoldFile.
<<- $obsTektonCicd := index (.observed.resources | default dict) "tektoncicd" | default dict >>
<<- $tektonCicdApiVersion := dig "resource" "apiVersion" "catalog.hangar.io/v1alpha1" $obsTektonCicd >>
<<- $platformOwner := "jfillman" >>
apiVersion: <<$tektonCicdApiVersion>>
kind: TektonCICD
metadata:
  name: <<$xrName>>-tektoncicd
  annotations:
    <<setResourceNameAnnotation "tektoncicd">>
spec:
  appName: <<$xrName>>
  type: infra
  registerPipelinesAsCode: false
  gitopsRepoUrl: <<printf "https://github.com/%s/gitops-infra-%s" $platformOwner $xrName>>
  appRepoUrl: <<printf "https://github.com/%s/gitops-infra-%s" $platformOwner $xrName>>
  devCluster: <<$devCluster>>
---
