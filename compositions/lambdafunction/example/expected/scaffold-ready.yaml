  name: src-repo-readme
  spec:
    forProvider:
      commitMessage: 'LambdaFunction scaffold: README.md'
      content: '# resize-fn


        resize-fn - an AWS Lambda function


        Scaffolded by `LambdaFunction` (Airframe). Runtime: `nodejs22`. Region: `us-east-1`.


        Run it locally (the AWS Lambda base image bundles the Runtime Interface Emulator):


        ```

        container build -t resize-fn -f Containerfile .

        container run --rm -p 9000:8080 resize-fn

        curl -s -XPOST http://localhost:9000/2015-03-31/functions/function/invocations -d ''{}''

        ```


        **Deploys to an existing Lambda function.** Glidepath updates the function''s container image

        (`deploy.target: aws-lambda` in `cicd.yaml`); it never creates the function. Create the function

        (package type `Image`), its execution role and its ECR repository first, then add

        `aws-access-key-id` and `aws-secret-access-key` to this app''s Infisical project.


        **Known gap:** Lambda can only pull from Amazon ECR, and Glidepath currently pushes every image to

        `ghcr.io`, so the deploy stage reports that until ECR support lands in Glidepath.

        '
      file: README.md
      overwriteOnCreate: false
      repository: resize-fn
    managementPolicies:
    - Create
    - Observe
    - LateInitialize
    providerConfigRef:
      kind: ClusterProviderConfig
      name: default
