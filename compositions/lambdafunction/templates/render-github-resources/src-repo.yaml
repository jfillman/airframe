<<- if eq $runtime "go" >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-src-go-mod
  annotations:
    <<setResourceNameAnnotation "src-repo-go-mod">>
    crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:go.mod:" $xrName) (index (.observed.resources | default dict) "src-repo-go-mod" | default dict)>>"
spec:
  managementPolicies: ["Create", "Observe", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$xrName>>
    file: go.mod
    overwriteOnCreate: false
    content: |
      module github.com/<<$platformOwner>>/<<$xrName>>

      go 1.24

      require github.com/aws/aws-lambda-go v1.47.0
    commitMessage: "LambdaFunction scaffold: go.mod"
---
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-src-main-go
  annotations:
    <<setResourceNameAnnotation "src-repo-main-go">>
    crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:main.go:" $xrName) (index (.observed.resources | default dict) "src-repo-main-go" | default dict)>>"
spec:
  managementPolicies: ["Create", "Observe", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$xrName>>
    file: main.go
    overwriteOnCreate: false
    content: |
      package main

      import (
      	"context"
      	"encoding/json"

      	"github.com/aws/aws-lambda-go/events"
      	"github.com/aws/aws-lambda-go/lambda"
      )

      func handler(ctx context.Context, req events.LambdaFunctionURLRequest) (events.LambdaFunctionURLResponse, error) {
      	body, _ := json.Marshal(map[string]string{"message": "Hello from <<$xrName>>", "path": req.RawPath})
      	return events.LambdaFunctionURLResponse{
      		StatusCode: 200,
      		Headers:    map[string]string{"content-type": "application/json"},
      		Body:       string(body),
      	}, nil
      }

      func main() {
      	lambda.Start(handler)
      }
    commitMessage: "LambdaFunction scaffold: main.go"
---
<<- $obsD := index (.observed.resources | default dict) "src-repo-dockerfile" >>
<<- $pinnedFile := include "scaffoldFile" (dict "obs" $obsD "default" "Containerfile") >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-src-dockerfile
  annotations:
    <<setResourceNameAnnotation "src-repo-dockerfile">>
    crossplane.io/external-name: "<<$dExt := printf "%s:%s:" $xrName $pinnedFile>><<$oExt := dig "resource" "metadata" "annotations" "crossplane.io/external-name" $dExt (index (.observed.resources | default dict) "src-repo-dockerfile" | default dict)>><<if hasPrefix $dExt $oExt>><<$oExt>><<else>><<$dExt>><<end>>"
spec:
  managementPolicies: ["Create", "Observe", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$xrName>>
    file: <<$pinnedFile>>
    overwriteOnCreate: false
    content: |
      FROM golang:1.24 AS build
      WORKDIR /src
      COPY go.mod main.go ./
      RUN go mod tidy && CGO_ENABLED=0 go build -tags lambda.norpc -o /out/main .

      FROM public.ecr.aws/lambda/provided:al2023
      COPY --from=build /out/main ./main
      ENTRYPOINT ["./main"]
    commitMessage: "LambdaFunction scaffold: Containerfile"
---
<<- end >>
