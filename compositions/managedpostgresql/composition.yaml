            apiVersion: rds.aws.m.upbound.io/v1beta1
            kind: Instance
            metadata:
              name: <<$xrName>>-instance
              annotations:
                <<setResourceNameAnnotation "instance">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                identifier: <<$serverName>>
                engine: postgres
                engineVersion: <<$version | quote>>
                autoMinorVersionUpgrade: true
                instanceClass: <<$instanceClass>>
                allocatedStorage: <<$storageGiB>>
                storageType: gp3
                storageEncrypted: true
                dbName: <<$databaseName>>
                username: <<$username>>
                autoGeneratePassword: true
                passwordSecretRef:
                  name: <<$xrName>>-credentials
                  key: password
                port: <<$port>>
                publiclyAccessible: true
                dbSubnetGroupNameRef:
                  name: <<$xrName>>-subnets
                vpcSecurityGroupIdRefs:
                  - name: <<$xrName>>-sg
                backupRetentionPeriod: <<$backupDays>>
                copyTagsToSnapshot: true
                applyImmediately: true
                deletionProtection: <<$protect>>
                skipFinalSnapshot: <<not $protect>>
                <<- if $protect >>
                finalSnapshotIdentifier: <<$serverName>>-final
                <<- end >>
                tags:
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            <<- end >>
            ---
            # cloud: azure - a resource group this XR owns, the Flexible Server, its database, and one firewall rule per
            # spec.allowedCidrs entry (no rule, no access). The provider generates the admin password into the Secret
            # <name>-credentials, key password, as on AWS. require_secure_transport is ON by default on Flexible Server, so
            # a plaintext connection is refused with no server parameter of our own.
            #
            # Firewall rules take an address range, not a CIDR, so each CIDR is turned into its first and last address here:
            # the address as a 32-bit number, rounded down to the block size (2^(32-prefix)) for the start, plus the block
            # size minus one for the end.
            <<- if eq $cloud "azure" >>
            apiVersion: azure.m.upbound.io/v1beta1
            kind: ResourceGroup
            metadata:
              name: <<$xrName>>-rg
              annotations:
                <<setResourceNameAnnotation "resource-group">>
                crossplane.io/external-name: <<$resourceGroup>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                location: <<$location>>
                tags:
                  <<- range $k, $v := $azureTags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: dbforpostgresql.azure.m.upbound.io/v1beta1
            kind: FlexibleServer
            metadata:
              name: <<$xrName>>-server
              annotations:
                <<setResourceNameAnnotation "server">>
                crossplane.io/external-name: <<$serverName>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                location: <<$location>>
                resourceGroupNameRef:
                  name: <<$xrName>>-rg
                version: <<$version | quote>>
                skuName: <<$azureSku>>
                storageMb: <<mul $storageGiB 1024>>
                administratorLogin: <<$username>>
                autoGeneratePassword: true
                administratorPasswordSecretRef:
                  name: <<$xrName>>-credentials
                  key: password
                authentication:
                  passwordAuthEnabled: true
                  activeDirectoryAuthEnabled: false
                publicNetworkAccessEnabled: true
                backupRetentionDays: <<$backupDays>>
                tags:
                  <<- range $k, $v := $azureTags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: dbforpostgresql.azure.m.upbound.io/v1beta1
            kind: FlexibleServerDatabase
            metadata:
              name: <<$xrName>>-database
              annotations:
                <<setResourceNameAnnotation "database">>
                crossplane.io/external-name: <<$databaseName>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                serverIdRef:
                  name: <<$xrName>>-server
                charset: UTF8
                collation: en_US.utf8
            <<- range $i, $c := $cidrs >>
            <<- $parts := splitList "/" $c >>
            <<- $o := splitList "." (index $parts 0) >>
            <<- $ip := add (mul (atoi (index $o 0)) 16777216) (mul (atoi (index $o 1)) 65536) (mul (atoi (index $o 2)) 256) (atoi (index $o 3)) >>
            <<- $blockSize := 1 >>
            <<- range until (sub 32 (atoi (index $parts 1)) | int) >><<- $blockSize = mul $blockSize 2 >><<- end >>
            <<- $start := sub $ip (mod $ip $blockSize) >>
            <<- $end := add $start (sub $blockSize 1) >>
            ---
            apiVersion: dbforpostgresql.azure.m.upbound.io/v1beta1
            kind: FlexibleServerFirewallRule
            metadata:
              name: <<$xrName>>-allow-<<$i>>
              annotations:
                <<setResourceNameAnnotation (printf "allow-%d" $i)>>
                crossplane.io/external-name: <<printf "hangar-allow-%d" $i>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                serverIdRef:
                  name: <<$xrName>>-server
                startIpAddress: <<printf "%d.%d.%d.%d" (div $start 16777216) (mod (div $start 65536) 256) (mod (div $start 256) 256) (mod $start 256)>>
                endIpAddress: <<printf "%d.%d.%d.%d" (div $end 16777216) (mod (div $end 65536) 256) (mod (div $end 256) 256) (mod $end 256)>>
            <<- end >>
            <<- end >>
            ---
            # The ConfigMap <name>-connection: everything but the password, in this XR's namespace. The password is the
            # provider-written Secret <name>-credentials, key password. host is empty until the server has been observed.
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: <<$xrName>>-connection
              annotations:
                <<setResourceNameAnnotation "connection">>
              labels:
                hangar.io/dependency: <<$xrName>>
                hangar.io/component: managed-postgresql
            data:
              cloud: <<$cloud>>
              host: <<$host | quote>>
              port: <<$port | quote>>
              database: <<$databaseName | quote>>
              username: <<$username | quote>>
              sslmode: require
              passwordSecret: <<printf "%s-credentials" $xrName | quote>>
              passwordKey: password
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
    - step: dependency-status
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # Inputs shared by both steps (templates/dependency-status/01-inputs.yaml is a symlink to this file), declared
            # at the unindented scope so they persist across the --- separators for the rest of the step.
            #
            # Nothing here is read from outside the XR (no registry, no other XR), so no input can go missing for a
            # reconcile and drop a composed resource. The admin user, hangar_admin, owns the database: azure_superuser,
            # admin, administrator, root, guest and public are reserved on Azure, rdsadmin and postgres-adjacent names on RDS.
            <<- $xr := .observed.composite.resource >>
            <<- $xrName := $xr.metadata.name >>
            <<- $spec := $xr.spec >>
            <<- $obs := .observed.resources | default dict >>
            <<- $cloud := $spec.cloud | default "aws" >>
            <<- $serverName := $spec.serverName | default $xrName >>
            <<- $version := $spec.version | default "17" >>
            <<- $size := $spec.size | default "small" >>
            <<- $storageGiB := $spec.storageGiB | default 32 >>
            <<- $databaseName := $spec.databaseName | default (replace "-" "_" $xrName) >>
            <<- $backupDays := $spec.backupRetentionDays | default 7 >>
            <<- $cidrs := $spec.allowedCidrs | default list >>
            <<- $protect := $spec.protect | default false >>
            <<- $region := $spec.region | default "us-east-1" >>
            <<- $vpcCidr := $spec.vpcCidr | default "10.43.0.0/16" >>
            <<- $location := $spec.location | default "eastus" >>
            <<- $resourceGroup := $spec.resourceGroup | default (printf "%s-rg" $serverName) >>
            <<- $username := "hangar_admin" >>
            <<- $port := 5432 >>
            <<- $instanceClass := get (dict "small" "db.t4g.micro" "medium" "db.t4g.small" "large" "db.t4g.medium") $size >>
            <<- $azureSku := get (dict "small" "B_Standard_B1ms" "medium" "B_Standard_B2s" "large" "GP_Standard_D2s_v3") $size >>
            <<- $octets := splitList "." $vpcCidr >>
            <<- $subnetA := printf "%s.%s.1.0/24" (index $octets 0) (index $octets 1) >>
            <<- $subnetB := printf "%s.%s.2.0/24" (index $octets 0) (index $octets 1) >>
            <<- $host := "" >>
            <<- if eq $cloud "aws" >>
              <<- $host = dig "resource" "status" "atProvider" "address" "" (index $obs "instance" | default dict) >>
            <<- else >>
              <<- $host = dig "resource" "status" "atProvider" "fqdn" "" (index $obs "server" | default dict) >>
            <<- end >>
            <<- /* The composed resources DependencyReady waits for, by composition-resource-name. */ ->>
            <<- $expected := list >>
            <<- if eq $cloud "aws" >>
              <<- $expected = list "vpc" "subnet-a" "subnet-b" "internet-gateway" "route-table" "route" "route-table-association-a" "route-table-association-b" "security-group" "subnet-group" "instance" >>
              <<- range $i, $c := $cidrs >><<- $expected = append $expected (printf "allow-%d" $i) >><<- end >>
            <<- else >>
              <<- $expected = list "resource-group" "server" "database" >>
              <<- range $i, $c := $cidrs >><<- $expected = append $expected (printf "allow-%d" $i) >><<- end >>
            <<- end >>
            <<- $tags := dict "hangar.io/dependency" $xrName "hangar.io/component" "managed-postgresql" >>
            <<- $azureTags := dict "hangar-dependency" $xrName "hangar-component" "managed-postgresql" >>
            ---
            # DependencyReady (closed reason set, see xrds/managedpostgresql.meta.yaml) plus the XR's own status. Inputs,
            # including $expected and $host, come from 01-inputs.yaml.
            <<- $pending := list >>
            <<- range $expected >>
              <<- $ready := false >>
              <<- range (dig "resource" "status" "conditions" list (index $obs . | default dict)) >>
                <<- if and (eq .type "Ready") (eq .status "True") >><<- $ready = true >><<- end >>
              <<- end >>
              <<- if not $ready >><<- $pending = append $pending . >><<- end >>
            <<- end >>
            <<- $serverKey := ternary "instance" "server" (eq $cloud "aws") >>
            <<- $reason := "ManagedPostgreSQLProvisioning" >>
            <<- $status := "False" >>
            <<- $message := printf "Waiting for %s to be ready (a new server takes 5 to 15 minutes; or the %s provider has no credentials yet)." (join ", " $pending) $cloud >>
            <<- /* A server the provider can't create (a taken Azure name, a quota, a refused instance class) is not
                   "provisioning": its Synced=False message is the reason, so it is surfaced here. Waiting for a reference (the
                   subnet group or security group not created yet) is also Synced=False, and is provisioning: on 2026-10-24 a
                   healthy first create reported ManagedPostgreSQLFailing for its first minute. */ ->>
            <<- if and (has $serverKey $pending) (index $obs $serverKey) >>
              <<- range (dig "resource" "status" "conditions" list (index $obs $serverKey)) >>
