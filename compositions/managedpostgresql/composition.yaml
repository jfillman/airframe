                <<- end >>
              <<- end >>
            <<- end >>
            <<- if not $pending >>
              <<- $reason = "ManagedPostgreSQLReady" >>
              <<- $status = "True" >>
              <<- $message = printf "PostgreSQL %s answers at %s:5432 (database %s, TLS required)%s; connection details are in the ConfigMap %s-connection, the password in the Secret %s-credentials." $serverName $host $databaseName (ternary " but admits no one: spec.allowedCidrs is empty" "" (empty $cidrs)) $xrName $xrName >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: DependencyReady
                status: <<$status | quote>>
                reason: <<$reason>>
                message: <<$message | quote>>
                target: CompositeAndClaim
            ---
            apiVersion: <<$xr.apiVersion>>
            kind: ManagedPostgreSQL
            status:
              cloud: <<$cloud>>
              serverName: <<$serverName>>
              <<- if $host >>
              host: <<$host | quote>>
              <<- end >>
              port: <<$port>>
              database: <<$databaseName | quote>>
              username: <<$username | quote>>
              connectionConfigMap: <<$xrName>>-connection
              credentialsSecret: <<$xrName>>-credentials
            ---
        delims:
          left: "<<"
          right: ">>"
