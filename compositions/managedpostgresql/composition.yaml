                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            <<- range $z, $cidr := dict "a" $subnetA "b" $subnetB >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: Subnet
            metadata:
              name: <<$xrName>>-subnet-<<$z>>
              annotations:
                <<setResourceNameAnnotation (printf "subnet-%s" $z)>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                availabilityZone: <<$region>><<$z>>
                cidrBlock: <<$cidr>>
                vpcIdRef:
                  name: <<$xrName>>-vpc
                tags:
                  Name: <<$serverName>>-pg-<<$z>>
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: RouteTableAssociation
            metadata:
              name: <<$xrName>>-rta-<<$z>>
              annotations:
                <<setResourceNameAnnotation (printf "route-table-association-%s" $z)>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                routeTableIdRef:
                  name: <<$xrName>>-rt
                subnetIdRef:
                  name: <<$xrName>>-subnet-<<$z>>
            <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: InternetGateway
            metadata:
              name: <<$xrName>>-igw
              annotations:
                <<setResourceNameAnnotation "internet-gateway">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                vpcIdRef:
                  name: <<$xrName>>-vpc
                tags:
                  Name: <<$serverName>>-pg
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: RouteTable
            metadata:
              name: <<$xrName>>-rt
              annotations:
                <<setResourceNameAnnotation "route-table">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                vpcIdRef:
                  name: <<$xrName>>-vpc
                tags:
                  Name: <<$serverName>>-pg
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: Route
            metadata:
              name: <<$xrName>>-default-route
              annotations:
                <<setResourceNameAnnotation "route">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                destinationCidrBlock: 0.0.0.0/0
                routeTableIdRef:
                  name: <<$xrName>>-rt
                gatewayIdRef:
                  name: <<$xrName>>-igw
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroup
            metadata:
              name: <<$xrName>>-sg
              annotations:
                <<setResourceNameAnnotation "security-group">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                name: <<$serverName>>-pg
                description: <<printf "PostgreSQL %s - 5432 from the allowed CIDRs only (Airframe ManagedPostgreSQL %s)" $serverName $xrName | toJson>>
                vpcIdRef:
                  name: <<$xrName>>-vpc
                tags:
                  Name: <<$serverName>>-pg
                  <<- range $k, $v := $tags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            <<- range $i, $c := $cidrs >>
            ---
            apiVersion: ec2.aws.m.upbound.io/v1beta1
            kind: SecurityGroupRule
            metadata:
              name: <<$xrName>>-allow-<<$i>>
              annotations:
                <<setResourceNameAnnotation (printf "allow-%d" $i)>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                type: ingress
                protocol: tcp
                fromPort: <<$port>>
                toPort: <<$port>>
                cidrBlocks:
                  - <<$c>>
                description: <<printf "PostgreSQL from %s" $c | toJson>>
                securityGroupIdRef:
                  name: <<$xrName>>-sg
            <<- end >>
            <<- end >>
            ---
            # cloud: aws - the DB subnet group and the instance. The provider generates the admin password and writes it
            # into the Secret <name>-credentials, key password (autoGeneratePassword + passwordSecretRef; it creates the
            # Secret when it doesn't exist and never overwrites one that does).
            #
            # TLS: rds.force_ssl is 1 in the default parameter group of every PostgreSQL major from 15, so 16 and 17 refuse
            # a plaintext connection with no parameter group of our own. Storage is encrypted with the account's RDS key.
            # engineVersion is the major alone: RDS picks its default minor and autoMinorVersionUpgrade keeps it current.
            # The instance's external-name is AWS's resource id (IdentifierFromProvider); its identifier is serverName.
            <<- if eq $cloud "aws" >>
            apiVersion: rds.aws.m.upbound.io/v1beta1
            kind: SubnetGroup
            metadata:
              name: <<$xrName>>-subnets
              annotations:
                <<setResourceNameAnnotation "subnet-group">>
                crossplane.io/external-name: <<$serverName>>-pg
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                region: <<$region>>
                description: <<printf "Subnets of PostgreSQL %s (Airframe ManagedPostgreSQL %s)" $serverName $xrName | toJson>>
                subnetIdRefs:
                  - name: <<$xrName>>-subnet-a
                  - name: <<$xrName>>-subnet-b
                tags:
