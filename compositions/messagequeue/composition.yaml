                sku: Basic
                localAuthEnabled: true
                minimumTlsVersion: "1.2"
                tags:
                  <<- range $k, $v := $azureTags >>
                  <<$k>>: <<$v | quote>>
                  <<- end >>
            ---
            apiVersion: servicebus.azure.m.upbound.io/v1beta1
            kind: Queue
            metadata:
              name: <<$xrName>>-queue
              annotations:
                <<setResourceNameAnnotation "queue">>
                crossplane.io/external-name: <<$queueName>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                namespaceIdRef:
                  name: <<$xrName>>-sb
                lockDuration: <<printf "PT%dS" (int $lockSeconds) | quote>>
                defaultMessageTtl: <<printf "PT%dS" (int $retention) | quote>>
                maxDeliveryCount: <<$maxReceive>>
                deadLetteringOnMessageExpiration: <<$dlEnabled>>
            ---
            apiVersion: servicebus.azure.m.upbound.io/v1beta1
