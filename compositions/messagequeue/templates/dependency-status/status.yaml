# DependencyReady (closed reason set, see xrds/messagequeue.meta.yaml) plus the XR's own status. Inputs,
# including $expected (the composed resources to wait for) and $consumers, come from 01-inputs.yaml. The
# composite document carries no composition-resource-name annotation, so function-go-templating updates the
# composite's status.
<<- $pending := list >>
<<- range $expected >>
  <<- $ready := false >>
  <<- range (dig "resource" "status" "conditions" list (index $obs . | default dict)) >>
    <<- if and (eq .type "Ready") (eq .status "True") >><<- $ready = true >><<- end >>
  <<- end >>
  <<- if not $ready >><<- $pending = append $pending . >><<- end >>
<<- end >>
<<- $problems := list >>
<<- $granted := list >>
<<- range $consumers >>
  <<- if .problem >><<- $problems = append $problems .problem >><<- end >>
  <<- if .roleName >><<- $granted = append $granted .name >><<- end >>
<<- end >>
<<- $reason := "MessageQueueProvisioning" >>
<<- $status := "False" >>
<<- $message := printf "Waiting for %s to be ready (just created, or the %s provider has no credentials yet)." (join ", " $pending) $cloud >>
<<- if and (eq $cloud "aws") (not $acct) >>
  <<- $reason = "MessageQueueNeedsAwsAccount" >>
  <<- $message = "The cluster registry names no AWS account (clusters.yaml aws.accountId), so the queue's ARN is unknown and nothing is created. Airframe docs/admin/cloud-credentials.md." >>
<<- else if $pending >>
<<- else if $problems >>
  <<- $reason = "MessageQueueConsumerUnresolved" >>
  <<- $message = printf "Queue %s is ready, but a consumer has no grant: %s. Fix or remove the consumers[] entry." $queueName (join "; " $problems) >>
<<- else >>
  <<- $reason = "MessageQueueReady" >>
  <<- $status = "True" >>
  <<- $message = printf "Queue %s is ready; its connection details are in the ConfigMap %s-connection." $queueName $xrName >>
<<- end >>
apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
kind: ClaimConditions
conditions:
  - type: DependencyReady
    status: <<$status | quote>>
    reason: <<$reason>>
    message: <<$message | quote>>
    target: CompositeAndClaim
---
apiVersion: <<$xr.apiVersion>>
kind: MessageQueue
status:
  cloud: <<$cloud>>
  queueName: <<$queueName | quote>>
  connectionConfigMap: <<$xrName>>-connection
  <<- if eq $cloud "aws" >>
  <<- if $acct >>
  url: <<$queueUrl | quote>>
  arn: <<$queueArn | quote>>
  <<- if $dlEnabled >>
  deadLetterArn: <<$dlqArn | quote>>
  <<- end >>
  <<- end >>
  consumers: <<$granted | toJson>>
  <<- else >>
  namespace: <<printf "%s.servicebus.windows.net" $nsName | quote>>
  credentialsSecret: <<$xrName>>-credentials
  <<- end >>
