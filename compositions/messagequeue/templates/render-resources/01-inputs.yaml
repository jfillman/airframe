# Inputs shared by both steps (templates/dependency-status/01-inputs.yaml is a symlink to this file), declared
# at the unindented scope so they persist across the --- separators for the rest of the step - the catalog's
# concatenated-template convention.
#
# $acct, the AWS account, builds the queue ARNs the redrive policy and the grants name before the queue
# exists. It comes from the cluster registry ($awsAccountId, 00-cloud-identity.yaml) and, when the registry
# can't be read for a reconcile, from the observed queue's own ARN: an input that can be missing for one
# reconcile must never drop a composed resource (incident 2026-10-16, see awslambdatarget).
#
# Consumers: each spec.consumers[] entry is looked up as an AwsLambdaTarget XR of that name in this
# namespace (the ExtraResources below). Its function and execution role names follow that target's own
# convention (functionName defaults to its XR name; the role is <functionName cut to 59>-exec). A target that
# can't be read keeps the grant and trigger it already has, from their observed spec; one that was never
# seen gets nothing and DependencyReady says MessageQueueConsumerUnresolved.
<<- $xr := .observed.composite.resource >>
<<- $xrName := $xr.metadata.name >>
<<- $xrNs := $xr.metadata.namespace >>
<<- $spec := $xr.spec >>
<<- $obs := .observed.resources | default dict >>
<<- $cloud := $spec.cloud | default "aws" >>
<<- $fifo := $spec.fifo | default false >>
<<- $baseName := $spec.queueName | default $xrName >>
<<- $queueName := $baseName >>
<<- $dlqName := printf "%s-dlq" $baseName >>
<<- if $fifo >>
  <<- $queueName = printf "%s.fifo" $baseName >>
  <<- $dlqName = printf "%s-dlq.fifo" $baseName >>
<<- end >>
<<- $lockSeconds := $spec.lockSeconds | default 30 >>
<<- $retention := $spec.retentionSeconds | default 345600 >>
<<- $dl := $spec.deadLetter | default dict >>
<<- $dlEnabled := true >>
<<- if hasKey $dl "enabled" >><<- $dlEnabled = $dl.enabled >><<- end >>
<<- $maxReceive := $dl.maxReceiveCount | default 5 >>
<<- $region := $spec.region | default "us-east-1" >>
<<- $location := $spec.location | default "eastus" >>
<<- $resourceGroup := $spec.resourceGroup | default (printf "%s-rg" $baseName) >>
<<- $nsName := $spec.namespaceName | default (printf "hangar-%s" $baseName | trunc 50 | trimSuffix "-") >>
<<- $acct := $awsAccountId >>
<<- if not $acct >>
  <<- $observedArn := dig "resource" "status" "atProvider" "arn" "" (index $obs "queue" | default dict) >>
  <<- if $observedArn >><<- $acct = index (splitList ":" $observedArn) 4 >><<- end >>
<<- end >>
<<- $queueArn := printf "arn:aws:sqs:%s:%s:%s" $region $acct $queueName >>
<<- $dlqArn := printf "arn:aws:sqs:%s:%s:%s" $region $acct $dlqName >>
<<- $queueUrl := dig "resource" "status" "atProvider" "url" (printf "https://sqs.%s.amazonaws.com/%s/%s" $region $acct $queueName) (index $obs "queue" | default dict) >>
<<- $dlqUrl := dig "resource" "status" "atProvider" "url" (printf "https://sqs.%s.amazonaws.com/%s/%s" $region $acct $dlqName) (index $obs "dead-letter-queue" | default dict) >>
<<- $extra := .extraResources | default dict >>
<<- $consumers := list >>
<<- if eq $cloud "aws" >>
<<- range ($spec.consumers | default list) >>
  <<- $tName := .awsLambdaTarget >>
  <<- $items := index (index $extra (printf "consumer-%s" $tName) | default dict) "items" | default list >>
  <<- $grantObs := index $obs (printf "grant-%s" $tName) | default dict >>
  <<- $triggerObs := index $obs (printf "trigger-%s" $tName) | default dict >>
  <<- $functionName := "" >>
  <<- $roleName := "" >>
  <<- $problem := "" >>
  <<- if $items >>
    <<- $t := (first $items).resource >>
    <<- $functionName = dig "spec" "functionName" $t.metadata.name $t >>
    <<- $roleName = printf "%s-exec" (trunc 59 $functionName) >>
    <<- $tRegion := dig "spec" "region" "us-east-1" $t >>
    <<- if ne $tRegion $region >>
      <<- $problem = printf "AwsLambdaTarget %s is in %s and this queue in %s; a Lambda function can't be triggered by a queue in another region" $tName $tRegion $region >>
      <<- $functionName = "" >>
      <<- $roleName = "" >>
    <<- end >>
  <<- else >>
    <<- $problem = printf "no AwsLambdaTarget %s in namespace %s" $tName $xrNs >>
    <<- $roleName = dig "resource" "spec" "forProvider" "role" "" $grantObs >>
    <<- $functionName = dig "resource" "spec" "forProvider" "functionName" "" $triggerObs >>
  <<- end >>
  <<- $consumers = append $consumers (dict "name" $tName "access" (.access | default "sendReceive") "trigger" (.trigger | default false) "batchSize" (.batchSize | default 10) "functionName" $functionName "roleName" $roleName "problem" $problem) >>
<<- end >>
<<- end >>
<<- /* The composed resources DependencyReady waits for, by composition-resource-name. */ ->>
<<- $expected := list >>
<<- if eq $cloud "aws" >>
  <<- $expected = append $expected "queue" >>
  <<- if $dlEnabled >><<- $expected = append $expected "dead-letter-queue" >><<- end >>
  <<- range $consumers >>
    <<- if .roleName >><<- $expected = append $expected (printf "grant-%s" .name) >><<- end >>
    <<- if and .trigger .functionName >><<- $expected = append $expected (printf "trigger-%s" .name) >><<- end >>
  <<- end >>
<<- else >>
  <<- $expected = list "resource-group" "namespace" "queue" "authorization-rule" >>
<<- end >>
<<- $tags := dict "hangar.io/dependency" $xrName "hangar.io/component" "message-queue" >>
<<- $azureTags := dict "hangar-dependency" $xrName "hangar-component" "message-queue" >>
<<- if and (eq $cloud "aws") ($spec.consumers | default list) >>
apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
kind: ExtraResources
requirements:
  <<- range $spec.consumers >>
  consumer-<<.awsLambdaTarget>>:
    apiVersion: catalog.hangar.io/v1alpha1
    kind: AwsLambdaTarget
    namespace: <<$xrNs>>
    matchName: <<.awsLambdaTarget>>
  <<- end >>
<<- end >>
