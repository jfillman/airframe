# GENERATED FILE - do not hand-edit the pipeline's `input.inline.template`
# block below. Edit templates/*.yaml instead, then run ./build-composition.sh
# to regenerate this file.
#
# Fourth real Component XRD's Composition (SP-3) - wraps MongoDB Controllers for Kubernetes' own
# MongodDBCommunity CRD; see xrds/mongodb.yaml's own header for the full "why this CRD, why this
# operator" reasoning. Single function-go-templating step: renders an input password Secret, the
# MongoDBCommunity replica set, and a ComponentReady status condition (AF-6a) - see each
# templates/*.yaml file's own header.
#
# Delimiters: << >> instead of Go's default {{ }}, matching every other Composition in this catalog.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: mongodb.catalog.idp.io
spec:
  compositeTypeRef:
    apiVersion: catalog.idp.io/v1alpha1
    kind: MongoDB
  mode: Pipeline
  pipeline:
    - step: render-mongodb-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # The MongoDBCommunity CRD does not generate its own user password (unlike CNPG/Bitnami redis) - it
            # reads one from an INPUT Secret named by `users[].passwordSecretRef` and, once read, writes it (plus
            # the derived connection strings) into a SEPARATE output Secret the operator itself manages (see
            # replicaset.yaml's own header). This input Secret must be stable across reconciles - re-rendering a
            # fresh random value every time would rotate the real database password on every sync, a real
            # incident class this project has learned to guard against. Standard function-go-templating idiom:
            # reuse the observed Secret's own data if it already exists, generate fresh only the first time.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $existing := index (.observed.resources | default dict) "password-secret" | default dict >>
            <<- $existingData := index (index $existing "resource" | default dict) "data" | default dict >>
            <<- $password := index $existingData "password" | default "" >>
            <<- if eq $password "" >>
              <<- $password = randAlphaNum 32 | b64enc >>
            <<- end >>
            <<- $hangarLabels := dict >>
            <<- range $k, $v := (.observed.composite.resource.metadata.labels | default dict) >>
              <<- if hasPrefix "hangar.io/" $k >>
                <<- $_ := set $hangarLabels $k $v >>
              <<- end >>
            <<- end >>
            apiVersion: v1
            kind: Secret
            metadata:
              name: <<printf "%s-mongo-password" $xrName>>
              namespace: <<$xrNamespace>>
              annotations:
                <<setResourceNameAnnotation "password-secret">>
              labels:
                <<- range $k, $v := $hangarLabels >>
                <<$k>>: <<$v | quote>>
                <<- end >>
            type: Opaque
            data:
              password: <<$password>>
            ---
            # Wraps MongoDB Controllers for Kubernetes' `mongodbcommunity.mongodb.com/v1 MongoDBCommunity` CRD -
            # see xrds/mongodb.yaml's own header for why this CRD and not a from-scratch controller.
            #
            # `connectionStringSecretName` is set explicitly to `<xr>-app`, matching CNPG's own `<name>-app`
            # naming convention for its equivalent output Secret - one canonical "the app's own credentials"
            # name per component type family, not a name the operator would otherwise pick on its own. The
            # operator creates and owns this Secret itself once it reads the input password Secret
            # (templates/password.yaml); nothing here renders it directly.
            #
            # mongod image defaults to quay.io/mongodb/mongodb-community-server:8.0.32-ubi8 (multi-arch: amd64 +
            # arm64, verified against the real Quay registry), overridable per XR via spec.mongoVersion - kind-prod
            # pins 7.0.x because MongoDB 8.0 crashes on Linux kernel 6.19..7.0.13 (SERVER-121912).
            #
            # Readiness: function-auto-ready only trusts a Ready condition, which neither the MongoDBCommunity
            # (it only has status.phase) nor a Role/RoleBinding ever has, so each is marked ready explicitly -
            # the replica set when phase is Running, the RBAC objects on existence - otherwise the XR sticks at
            # Ready=False ("Unready resources: appdb-role, appdb-rolebinding, and replicaset").
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $members := $spec.members | default 1 >>
            <<- $storage := $spec.storageSize | default "5Gi" >>
            <<- $version := $spec.mongoVersion | default "8.0.32" >>
            <<- $rsObs := index (.observed.resources | default dict) "replicaset" | default dict >>
            <<- $rsReady := "False" >>
            <<- if eq (dig "resource" "status" "phase" "" $rsObs) "Running" >>
              <<- $rsReady = "True" >>
            <<- end >>
            <<- $db := $spec.databaseName | default (replace "-" "_" $xrName) >>
            <<- $hangarLabels := dict >>
            <<- range $k, $v := (.observed.composite.resource.metadata.labels | default dict) >>
              <<- if hasPrefix "hangar.io/" $k >>
                <<- $_ := set $hangarLabels $k $v >>
              <<- end >>
            <<- end >>
            apiVersion: mongodbcommunity.mongodb.com/v1
            kind: MongoDBCommunity
            metadata:
              name: <<$xrName>>
              namespace: <<$xrNamespace>>
              annotations:
                <<setResourceNameAnnotation "replicaset">>
                gotemplating.fn.crossplane.io/ready: <<$rsReady | quote>>
              labels:
                <<- range $k, $v := $hangarLabels >>
                <<$k>>: <<$v | quote>>
                <<- end >>
            spec:
              members: <<$members | int>>
              type: ReplicaSet
              version: <<$version | quote>>
              security:
                authentication:
                  modes: ["SCRAM"]
              users:
                - name: <<$db>>
                  db: <<$db>>
                  passwordSecretRef:
                    name: <<printf "%s-mongo-password" $xrName>>
                    key: password
                  roles:
                    - name: dbOwner
                      db: <<$db>>
                  scramCredentialsSecretName: <<printf "%s-scram" $xrName>>
                  connectionStringSecretName: <<printf "%s-app" $xrName>>
              statefulSet:
                spec:
                  volumeClaimTemplates:
                    - metadata:
                        name: data-volume
                      spec:
                        resources:
                          requests:
                            storage: <<$storage>>
            ---
            # MongoDB Controllers for Kubernetes' StatefulSet template hardcodes two ServiceAccount names for the
            # database pod itself - `mongodb-kubernetes-appdb` and `mongodb-kubernetes-database-pods` - which its
            # own Helm chart only creates in the OPERATOR's own namespace (mongodb-kubernetes-system), not in
            # every namespace the operator is told to watch. That's fine for a namespace-scoped install, but this
            # operator watches cluster-wide (gitops-cluster-dev's mongodb-kubernetes Application), so every app
            # namespace running a MongoDBCommunity replica set needs its own copy. Found live: the StatefulSet
            # controller's own FailedCreate event named the missing ServiceAccount exactly
            # ("mongodb-kubernetes-appdb" not found in the app namespace), not guessed ahead of time. The Role's
            # rules are copied verbatim from the operator's own namespace's identically-named Role (the chart's
            # own convention, not invented here) - get on Secrets, patch/delete/get on Pods, both scoped to this
            # one namespace only.
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $hangarLabels := dict >>
            <<- range $k, $v := (.observed.composite.resource.metadata.labels | default dict) >>
              <<- if hasPrefix "hangar.io/" $k >>
                <<- $_ := set $hangarLabels $k $v >>
              <<- end >>
            <<- end >>
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: mongodb-kubernetes-appdb
              namespace: <<$xrNamespace>>
              annotations:
                <<setResourceNameAnnotation "appdb-sa">>
              labels:
                <<- range $k, $v := $hangarLabels >>
                <<$k>>: <<$v | quote>>
                <<- end >>
            ---
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: mongodb-kubernetes-database-pods
              namespace: <<$xrNamespace>>
              annotations:
                <<setResourceNameAnnotation "database-pods-sa">>
              labels:
                <<- range $k, $v := $hangarLabels >>
                <<$k>>: <<$v | quote>>
                <<- end >>
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: mongodb-kubernetes-appdb
              namespace: <<$xrNamespace>>
              annotations:
                <<setResourceNameAnnotation "appdb-role">>
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                <<- range $k, $v := $hangarLabels >>
                <<$k>>: <<$v | quote>>
                <<- end >>
            rules:
              - apiGroups: [""]
                resources: ["secrets"]
                verbs: ["get"]
              - apiGroups: [""]
                resources: ["pods"]
                verbs: ["patch", "delete", "get"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: mongodb-kubernetes-appdb
              namespace: <<$xrNamespace>>
              annotations:
                <<setResourceNameAnnotation "appdb-rolebinding">>
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                <<- range $k, $v := $hangarLabels >>
                <<$k>>: <<$v | quote>>
                <<- end >>
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: mongodb-kubernetes-appdb
            subjects:
              - kind: ServiceAccount
                name: mongodb-kubernetes-appdb
                namespace: <<$xrNamespace>>
            ---
            # AF-6a: a custom ComponentReady condition with a closed reason code + hint, computed from the
            # composed MongoDBCommunity's own status.phase (verified against the real operator source -
            # mongodb-community-operator/api/v1/mongodbcommunity_types.go - the only three values it ever sets:
            # Running, Pending, Failed). Same mechanism and not-named-"Ready" reasoning as
            # compositions/redis/templates/status.yaml (see that file's own header).
            <<- $rs := index (.observed.resources | default dict) "replicaset" | default dict >>
            <<- $rsResource := index $rs "resource" | default dict >>
            <<- $rsStatus := index $rsResource "status" | default dict >>
            <<- $phase := index $rsStatus "phase" | default "" >>
            <<- $message := index $rsStatus "message" | default "" >>
            <<- $reason := "MongoDBProvisioning" >>
            <<- $status := "False" >>
            <<- $out := "Waiting for the MongoDBCommunity replica set to be observed for the first time." >>
            <<- if eq $phase "Running" >>
              <<- $reason = "MongoDBReady" >>
              <<- $status = "True" >>
              <<- $out = "The MongoDBCommunity replica set reports Running." >>
            <<- else if eq $phase "Failed" >>
              <<- $reason = "MongoDBFailed" >>
              <<- $out = printf "The MongoDBCommunity replica set reports Failed: %s" (default "no message" $message) >>
            <<- else if eq $phase "Pending" >>
              <<- $reason = "MongoDBPending" >>
              <<- $out = printf "The MongoDBCommunity replica set is Pending: %s" (default "no message" $message) >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: ComponentReady
                status: <<$status | quote>>
                reason: <<$reason>>
                message: <<$out | quote>>
                target: CompositeAndClaim
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
