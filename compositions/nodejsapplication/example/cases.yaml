# Render cases for tools/test_compositions.py: each renders example/<xr> with the listed required
# (extra) and observed fixtures and is compared with example/expected/<name>.yaml; `expect` adds
# readable assertions. Regenerate expectations with `tools/test_compositions.py --update <composition>`.
cases:
- name: defaults
  xr: xr-defaults.yaml
- name: pnpm-custom
  xr: xr-pnpm-custom.yaml
- name: scaffold-ready
  xr: xr-defaults.yaml
  observed:
  - observed-scaffold-ready.yaml
  expect:
    present: &id001
    - gitops-repo-readme
    - src-repo-cicd-yaml
    - src-repo-dockerfile
    - src-repo-gitignore
    - src-repo-index-js
    - src-repo-package-json
    - src-repo-readme
    status:
      scaffold:
        done: *id001
- name: scaffold-retired
  xr: xr-defaults-scaffolded.yaml
  expect:
    absent: *id001
    status:
      scaffold:
        done: *id001
- name: scaffold-partial
  xr: xr-defaults-partial.yaml
  observed:
  - observed-scaffold-partial.yaml
  expect:
    absent:
    - src-repo-index-js
    - src-repo-package-json
    present:
    - src-repo-dockerfile
    - src-repo-gitignore
    - src-repo-readme
    - src-repo-cicd-yaml
    - gitops-repo-readme
    status:
      scaffold:
        done:
        - src-repo-index-js
        - src-repo-package-json
        - src-repo-readme
