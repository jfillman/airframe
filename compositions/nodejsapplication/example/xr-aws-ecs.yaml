# The same app created with deployTarget aws-ecs (2026-10-17): composes an AwsEcsTarget for dev and scaffolds a
# cicd.yaml that deploys dev to ECS.
# crossplane render doesn't run the XRD's own OpenAPI schema defaulting (that's real
# apiserver/CRD-admission behavior, not something the offline render tool replicates) -
# so this fixture spells out the XRD's actual defaults explicitly rather than relying on
# `spec: {}`, which would leave every field <no value> in the rendered output instead of
# exercising the real default values a live cluster would apply. See ../../../xrds/
# nodejsapplication.yaml for these being schema-level defaults, not template-side ones.
apiVersion: catalog.hangar.io/v1alpha1
kind: NodeJSApplication
metadata:
  name: widget-service
  namespace: demo-apps
spec:
  deployTarget: aws-ecs
  ecs:
    region: us-east-1
    architecture: arm64
  devCluster: kind-dev
  nodeVersion: "20"
  packageManager: npm
  port: 8080
  visibility: private
