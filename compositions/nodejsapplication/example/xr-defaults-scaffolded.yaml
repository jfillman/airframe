# xr-defaults.yaml plus the scaffold ledger as it stands once every scaffold file of the defaults
# render has been seen Ready and recorded (status.scaffold.done). The render for this XR must compose
# NONE of those files (scaffold once, reconcile never) and must carry the ledger forward unchanged.
apiVersion: catalog.hangar.io/v1alpha1
kind: NodeJSApplication
metadata:
  name: widget-service
  namespace: demo-apps
spec:
  devCluster: kind-dev
  nodeVersion: '20'
  packageManager: npm
  port: 8080
  visibility: private
status:
  scaffold:
    done:
    - gitops-repo-readme
    - src-repo-cicd-yaml
    - src-repo-dockerfile
    - src-repo-gitignore
    - src-repo-index-js
    - src-repo-package-json
    - src-repo-readme
