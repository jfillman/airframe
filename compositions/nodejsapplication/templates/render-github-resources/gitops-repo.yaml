# Empty, scaffolded gitops-<app-name> repo - idp/docs/service-catalog-design.md Item 1/2:
# "gitops-<app-name> gets created here, empty, rather than by item 3 [ApplicationEnvironment]
# - its lifecycle is app-level (create once)". Just a README for now; the real
# <cluster>/<env>/values.yaml layout gets populated once ApplicationEnvironment exists.
#
# crossplane.io/external-name below - same fix, same reasoning as src-repo.yaml's own
# header: a cluster rebuild's fresh Repository MR has no external-name, so
# provider-github tries to Create a repo that already exists on GitHub and 422s. Set to
# the deterministic gitops-<app> name up front so it Observes/adopts instead.
#
# managementPolicies (no "Delete") - same Tier 2 domain-rename finding as src-repo.yaml's
# own header: no policy at all here defaulted to "*", so deleting this XR would delete
# the real GitOps repo. Already live-patched on kiac-dev ahead of this landing.
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $spec := .observed.composite.resource.spec >>
<<- $visibility := $spec.visibility >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: <<$xrName>>-gitops
  annotations:
    <<setResourceNameAnnotation "gitops-repo">>
    crossplane.io/external-name: <<printf "gitops-%s" $xrName>>
spec:
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    name: <<printf "gitops-%s" $xrName>>
    description: <<printf "GitOps deployment repo for %s - <cluster>/<env>/values.yaml per environment" $xrName | toJson>>
    visibility: <<$visibility>>
    autoInit: true
    # See src-repo.yaml's own header for why this is explicit, not omitted -
    # terraform-provider-github's schema default ("enabled") isn't actually
    # PATCHable on this account's private repos (422, no GHAS entitlement),
    # unlike an explicit "disabled".
    securityAndAnalysis:
      - secretScanning:
          - status: disabled
        secretScanningPushProtection:
          - status: disabled
---
<<- if not (has "gitops-repo-readme" $scaffoldDone) >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-gitops-readme
  annotations:
    <<setResourceNameAnnotation "gitops-repo-readme">>
spec:
  # No "Update" - same fix, same reasoning as src-repo.yaml's own scaffold files
  # and applicationenvironment's values-yaml.yaml (which had the actual live bug,
  # 2026-08-18) - a scaffolded README a developer might reasonably edit shouldn't
  # get drift-corrected back to this static template.
  # No "Delete": this file is real developer/pipeline config after scaffolding (cicd.yaml) or a
  # human-edited README; deleting the XR must never delete it from GitHub. A Tier 2 prune once
  # destroyed cicd.yaml in 5 app repos through this policy.
  managementPolicies: ["Create", "Observe", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<printf "gitops-%s" $xrName>>
    file: README.md
    overwriteOnCreate: true
    content: |
      # gitops-<<$xrName>>

      GitOps deployment repo for `<<$xrName>>`, scaffolded by `NodeJSApplication`
      (Airframe). Empty until this app's first `ApplicationEnvironment`
      resource is created - each environment gets its own `<cluster>/<env>/values.yaml`
      here, rendered by `airframe-application` (Airframe's shared Helm chart).
    commitMessage: "NodeJSApplication scaffold: README.md"

<<- end >>