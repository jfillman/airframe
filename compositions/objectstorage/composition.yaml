#
# ObjectStorage: private object storage (an S3 bucket or an Azure Storage Account blob container) with Lambda consumers - see xrds/objectstorage.yaml's header. Both clouds in one Composition, branched on spec.cloud
# (one Composition per kind keeps the choice deterministic, review C13). Two function-go-templating
# steps around function-auto-ready, the same shape as the cloud-target Compositions.
#
# Delimiters: << >> instead of Go's default {{ }}, matching every other Composition in this catalog.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: objectstorages.catalog.hangar.io
spec:
  compositeTypeRef:
    apiVersion: catalog.hangar.io/v1alpha1
    kind: ObjectStorage
  mode: Pipeline
