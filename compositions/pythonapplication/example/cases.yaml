# Render cases for tools/test_compositions.py: each renders example/<xr> with the listed required
# (extra) and observed fixtures and is compared with example/expected/<name>.yaml; `expect` adds
# readable assertions. Regenerate expectations with `tools/test_compositions.py --update <composition>`.
cases:
- name: gate-fail
  xr: xr-defaults.yaml
- name: defaults
  xr: xr-defaults.yaml
  required: &id001
  - cluster-registry-dev-ready.yaml
- name: poetry-custom
  xr: xr-poetry-custom.yaml
  required: &id003
  - cluster-registry-dev-ready.yaml
- name: scaffold-ready
  xr: xr-defaults.yaml
  required: *id001
  observed:
  - observed-scaffold-ready.yaml
  expect:
    present: &id002
    - gitops-repo-readme
    - src-repo-cicd-yaml
    - src-repo-dependency-file
    - src-repo-dockerfile
    - src-repo-gitignore
    - src-repo-main-py
    - src-repo-readme
    - src-repo-version-file
    status:
      scaffold:
        done: *id002
- name: scaffold-retired
  xr: xr-defaults-scaffolded.yaml
  required: *id001
  expect:
    absent: *id002
    status:
      scaffold:
        done: *id002
- name: scaffold-retired-poetry
  xr: xr-poetry-custom-scaffolded.yaml
  required: *id003
  expect:
    absent: &id004
    - gitops-repo-readme
    - src-repo-cicd-yaml
    - src-repo-dependency-file
    - src-repo-dockerfile
    - src-repo-gitignore
    - src-repo-main-py
    - src-repo-readme
    status:
      scaffold:
        done: *id004
