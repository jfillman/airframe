# xr-poetry-custom.yaml plus the scaffold ledger as it stands once every scaffold file of the poetry-custom
# render has been seen Ready and recorded (status.scaffold.done). The render for this XR must compose
# NONE of those files (scaffold once, reconcile never) and must carry the ledger forward unchanged.
apiVersion: catalog.hangar.io/v1alpha1
kind: PythonApplication
metadata:
  name: widget-service
  namespace: demo-apps
spec:
  devCluster: kind-dev
  pythonVersion: '3.13'
  packageManager: poetry
  port: 9090
  visibility: public
status:
  scaffold:
    done:
    - gitops-repo-readme
    - src-repo-cicd-yaml
    - src-repo-dependency-file
    - src-repo-dockerfile
    - src-repo-gitignore
    - src-repo-main-py
    - src-repo-readme
