# Commits a minimal, real cicd.yaml (build, then deploy to dev) into this app's own src repo -
# same fix, same reasoning, as nodejsapplication's own copy of this file (see
# its header for the full write-up of the onboarding gap this closes).
#
# build.agent maps directly onto spec.pythonVersion (3.11|3.12|3.13), same as
# nodejsapplication's nodeVersion mapping - safe as of 2026-09-21, when
# glidepath's own schemas/cicd.schema.json build.agent enum was widened to
# include python-3.12/python-3.13 (platform-cicd-toolbox rebuilt + tag-bumped
# to 2026-09-21-go-python-agents for this). Before that, this file pinned a
# fixed "python-3.11" regardless of the version actually picked, to avoid
# committing a cicd.yaml that would fail glidepath's own schema validation -
# see this file's git history if that workaround needs to be understood.
#
# 2026-10-03 (found end-to-end on sky-marshall): the starter used to stop at build, so a
# freshly onboarded app never reached "running healthy in dev" until a developer
# hand-added a deploy stage, and it declared no notifications. It now deploys to dev
# (Glidepath's onboarding scaffolds the matching platform/envs/dev.yaml) and turns the
# Backstage notification channel on. No upper environments: those need a real
# cluster/gitops decision, so adding one stays a deliberate step in Tower.
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $pythonVersion := .observed.composite.resource.spec.pythonVersion >>
<<- if not (has "src-repo-cicd-yaml" $scaffoldDone) >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-src-cicd-yaml
  annotations:
    <<setResourceNameAnnotation "src-repo-cicd-yaml">>
    crossplane.io/external-name: "<<dig "resource" "metadata" "annotations" "crossplane.io/external-name" (printf "%s:cicd.yaml:" $xrName) (index (.observed.resources | default dict) "src-repo-cicd-yaml" | default dict)>>"
spec:
  # No "Delete": this file is real developer/pipeline config after scaffolding (cicd.yaml) or a
  # human-edited README; deleting the XR must never delete it from GitHub. A Tier 2 prune once
  # destroyed cicd.yaml in 5 app repos through this policy.
  managementPolicies: ["Create", "Observe", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$xrName>>
    file: cicd.yaml
    overwriteOnCreate: true
    content: |
      apiVersion: platform/v1
      kind: PipelineConfig

      build:
        agent: <<printf "python-%s" $pythonVersion>>
        <<- if eq $deployTarget "aws-ecs" >>
        platforms: [<<$ecsPlatform>>]   # only the ECS task's architecture (spec.ecs.architecture)
        <<- end >>
        unitTest:
          enabled: false # no test script exists yet - add one, then flip this on

      pipelines:
        ci:
          trigger:
            source: git
            event: push
            branch: main
          steps:
            - stage: build
            - stage: deploy
              env: dev
      deploy:
        <<- if eq $deployTarget "aws-ecs" >>
        target: aws-ecs        # chosen at creation (spec.deployTarget); every environment deploys to ECS
        <<- end >>
        strategy: rollout
        environments:          # promotion order; ground = this cluster, flight = upper clusters (ADR-0019)
          - name: dev
            tier: ground
        <<- if eq $deployTarget "aws-ecs" >>
            ecs:               # the AwsEcsTarget <<$xrName>>-dev this app composes (its status.cicd)
              cluster: <<printf "%s-dev" $xrName>>
              service: <<printf "%s-dev" $xrName>>
              containerName: <<$xrName>>
              region: <<$ecsRegion>>
        <<- end >>

      notifications:
        backstage:
          enabled: true # build/deploy results show in Backstage and Tower
    commitMessage: "PythonApplication scaffold: cicd.yaml (build + deploy-to-dev starter)"

<<- end >>