# Src repo + Python boilerplate. Rendered by function-go-templating (source: Inline,
# see ../composition.yaml/../build-composition.sh), using double-angle-bracket
# delimiters - same convention as nodejsapplication's own src-repo.yaml.
#
# repo.github.m.upbound.io (namespaced managed resources), not the Cluster-scoped
# repo.github.upbound.io family. providerConfigRef.kind: ClusterProviderConfig is
# required, not defaulted.
#
# crossplane.io/external-name on the Repository below - same live-bug fix as
# nodejsapplication's own src-repo.yaml (a cluster rebuild's fresh Repository MR has
# no external-name, so provider-github tries to Create a repo that already exists on
# GitHub and 422s; setting external-name up front makes the MR import/adopt the
# existing repo instead).
#
# Every external-name value below is double-quoted (fixed 2026-09-04) - the unquoted
# "<repo>:<file>:" scalar's trailing bare colon is invalid plain-YAML. Real, fleet-wide
# live bug (every app on kiac-dev was Synced: False from this) - see
# springbootapplication's own copy of this file for the full writeup.
#
# managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"] (no "Update")
# on every RepositoryFile below - same reasoning as nodejsapplication's own scaffold
# files: this is real app source a developer is expected to edit immediately after
# scaffolding, and the provider's default "*" policy would drift-correct any such
# edit back to this static template on its next reconcile (a real bug hit live for
# checkout-api's package.json - never repeat it here).
#
# Zero external dependencies in the scaffold itself (stdlib http.server, no
# framework) - same minimalism NodeJSApplication's own boilerplate keeps (raw
# `http` module, no express) rather than picking a Python web framework on every
# app's behalf.
#
# crossplane.io/external-name on every RepositoryFile below, format "<repo>:<file>:" -
# same fix as nodejsapplication's own src-repo.yaml, and for the identical reason: a
# cluster rebuild wipes Crossplane's state but not GitHub's, so a stateless RepositoryFile
# MR defaults to Create, and overwriteOnCreate: true means Create silently overwrites
# real committed developer edits. Hadn't hit this composition live yet, but the checkout-api
# incident (nodejsapplication) that exposed it applies identically here - fixed
# preemptively rather than waiting for a PythonApplication rebuild to hit it too.
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $spec := .observed.composite.resource.spec >>
<<- $description := $spec.description | default (printf "%s - a Python application" $xrName) >>
<<- $pythonVersion := $spec.pythonVersion >>
<<- $packageManager := $spec.packageManager >>
<<- $port := $spec.port >>
<<- $visibility := $spec.visibility >>
<<- $installCmd := "pip install --no-cache-dir -r requirements.txt" >>
<<- if eq $packageManager "poetry" >>
  <<- $installCmd = "pip install --no-cache-dir poetry && poetry install --no-root --no-interaction" >>
<<- else if eq $packageManager "uv" >>
  <<- $installCmd = "pip install --no-cache-dir uv && uv sync --frozen --no-dev" >>
<<- end >>
# ---------------------------------------------------------------------------
# Scaffold files are CREATE-ONCE, then this Composition lets go of them.
# (Added 2026-09-23 after a real incident - read before changing anything here.)
#
# These RepositoryFile resources exist only to seed a brand-new app's repo. After the
# first commit the file belongs to the developer. They used to be reconciled forever
# with policies Create, Observe, LateInitialize, Delete and overwriteOnCreate true, which
# had two real failure modes:
#   1. A composition change to a field of an ALREADY-COMPOSED resource is a fleet-wide
#      write even without an Update policy. The 2026-09-22 Dockerfile-to-Containerfile
#      rename rewrote file: and external-name on every existing resource while the
#      provider's Terraform state (and the repo) still said Dockerfile. file: is a
#      force-replace field, so the provider could neither update nor settle, and
#      crossplane-runtime retried at its 60s backoff cap ignoring --poll: 7 resources,
#      roughly 16,000 GitHub calls/hour against a 5,000/hour budget shared with Backstage.
#   2. Create fires whenever the file is observed missing, so a developer who renamed or
#      deleted a scaffold file had it resurrected (happened to 4 repos), and with
#      overwriteOnCreate true a mis-observed 403 could overwrite real content.
#
# The lifecycle, driven by the OBSERVED live resource (scaffoldMode below):
#   create      not observed yet, or created but the provider has no id yet:
#               render with Create, Observe, LateInitialize. Never Delete.
#   transition  observed WITH an id but its live policies still include Delete or the
#               wildcard (every resource created before this change): render Observe
#               only, which strips Delete from the live object.
#   retire      observed with an id and no Delete left in its live policies: render
#               NOTHING. Crossplane garbage-collects the object; with no Delete policy
#               the file in GitHub is untouched. Gating on the LIVE policies (not just
#               on having an id) is what makes this safe - retiring an object that still
#               had Delete would delete real files across the fleet.
# Identity fields (file:, external-name) are pinned to the observed resource's own values
# while it exists (scaffoldFile / scaffoldExternalName), so a future change of the
# template default can never re-identify a live object.
# A cluster rebuild still adopts existing files: a fresh cluster has nothing observed, so
# it renders in create mode with external-name set, and Observe adopts the existing file.
# NOTE for editors: never write two adjacent angle-bracket characters in comments (see
# the NOTE at the top of this file) - this block deliberately avoids them.
# ---------------------------------------------------------------------------
<<- define "scaffoldMode" ->>
<<- $obs := .obs ->>
<<- $mode := "create" ->>
<<- if $obs ->>
<<-   if dig "resource" "status" "atProvider" "id" "" $obs ->>
<<-     $policies := dig "resource" "spec" "managementPolicies" (list) $obs ->>
<<-     if or (has "Delete" $policies) (has "*" $policies) ->>
<<-       $mode = "transition" ->>
<<-     else ->>
<<-       $mode = "retire" ->>
<<-     end ->>
<<-   end ->>
<<- end ->>
<<- $mode ->>
<<- end ->>
<<- define "scaffoldFile" ->>
<<- if .obs ->><<- dig "resource" "spec" "forProvider" "file" .default .obs ->><<- else ->><<- .default ->><<- end ->>
<<- end ->>
<<- define "scaffoldExternalName" ->>
<<- if .obs ->><<- dig "resource" "metadata" "annotations" "crossplane.io/external-name" .default .obs ->><<- else ->><<- .default ->><<- end ->>
<<- end >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: <<$xrName>>-src
  annotations:
    <<setResourceNameAnnotation "src-repo">>
    crossplane.io/external-name: <<$xrName>>
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    name: <<$xrName>>
    description: <<$description | toJson>>
    visibility: <<$visibility>>
    autoInit: true
    hasIssues: true
    deleteBranchOnMerge: true
    securityAndAnalysis:
      - secretScanning:
          - status: disabled
        secretScanningPushProtection:
          - status: disabled
---
<<- $obs1 := index (.observed.resources | default dict) "src-repo-dependency-file" >>
<<- $mode1 := include "scaffoldMode" (dict "obs" $obs1) >>
<<- if ne $mode1 "retire" >>
<<- if eq $packageManager "pip" >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-src-requirements-txt
  annotations:
    <<setResourceNameAnnotation "src-repo-dependency-file">>
    crossplane.io/external-name: "<<printf "%s:requirements.txt:" $xrName>>"
spec:
  managementPolicies: <<if eq $mode1 "transition">>["Observe"]<<else>>["Create", "Observe", "LateInitialize"]<<end>>
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$xrName>>
    file: requirements.txt
    overwriteOnCreate: false
    content: |
      # No dependencies yet - main.py is stdlib-only.
    commitMessage: "PythonApplication scaffold: requirements.txt"
<<- else >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-src-pyproject-toml
  annotations:
    <<setResourceNameAnnotation "src-repo-dependency-file">>
    crossplane.io/external-name: "<<printf "%s:pyproject.toml:" $xrName>>"
spec:
  managementPolicies: <<if eq $mode1 "transition">>["Observe"]<<else>>["Create", "Observe", "LateInitialize"]<<end>>
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$xrName>>
    file: pyproject.toml
    overwriteOnCreate: false
    content: |
      [project]
      name = <<$xrName | toJson>>
      version = "0.1.0"
      description = <<$description | toJson>>
      requires-python = <<printf ">=%s" $pythonVersion | toJson>>
      dependencies = []
    commitMessage: "PythonApplication scaffold: pyproject.toml"
<<- end >>
<<- end >>
---
<<- $obs2 := index (.observed.resources | default dict) "src-repo-main-py" >>
<<- $mode2 := include "scaffoldMode" (dict "obs" $obs2) >>
<<- if ne $mode2 "retire" >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-src-main-py
  annotations:
    <<setResourceNameAnnotation "src-repo-main-py">>
    crossplane.io/external-name: "<<printf "%s:main.py:" $xrName>>"
spec:
  managementPolicies: <<if eq $mode2 "transition">>["Observe"]<<else>>["Create", "Observe", "LateInitialize"]<<end>>
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$xrName>>
    file: main.py
    overwriteOnCreate: false
    content: |
      import json
      import os
      from http.server import BaseHTTPRequestHandler, HTTPServer

      PORT = int(os.environ.get("PORT", <<$port>>))


      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == "/healthz":
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(json.dumps({"status": "ok"}).encode())
                  return
              self.send_response(200)
              self.send_header("Content-Type", "text/plain")
              self.end_headers()
              self.wfile.write(<<printf "Hello from %s\n" $xrName | toJson>>.encode())


      if __name__ == "__main__":
          server = HTTPServer(("0.0.0.0", PORT), Handler)
          print(<<printf "%s listening on port {}" $xrName | toJson>>.format(PORT))
          server.serve_forever()
    commitMessage: "PythonApplication scaffold: main.py"
<<- end >>
---
<<- $obs3 := index (.observed.resources | default dict) "src-repo-dockerfile" >>
<<- $mode3 := include "scaffoldMode" (dict "obs" $obs3) >>
<<- if ne $mode3 "retire" >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  # metadata.name stays -src-dockerfile (not -src-containerfile): it is Crossplane's
  # correlation key for an EXISTING XR's already-composed resource. file: and the
  # external-name annotation are pinned to the observed resource's own values while
  # it exists (scaffoldFile / scaffoldExternalName at the top of this file), so the
  # default below only ever applies to a resource that does not exist yet. See the
  # header comment for the incident that made this necessary.
  name: <<$xrName>>-src-dockerfile
  annotations:
    <<setResourceNameAnnotation "src-repo-dockerfile">>
    crossplane.io/external-name: "<<include "scaffoldExternalName" (dict "obs" $obs3 "default" (printf "%s:Containerfile:" $xrName))>>"
  # `apt-get upgrade` picks up already-published Debian package patches, same
  # patch-freshness reasoning as nodejsapplication's/springbootapplication's own
  # Containerfiles. python:<version>-slim, not -alpine - avoids musl/manylinux wheel
  # compatibility issues alpine's libc would otherwise risk for any future
  # dependency this app adds.
spec:
  # Create-once, then retired (see the header comment and scaffoldMode). No Update,
  # and no Delete: this object must never write to or remove a developer-owned file.
  managementPolicies: <<if eq $mode3 "transition">>["Observe"]<<else>>["Create", "Observe", "LateInitialize"]<<end>>
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$xrName>>
    file: <<include "scaffoldFile" (dict "obs" $obs3 "default" "Containerfile")>>
    overwriteOnCreate: false
    content: |
      FROM python:<<$pythonVersion>>-slim
      WORKDIR /app
      RUN apt-get update && apt-get upgrade -y && rm -rf /var/lib/apt/lists/*
      <<- if eq $packageManager "pip" >>
      COPY requirements.txt ./
      <<- else >>
      COPY pyproject.toml ./
      <<- end >>
      RUN <<$installCmd>>
      COPY . .
      EXPOSE <<$port>>
      CMD ["python", "main.py"]
    commitMessage: "PythonApplication scaffold: Containerfile"
<<- end >>
---
<<- $obs4 := index (.observed.resources | default dict) "src-repo-gitignore" >>
<<- $mode4 := include "scaffoldMode" (dict "obs" $obs4) >>
<<- if ne $mode4 "retire" >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-src-gitignore
  annotations:
    <<setResourceNameAnnotation "src-repo-gitignore">>
    crossplane.io/external-name: "<<printf "%s:.gitignore:" $xrName>>"
spec:
  managementPolicies: <<if eq $mode4 "transition">>["Observe"]<<else>>["Create", "Observe", "LateInitialize"]<<end>>
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$xrName>>
    file: .gitignore
    overwriteOnCreate: false
    content: |
      __pycache__/
      *.pyc
      .venv/
      .env
    commitMessage: "PythonApplication scaffold: .gitignore"
<<- end >>
---
<<- $obs5 := index (.observed.resources | default dict) "src-repo-readme" >>
<<- $mode5 := include "scaffoldMode" (dict "obs" $obs5) >>
<<- if ne $mode5 "retire" >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-src-readme
  annotations:
    <<setResourceNameAnnotation "src-repo-readme">>
    crossplane.io/external-name: "<<printf "%s:README.md:" $xrName>>"
spec:
  managementPolicies: <<if eq $mode5 "transition">>["Observe"]<<else>>["Create", "Observe", "LateInitialize"]<<end>>
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$xrName>>
    file: README.md
    overwriteOnCreate: false
    content: |
      # <<$xrName>>

      <<$description>>

      Scaffolded by `PythonApplication` (Airframe). Python <<$pythonVersion>>,
      <<$packageManager>>.

      ```
      <<$installCmd>>
      python main.py
      ```

      **CICD pipeline onboarding**: this app's `PythonApplication` resource carries a
      `CicdOnboarded` condition tracking whether `platform-cicd`'s tenant-onboarding
      ApplicationSet has picked up this app's committed tenant identity yet. See the
      resource's own status for details.
    commitMessage: "PythonApplication scaffold: README.md"
<<- end >>
