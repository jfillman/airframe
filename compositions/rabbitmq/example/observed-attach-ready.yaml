# User and Permission (messaging topology operator) report Ready; the connection ConfigMap exists
# (a built-in function-auto-ready kind).
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: flights-mq
  namespace: app-flights-dev
  annotations:
    crossplane.io/composition-resource-name: user
status:
  conditions:
    - type: Ready
      status: "True"
      reason: SuccessfulCreateOrUpdate
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: flights-mq
  namespace: app-flights-dev
  annotations:
    crossplane.io/composition-resource-name: permission
status:
  conditions:
    - type: Ready
      status: "True"
      reason: SuccessfulCreateOrUpdate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flights-mq-connection
  namespace: app-flights-dev
  annotations:
    crossplane.io/composition-resource-name: connection
