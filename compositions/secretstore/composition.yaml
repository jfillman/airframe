# GENERATED FILE - do not hand-edit the pipeline's `input.inline.template`
# block below. Edit templates/*.yaml instead, then run
# `tools/build-compositions secretstore` to regenerate it (CI runs --check).
#
# SecretStore: provider-infisical resources (project, environments, machine identity and its
# auth, project membership) and an External Secrets ClusterSecretStore that logs in with them.
# xrds/secretstore.yaml describes the two modes and who requests them.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: secretstores.catalog.hangar.io
spec:
  compositeTypeRef:
    apiVersion: catalog.hangar.io/v1alpha1
    kind: SecretStore
  mode: Pipeline
  pipeline:
    - step: render-secretstore-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # Reads this cluster's record from the cluster registry (the crossplane-system ConfigMap named
            # after spec.cluster) and sets, for every later template in this step:
            #   $isInfisicalHost  true on the cluster that runs Infisical (registry infisicalHost: "true").
            #                     It selects Kubernetes auth there and universal auth everywhere else. It is
            #                     its own registry field because a cluster's type doesn't say whether
            #                     Infisical runs on it.
            #   $infisicalUrl     the address this cluster reaches Infisical at (registry infisicalUrl)
            #   $infisicalOrgId   the Infisical organization (registry infisicalOrgId)
            # Both values come from the top-level infisical: block of the fleet's clusters.yaml, which
            # charts/cluster-registry renders into every record.
            #
            # Every templates/*.yaml file is concatenated into one template run, so variables set here
            # persist across the --- separators.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $allExtra := .extraResources | default dict >>
            <<- $entry := index $allExtra "cluster-registry-entry" | default dict >>
            <<- $items := index $entry "items" | default list >>
            <<- $isInfisicalHost := false >>
            <<- $registryInfisicalUrl := "" >>
            <<- $registryInfisicalOrgId := "" >>
            <<- if gt (len $items) 0 >>
              <<- $cm := (index $items 0).resource >>
              <<- $infisicalHost := index $cm.data "infisicalHost" | default "" >>
              <<- if eq $infisicalHost "true" >>
                <<- $isInfisicalHost = true >>
              <<- end >>
              <<- $registryInfisicalUrl = index $cm.data "infisicalUrl" | default "" >>
              <<- $registryInfisicalOrgId = index $cm.data "infisicalOrgId" | default "" >>
            <<- end >>
            <<- /* A record without infisicalUrl and infisicalOrgId fails the render. A fatal result leaves every composed
                   object as it is and names the cause in Synced=False (knownFailures InfisicalRegistryKeysMissing in
                   xrds/secretstore.meta.yaml). */>>
            <<- /* Only once Crossplane has answered the lookup: the first pass of every reconcile runs before it has, and only
                   the final pass's output is applied, so failing there would fail every reconcile. */>>
            <<- if and (hasKey $allExtra "cluster-registry-entry") (not (and $registryInfisicalUrl $registryInfisicalOrgId)) >>
              <<- fail (printf "cluster registry record %q has no infisicalUrl/infisicalOrgId: add the infisical: block to the hub's clusters.yaml and sync this cluster's cluster-registry Application" $spec.cluster) >>
            <<- end >>
            <<- $infisicalUrl := $registryInfisicalUrl >>
            <<- $infisicalOrgId := $registryInfisicalOrgId >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              cluster-registry-entry:
                apiVersion: v1
                kind: ConfigMap
                namespace: crossplane-system
                matchName: <<$spec.cluster>>
            ---
            ---
            # Kubernetes-auth input: the cluster CA, from the kube-root-ca.crt ConfigMap every namespace
            # has (public material). The token-reviewer JWT is never read here: a provider-kubernetes Object
            # copies it server-side (infisicalproject.yaml, infisical-token-reviewer-secret), so no
            # credential passes through the function pipeline. A missing ConfigMap renders an empty CA,
            # which the provider rejects loudly.
            <<- $caExtra := .extraResources | default dict >>
            <<- $caEntry := index $caExtra "kube-root-ca" | default dict >>
            <<- $caItems := index $caEntry "items" | default list >>
            <<- $k8sCaCert := "" >>
            <<- if gt (len $caItems) 0 >>
              <<- $caCm := (index $caItems 0).resource >>
              <<- $k8sCaCert = index (index $caCm "data" | default dict) "ca.crt" | default "" >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              kube-root-ca:
                apiVersion: v1
                kind: ConfigMap
                namespace: <<.observed.composite.resource.metadata.namespace>>
                matchName: kube-root-ca.crt
            ---
            ---
            # Adoption ids for this (app, cluster) pair's Infisical project, from the optional ConfigMap
            # crossplane-system/secretstore-provisioner, keyed by project slug (<appRef.name>-<cluster>).
            # A slug with no entry gets a new project, which is the normal case.
            #
            # An entry adopts objects that already exist in Infisical, so their secrets stay in place:
            #   projectId: <uuid>              # the project
            #   sharedEnvId: <uuid>            # its "shared" environment
            #   envIds: {staging: <uuid>}      # per-environment environments
            # The ids become crossplane.io/external-name on the composed resources, so the provider
            # observes the existing objects instead of creating new ones. They matter only on the first
            # reconcile. The provider's machine identity must already be an admin member of an adopted
            # project, or every read is a 403. A `provisioner` key in older entries is ignored.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $gateSlug := printf "%s-%s" $spec.appRef.name $spec.cluster >>
            <<- $provExtra := .extraResources | default dict >>
            <<- $provEntry := index $provExtra "provisioner-config" | default dict >>
            <<- $provItems := index $provEntry "items" | default list >>
            <<- $provCfg := dict >>
            <<- if gt (len $provItems) 0 >>
              <<- $provCm := (index $provItems 0).resource >>
              <<- $provData := index $provCm "data" | default dict >>
              <<- $provRaw := index $provData $gateSlug | default "" >>
              <<- if ne $provRaw "" >>
                <<- $provCfg = fromYaml $provRaw >>
              <<- end >>
            <<- end >>
            <<- $adoptProjectId := index $provCfg "projectId" | default "" >>
            <<- $adoptSharedEnvId := index $provCfg "sharedEnvId" | default "" >>
            <<- $adoptEnvIds := index $provCfg "envIds" | default dict >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              provisioner-config:
                apiVersion: v1
                kind: ConfigMap
                namespace: crossplane-system
                matchName: secretstore-provisioner
            ---
            ---
            # The shared-mode ClusterSecretStore (environmentSlug == "shared"), named after the project slug
            # and open to every app-<app>-* namespace on this cluster. per-env-secretstore.yaml renders the
            # narrowed per-environment sibling under a different name, so the two never collide.
            #
            # Wrapped in a provider-kubernetes Object (kubernetes.m.crossplane.io): Crossplane v2 won't let a
            # namespaced XR compose a cluster-scoped resource directly.
            #
            # hostAPI is the registry's infisicalUrl and the auth method follows $isInfisicalHost
            # (00-infisical-host-gate.yaml). Both auth methods read <slug>-infisical-creds in the XR's
            # namespace, written by infisicalproject.yaml:
            #   - Kubernetes auth reads identityId. serviceAccountTokenPath stays unset, so ESO presents its
            #     own controller's projected token and no credential is stored.
            #   - Universal auth reads clientId and clientSecret.
            # Until that Secret exists ESO reports the store not Ready, and it recovers on its own.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $appName := $spec.appRef.name >>
            <<- $envSlug := $spec.environmentSlug | default "shared" >>
            <<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
            <<- $credsSecretName := printf "%s-infisical-creds" $projectSlug >>
            <<- $hostAPI := $infisicalUrl >>
            <<- $authMethod := "universal" >>
            <<- if $isInfisicalHost >>
              <<- $authMethod = "kubernetes" >>
            <<- end >>
            <<- if eq $envSlug "shared" >>
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "cluster-secret-store">>
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ClusterSecretStore
                  metadata:
                    name: <<$projectSlug>>
                  spec:
                    conditions:
                      - namespaceRegexes:
                          # app-<app>-* for an app, infra-<app>-* for an InfraService (its CI and environment namespaces).
                          # Names are unique across both kinds (one tenants/<name>/ directory), so either prefix is this app's.
                          - <<printf "^(app|infra)-%s-.*$" $appName | toJson>>
                    provider:
                      infisical:
                        hostAPI: <<$hostAPI | toJson>>
                        auth:
                          <<- if eq $authMethod "kubernetes" >>
                          kubernetesAuthCredentials:
                            identityId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: identityId
                            # serviceAccountTokenPath unset: ESO presents its own controller token.
                          <<- else >>
                          universalAuthCredentials:
                            clientId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientId
                            clientSecret:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientSecret
                          <<- end >>
                        secretsScope:
                          projectSlug: <<$projectSlug>>
                          environmentSlug: shared
                          secretsPath: "/"
              managementPolicies: ["*"]
            <<- end >>
            ---
            ---
            # The shared-mode Infisical resources (environmentSlug == "shared"), all through provider-infisical:
            #   Project, ProjectEnvironment "shared"    the project <appRef.name>-<cluster>, never deleted
            #   Identity                                org role no-access
            #   IdentityKubernetesAuth                  on the cluster that runs Infisical, or
            #   IdentityUniversalAuth + ClientSecret    on every other cluster
            #   ProjectIdentity                         role viewer on this project only
            #   <slug>-infisical-creds Secret           what the ClusterSecretStores log in with
            # A per-env XR creates none of these; it finds this project by the same computed slug.
            #
            # The slug is computed from spec fields, never from the XR's name, so both modes agree on it.
            #
            # No credential passes through the function pipeline. provider-kubernetes Objects copy the
            # token-reviewer JWT and the universal-auth client secret server-side (references[].patchesFrom);
            # only ids, which are not secret, are rendered here.
            #
            # Never write the two delimiter characters next to each other anywhere in this file, comments
            # included: the template lexer scans raw text, and an accidental empty action fails the render.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $appName := $spec.appRef.name >>
            <<- $envSlug := $spec.environmentSlug | default "shared" >>
            <<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
            <<- $authMethod := "universal" >>
            <<- if $isInfisicalHost >>
              <<- $authMethod = "kubernetes" >>
            <<- end >>
            # $infisicalOrgId comes from the cluster registry (00-infisical-host-gate.yaml).
            <<- if eq $envSlug "shared" >>
            apiVersion: project.infisical.m.hangar.io/v1alpha1
            kind: Project
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-project">>
                <<- if $adoptProjectId >>
                crossplane.io/external-name: <<$adoptProjectId | toJson>>
                <<- end >>
            spec:
              # No Delete: removing this XR, or ArgoCD pruning the file that declares it, must never
              # delete the project or the secrets in it. Identities and client secrets keep Delete, so
              # credentials are still revoked. A decommissioned app's project keeps its slug: adopt it
              # (02-provisioner-gate.yaml) or delete it in Infisical by hand.
              managementPolicies: ["Create", "Observe", "Update", "LateInitialize"]
              forProvider:
                name: <<$projectSlug>>
                slug: <<$projectSlug>>
                shouldCreateDefaultEnvs: false
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
            apiVersion: project.infisical.m.hangar.io/v1alpha1
            kind: ProjectEnvironment
            metadata:
              name: <<printf "%s-shared" $projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-project-shared-env">>
                <<- if $adoptSharedEnvId >>
                crossplane.io/external-name: <<$adoptSharedEnvId | toJson>>
                <<- end >>
            spec:
              # No Delete: removing this XR, or ArgoCD pruning the file that declares it, must never
              # delete the project or the secrets in it. Identities and client secrets keep Delete, so
              # credentials are still revoked. A decommissioned app's project keeps its slug: adopt it
              # (02-provisioner-gate.yaml) or delete it in Infisical by hand.
              managementPolicies: ["Create", "Observe", "Update", "LateInitialize"]
              forProvider:
                name: shared
                slug: shared
                projectIdRef:
                  name: <<$projectSlug>>
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
            apiVersion: identity.infisical.m.hangar.io/v1alpha1
            kind: Identity
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity">>
            spec:
              forProvider:
                name: <<$projectSlug>>
                orgId: <<$infisicalOrgId | toJson>>
                role: no-access
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
              <<- if eq $authMethod "kubernetes" >>
            apiVersion: identity.infisical.m.hangar.io/v1alpha1
            kind: IdentityKubernetesAuth
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity-k8s-auth">>
            spec:
              forProvider:
                identityIdRef:
                  name: <<$projectSlug>>
                kubernetesHost: "https://kubernetes.default.svc.cluster.local"
                kubernetesCaCertificate: <<$k8sCaCert | toJson>>
                # The reviewer JWT is read from a Secret in this namespace (the Object below copies it from
                # infisical/infisical-token-reviewer-token server-side); it never appears in this spec.
                tokenReviewerJwtSecretRef:
                  name: <<printf "%s-token-reviewer" $projectSlug>>
                  key: token
                tokenReviewerMode: api
                # Only External Secrets' own controller ServiceAccount may log in with this identity.
                allowedNamespaces:
                  - external-secrets
                allowedServiceAccountNames:
                  - external-secrets
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<printf "%s-token-reviewer" $projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-token-reviewer-secret">>
            spec:
              # provider-kubernetes copies the token at apply time, server-side, from the host cluster's
              # token-reviewer Secret into this namespace: the value is never in this manifest, this XR or any
              # function payload. The placeholder key below is what patchesFrom overwrites.
              references:
                - patchesFrom:
                    apiVersion: v1
                    kind: Secret
                    name: infisical-token-reviewer-token
                    namespace: infisical
                    fieldPath: data.token
                  toFieldPath: data.token
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: <<printf "%s-token-reviewer" $projectSlug>>
                    namespace: <<$xrNamespace>>
                  type: Opaque
                  data:
                    token: ""
              managementPolicies: ["*"]
            ---
              <<- else >>
            apiVersion: identity.infisical.m.hangar.io/v1alpha1
            kind: IdentityUniversalAuth
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity-ua">>
            spec:
              forProvider:
                identityIdRef:
                  name: <<$projectSlug>>
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
            apiVersion: identity.infisical.m.hangar.io/v1alpha1
            kind: IdentityUniversalAuthClientSecret
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity-ua-client-secret">>
            spec:
              forProvider:
                identityIdRef:
                  name: <<$projectSlug>>
                description: <<printf "%s (managed by the SecretStore Composition)" $projectSlug | toJson>>
              # Written into this XR's namespace. provider-kubernetes copies attribute.client_secret out of it
              # into <slug>-infisical-creds (the Object below); nothing in this pipeline reads it. The client
              # id is not secret and comes from status.atProvider.clientId.
              writeConnectionSecretToRef:
                name: <<printf "%s-ua-conn" $projectSlug>>
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
              <<- end >>
            apiVersion: project.infisical.m.hangar.io/v1alpha1
            kind: ProjectIdentity
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-project-identity">>
            spec:
              forProvider:
                adoptExisting: true
                projectIdRef:
                  name: <<$projectSlug>>
                identityIdRef:
                  name: <<$projectSlug>>
                roles:
                  # viewer on this project. The identity's org role is no-access (above); no-access here
                  # too would let ESO log in but read nothing (a 403 on every secret).
                  - roleSlug: viewer
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
                <<- if eq $authMethod "kubernetes" >>
                <<- $identityId := "" >>
                <<- if .observed.resources >>
                  <<- $obsIdentity := index .observed.resources "infisical-identity" >>
                  <<- if $obsIdentity >>
                    <<- if $obsIdentity.resource >>
                      <<- if $obsIdentity.resource.metadata >>
                        <<- if $obsIdentity.resource.metadata.annotations >>
                          <<- $identityId = index $obsIdentity.resource.metadata.annotations "crossplane.io/external-name" | default "" >>
                        <<- end >>
                      <<- end >>
                    <<- end >>
                  <<- end >>
                <<- end >>
                <<- if ne $identityId "" >>
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<printf "%s-identity-secret" $projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity-secret">>
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: <<printf "%s-infisical-creds" $projectSlug>>
                    namespace: <<$xrNamespace>>
                  # data (base64), never stringData: the API server never stores stringData, so
                  # provider-kubernetes' Observe finds nothing at the path it owns and fails.
                  data:
                    identityId: <<$identityId | b64enc>>
              managementPolicies: ["*"]
            ---
                <<- end >>
                <<- else >>
                <<- $uaClientId := "" >>
                <<- if .observed.resources >>
                  <<- $obsCs := index .observed.resources "infisical-identity-ua-client-secret" >>
                  <<- if $obsCs >>
                    <<- if $obsCs.resource >>
                      <<- if $obsCs.resource.status >>
                        <<- if $obsCs.resource.status.atProvider >>
                          <<- $uaClientId = index $obsCs.resource.status.atProvider "clientId" | default "" >>
                        <<- end >>
                      <<- end >>
                    <<- end >>
                  <<- end >>
                <<- end >>
                <<- if ne $uaClientId "" >>
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<printf "%s-identity-secret" $projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity-secret">>
            spec:
              # provider-kubernetes copies the client secret server-side from the
              # IdentityUniversalAuthClientSecret's connection Secret (<slug>-ua-conn, key
              # attribute.client_secret) at apply time: it is never in this manifest, this XR or any function
              # payload. Until the connection Secret exists the apply fails and retries; the placeholder key
              # is what patchesFrom overwrites.
              references:
                - patchesFrom:
                    apiVersion: v1
                    kind: Secret
                    name: <<printf "%s-ua-conn" $projectSlug>>
                    namespace: <<$xrNamespace>>
                    fieldPath: data[attribute.client_secret]
                  toFieldPath: data.clientSecret
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: <<printf "%s-infisical-creds" $projectSlug>>
                    namespace: <<$xrNamespace>>
                  type: Opaque
                  # data (base64), never stringData - see the kubernetes branch above.
                  data:
                    clientId: <<$uaClientId | b64enc>>
                    clientSecret: ""
              managementPolicies: ["*"]
            ---
                <<- end >>
                <<- end >>

            <<- end >>
            ---
            # Per-environment mode (environmentSlug != "shared"): adds the environment <environmentSlug> to
            # the project its shared sibling XR created (same computed slug, no lookup), and a
            # ClusterSecretStore limited to exactly the namespace app-<app>-<environmentSlug>.
            #
            # Creates no project and no identity. The store logs in with the shared XR's
            # <slug>-infisical-creds Secret, which is in the same namespace because ApplicationEnvironment
            # requests both XRs through the same xr-requests folder. If the project doesn't exist yet, the
            # ProjectEnvironment waits for it.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $appName := $spec.appRef.name >>
            <<- $envSlug := $spec.environmentSlug | default "shared" >>
            <<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
            <<- $credsSecretName := printf "%s-infisical-creds" $projectSlug >>
            <<- $hostAPI := $infisicalUrl >>
            <<- $authMethod := "universal" >>
            <<- if $isInfisicalHost >>
              <<- $authMethod = "kubernetes" >>
            <<- end >>
            <<- if ne $envSlug "shared" >>
            apiVersion: project.infisical.m.hangar.io/v1alpha1
            kind: ProjectEnvironment
            metadata:
              name: <<$xrName>>
              annotations:
                <<setResourceNameAnnotation "infisical-environment">>
                <<- $adoptThisEnvId := index $adoptEnvIds $envSlug | default "" >>
                <<- if $adoptThisEnvId >>
                crossplane.io/external-name: <<$adoptThisEnvId | toJson>>
                <<- end >>
            spec:
              # No Delete: removing this XR, or ArgoCD pruning the file that declares it, must never
              # delete the project or the secrets in it. Identities and client secrets keep Delete, so
              # credentials are still revoked. A decommissioned app's project keeps its slug: adopt it
              # (02-provisioner-gate.yaml) or delete it in Infisical by hand.
              managementPolicies: ["Create", "Observe", "Update", "LateInitialize"]
              forProvider:
                name: <<$envSlug>>
                slug: <<$envSlug>>
                projectIdRef:
                  name: <<$projectSlug>>
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<$xrName>>
              annotations:
                <<setResourceNameAnnotation "per-env-cluster-secret-store">>
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ClusterSecretStore
                  metadata:
                    name: <<$xrName>>
                  spec:
                    conditions:
                      # Exactly one namespace: an ExternalSecret anywhere else can't use this store,
                      # whatever its remoteRef says.
                      - namespaceRegexes:
                          - <<printf "^(app|infra)-%s-%s$" $appName $envSlug | toJson>>
                    provider:
                      infisical:
                        hostAPI: <<$hostAPI | toJson>>
                        auth:
                          <<- if eq $authMethod "kubernetes" >>
                          kubernetesAuthCredentials:
                            identityId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: identityId
                          <<- else >>
                          universalAuthCredentials:
                            clientId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientId
                            clientSecret:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientSecret
                          <<- end >>
                        secretsScope:
                          projectSlug: <<$projectSlug>>
                          environmentSlug: <<$envSlug>>
                          secretsPath: "/"
              managementPolicies: ["*"]
            <<- end >>
            ---
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
