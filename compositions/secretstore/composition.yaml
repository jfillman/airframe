            # Missing ConfigMap (a namespace without kube-root-ca.crt does not exist on a supported cluster)
            # renders an empty CA, which the provider rejects loudly rather than silently trusting nothing.
            <<- $caExtra := .extraResources | default dict >>
            <<- $caEntry := index $caExtra "kube-root-ca" | default dict >>
            <<- $caItems := index $caEntry "items" | default list >>
            <<- $k8sCaCert := "" >>
            <<- if gt (len $caItems) 0 >>
              <<- $caCm := (index $caItems 0).resource >>
              <<- $k8sCaCert = index (index $caCm "data" | default dict) "ca.crt" | default "" >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              kube-root-ca:
                apiVersion: v1
                kind: ConfigMap
                namespace: <<.observed.composite.resource.metadata.namespace>>
                matchName: kube-root-ca.crt
            ---
            ---
            # Adoption ids for THIS (app, cluster) pair's Infisical project, read from an optional
            # ConfigMap, crossplane-system/secretstore-provisioner, keyed by project slug
            # (<appRef.name>-<cluster>).
            #
            # History: until 2026-09-23 this also chose between the provider-infisical chain and the
            # old infisical-secretstore-operator's InfisicalProject CR ("provisioner: provider" opted an
            # app in; the default was the operator). Every project on every cluster is now
            # provider-managed and the operator is retired, so the provider is the only path and the
            # `provisioner` key is ignored - old entries may still carry it.
            #
            # What the ConfigMap is still for: ADOPTING a project that already exists in Infisical,
            # so its secrets stay in place instead of a fresh project being created. A slug with no
            # entry simply gets a NEW project (the normal path for a newly onboarded app).
            #
            # Entry format (YAML text under the slug key):
            #   projectId: <uuid>              # adopt this existing Infisical project
            #   sharedEnvId: <uuid>            # adopt its existing "shared" environment
            #   envIds: {staging: <uuid>}      # adopt existing per-env environments
            # The ids set crossplane.io/external-name on the composed resource so the provider
            # observes the existing object instead of creating a colliding one. They only matter on
            # the first reconcile; the provider maintains the annotation itself afterwards. The
            # provider's machine identity must already be a member (admin) of an adopted project, or
            # every read is a 403.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $gateSlug := printf "%s-%s" $spec.appRef.name $spec.cluster >>
            <<- $provExtra := .extraResources | default dict >>
            <<- $provEntry := index $provExtra "provisioner-config" | default dict >>
            <<- $provItems := index $provEntry "items" | default list >>
            <<- $provCfg := dict >>
            <<- if gt (len $provItems) 0 >>
              <<- $provCm := (index $provItems 0).resource >>
              <<- $provData := index $provCm "data" | default dict >>
              <<- $provRaw := index $provData $gateSlug | default "" >>
              <<- if ne $provRaw "" >>
                <<- $provCfg = fromYaml $provRaw >>
              <<- end >>
            <<- end >>
            <<- $adoptProjectId := index $provCfg "projectId" | default "" >>
            <<- $adoptSharedEnvId := index $provCfg "sharedEnvId" | default "" >>
            <<- $adoptEnvIds := index $provCfg "envIds" | default dict >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              provisioner-config:
                apiVersion: v1
                kind: ConfigMap
                namespace: crossplane-system
                matchName: secretstore-provisioner
            ---
            # The client secret the provider publishes for the universal-auth chain. Read here
            # (rather than from the managed resource's connection details) so it is available to the
            # credentials Secret this Composition assembles - see infisicalproject.yaml. Declared
            # unconditionally; on every other branch it simply matches nothing.
            ---
            # Rendered by function-go-templating (source: Inline, see composition.yaml/
            # build-composition.sh).
            #
            # Wrapped in an objects.kubernetes.m.crossplane.io Object (provider-kubernetes),
            # NOT composed as a first-class ClusterSecretStore directly - confirmed live:
            # Crossplane v2 rejects composing a cluster-scoped native resource from a
            # namespaced XR ("cannot apply cluster scoped composed resource... for a namespaced
            # composite resource"), the exact same restriction NodeJSApplication's own
            # provider-github already hit for Cluster-scoped repo resources - same fix, the
            # namespaced managed-resource family (kubernetes.m.crossplane.io, not
            # kubernetes.crossplane.io), wrapping the actual manifest inside
            # spec.forProvider.manifest instead. See 10-crds-operators/crossplane/
            # provider-kubernetes-config.yaml for the ClusterProviderConfig + RBAC this needed
            # (neither existed before this Composition needed them).
            #
            # spec.provider.infisical schema (inside the wrapped manifest) confirmed against
            # ESO's real upstream Go source (apis/externalsecrets/v1/secretsstore_infisical_types.go),
            # not the vendored CRD's own docs comments - auth.kubernetesAuthCredentials.identityId
            # is a SecretKeySelector (same shape as universalAuthCredentials was), and the
            # optional serviceAccountTokenPath field is deliberately left unset below: confirmed
            # against providers/v1/infisical/provider.go that an unset value makes ESO's
            # controller present ITS OWN in-pod projected SA token to Infisical's login, not
            # read anything from a Secret - the actual zero-persisted-credential mechanism, not
            # just a marketing claim.
            #
            # hostAPI points at this cluster's own in-cluster Infisical Service - the default
            # (https://app.infisical.com/api) is Infisical's SaaS, wrong for a self-hosted
            # on-prem instance. identityId references the credentials Secret InfisicalProject's
            # operator writes (same namespace as this XR, hence this app's own namespace - see
            # infisicalproject.yaml's credentialsSecretName) - that Secret doesn't exist yet on
            # this store's very first reconcile (the operator writes it asynchronously, seconds
            # after the InfisicalProject CR appears) - not a problem, same eventual-consistency
            # shape as any other not-yet-ready secretKeyRef; ESO's own controller reports
            # Ready:False until it resolves, then self-heals, no ordering/wait logic needed in
            # this Composition. Unlike the old universalAuthCredentials.clientSecret, what's in
            # that Secret (identityId) isn't itself sensitive - see infisicalproject.yaml's own
            # credentialsSecretName description for why.
            #
            # spec.conditions.namespaceRegexes restricts this store to exactly this app's own
            # namespaces on this cluster (item 8's resolved scope: "cluster-scoped" doesn't mean
            # "visible to every app") - app-<appName>-<env>, this catalog's live-confirmed
            # namespace convention (kind-dev: app-checkout-api-dev, app-widget-api-dev; kind-prod:
            # app-checkout-api-prod - checked directly via `kubectl get ns`, not assumed).
            #
            # ONLY rendered in "shared" mode (environmentSlug == "shared") - the wide-open store
            # covering every env namespace for this (app, cluster) pair. See
            # per-env-secretstore.yaml for the narrowed, per-env sibling.
            #
            # $projectSlug computed from spec fields, not this XR's own name - see
            # infisicalproject.yaml's header for why. This store's own object NAME is also
            # $projectSlug (not $xrName) - deliberate: a per-env XR (per-env-secretstore.yaml)
            # computes and creates ITS OWN differently-named ClusterSecretStore, and the two
            # must never collide.
            #
            # hostAPI/authMethod both branch on $isInfisicalHost (00-infisical-host-gate.yaml,
            # same pipeline step - see that file's own header for why this is a live cluster-
            # registry lookup now, not the plain string comparison this used to be). The
            # hostAPI is the registry's infisicalUrl for this cluster (review C9): the in-cluster Service DNS on the
            # cluster that hosts Infisical, the address other clusters reach it at everywhere else - both stated once
            # in clusters.yaml's top-level infisical: block. See 00-infisical-host-gate.yaml.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $appName := $spec.appRef.name >>
            <<- $envSlug := $spec.environmentSlug | default "shared" >>
            <<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
            <<- $credsSecretName := printf "%s-infisical-creds" $projectSlug >>
            <<- $hostAPI := $infisicalUrl >>
            <<- $authMethod := "universal" >>
            <<- if $isInfisicalHost >>
              <<- $authMethod = "kubernetes" >>
            <<- end >>
            <<- if eq $envSlug "shared" >>
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "cluster-secret-store">>
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ClusterSecretStore
                  metadata:
                    name: <<$projectSlug>>
                  spec:
                    conditions:
                      - namespaceRegexes:
                          - <<printf "^app-%s-.*$" $appName | toJson>>
                    provider:
                      infisical:
                        hostAPI: <<$hostAPI | toJson>>
                        auth:
                          <<- if eq $authMethod "kubernetes" >>
                          kubernetesAuthCredentials:
                            identityId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: identityId
                            # serviceAccountTokenPath deliberately omitted - see this file's
                            # header. ESO presents its own controller SA token, not a stored one.
                          <<- else >>
                          universalAuthCredentials:
                            clientId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientId
                            clientSecret:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientSecret
                          <<- end >>
                        secretsScope:
                          projectSlug: <<$projectSlug>>
                          environmentSlug: shared
                          secretsPath: "/"
              managementPolicies: ["*"]
            <<- end >>
            ---
            ---
            # Rendered by function-go-templating (source: Inline, see composition.yaml/
            # build-composition.sh), double-angle-bracket delimiters (no PromQL/Sloth-syntax
            # collision reason here like the SLO Composition has, but kept consistent with this
            # catalog's one other Inline-mode Composition rather than introducing a second
            # delimiter convention for no reason).
            #
            # NOTE: never write two literal delimiter characters adjacent to each other
            # anywhere in this file outside a real action, including in comments - the lexer
            # scans raw text for the pair regardless of YAML comment syntax, and an accidental
            # empty action fails the whole render (hit this live building this exact file).
            #
            # ONLY rendered in "shared" mode (environmentSlug == "shared", the default) - a
            # non-"shared" XR references this project by its own computed $projectSlug (below)
            # but never creates one; see per-env-secretstore.yaml for that mode.
            #
            # $projectSlug is computed from spec fields (appRef.name + cluster), NOT from this
            # XR's own metadata.name - a deliberate change from this XRD's first pass (which
            # used $xrName directly, back when only one XR ever existed per (app,cluster)). Both
            # modes now need the SAME formula so a per-env XR (a DIFFERENT k8s object, DIFFERENT
            # name) can compute the identical project slug its "shared" sibling already created,
            # with no ExtraResources lookup needed either way.
            #
            # authMethod: an ExtraResources cluster-registry lookup (00-infisical-host-gate.yaml,
            # same pipeline step) against the registry's own `infisicalHost` field - see that
            # file's own header for the full multi-cluster reasoning.
            #
            # 2026-09-18 MIGRATION, kubernetes-auth branch only, NOT YET LIVE-CUT-OVER:
            # replaces the hand-rolled infisical-secretstore-operator's single InfisicalProject
            # CR (which atomically did project+shared-env+identity+auth-config+membership-grant+
            # credentials-write as one hand-written REST call chain) with the real
            # github.com/jfillman/provider-infisical resource chain - Project, ProjectEnvironment,
            # Identity, IdentityKubernetesAuth, ProjectIdentity, plus a synthetic identityId
            # Secret (wrapped in provider-kubernetes' Object, same reasoning
            # clustersecretstore.yaml's own header already documents - Crossplane v2 needs a
            # recognized managed-resource family to compose, a raw core/v1 Secret has no
            # controller of its own). ProjectIdentity's adoptExisting: true is the native,
            # upstream-supported fix for the old operator's own known non-idempotent
            # ensure_project_membership() bug - a live 400 on retry, see
            # project_kiac_dev_provider_github_bugs's sibling memory on this operator.
            #
            # The universal-auth branch (every cluster OTHER than the one hosting Infisical, e.g.
            # kind-prod) now has the same provider chain (adopting existing projects by id via
            # 02-provisioner-gate.yaml). Until 2026-09-23 it was opt-in and the default was the old
            # InfisicalProject CR; that operator branch is removed. It was blocked until
            # 2026-09-23 by IdentityUniversalAuthClientSecret failing its pre-Create Observe: upjet
            # seeds the Terraform state with an empty id, the Terraform provider's Read then called
            # the client-secret LIST endpoint (an array) instead of GET-by-id. Fixed in
            # provider-infisical v0.0.0-7 (a non-empty seeded id) - not an upstream SDK bug, which
            # is what this comment used to say. Chain: Project, ProjectEnvironment, Identity,
            # IdentityUniversalAuth, IdentityUniversalAuthClientSecret, ProjectIdentity, then the
            # same <slug>-infisical-creds Secret the operator writes (clientId + clientSecret), so
            # the ClusterSecretStores need no change. clientId comes from the client-secret
            # resource's status.atProvider.clientId; clientSecret is copied into that Secret by
            # provider-kubernetes itself (Object.spec.references[].patchesFrom from the <slug>-ua-conn
            # connection Secret), so since 2026-10-09 (review C2) it is never read by, rendered by or
            # carried through the function pipeline. The same pattern carries the kubernetes branch's
            # token-reviewer JWT (infisical-token-reviewer-secret).
            #
            # NOT YET WIRED INTO THE LIVE CLUSTER'S REAL SECRETSTORE XRS: this Composition
            # change, once merged to main, would immediately re-render EVERY existing
            # kubernetes-auth SecretStore XR under the new resource chain - Crossplane would
            # garbage-collect the old (real, already-provisioned) InfisicalProject objects for
            # every already-onboarded app on kiac-dev the moment this syncs, issuing new
            # credentials and orphaning the old Infisical projects. Verified in isolation first
            # (a throwaway (app,cluster) pair, applied directly, not through this XRD) before
            # any real per-app cutover - see the session notes for how that cutover should
            # actually happen (recreate credentials per app, re-point each ClusterSecretStore,
            # verify, clean up the old project - one app at a time, not a blanket Composition
            # flip). Kept on a feature branch, not main, until that per-app plan exists.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $appName := $spec.appRef.name >>
            <<- $envSlug := $spec.environmentSlug | default "shared" >>
            <<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
            <<- $authMethod := "universal" >>
            <<- if $isInfisicalHost >>
              <<- $authMethod = "kubernetes" >>
            <<- end >>
            # $infisicalOrgId comes from the cluster registry (infisicalOrgId, rendered from clusters.yaml's top-level
            # infisical: block; see 00-infisical-host-gate.yaml). Review C9 moved it out of this file, where it was a literal.
            <<- if eq $envSlug "shared" >>
            apiVersion: project.infisical.m.hangar.io/v1alpha1
            kind: Project
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-project">>
                <<- if $adoptProjectId >>
                crossplane.io/external-name: <<$adoptProjectId | toJson>>
                <<- end >>
            spec:
              # No Delete, deliberately: deleting this XR (or ArgoCD pruning the file that declares it)
              # must never delete the Infisical project/environment and the secrets in it. The
              # Kubernetes object goes, the Infisical object stays. Identities, their auth config and
              # client secrets keep Delete so credentials are still revoked. Consequence: a
              # decommissioned app's project is left behind and holds its slug - to reuse the slug,
              # adopt the leftover project through the secretstore-provisioner ConfigMap, or delete
              # it in Infisical by hand.
              managementPolicies: ["Create", "Observe", "Update", "LateInitialize"]
              forProvider:
                name: <<$projectSlug>>
                slug: <<$projectSlug>>
                shouldCreateDefaultEnvs: false
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
            apiVersion: project.infisical.m.hangar.io/v1alpha1
            kind: ProjectEnvironment
            metadata:
              name: <<printf "%s-shared" $projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-project-shared-env">>
                <<- if $adoptSharedEnvId >>
                crossplane.io/external-name: <<$adoptSharedEnvId | toJson>>
                <<- end >>
            spec:
              # No Delete, deliberately: deleting this XR (or ArgoCD pruning the file that declares it)
              # must never delete the Infisical project/environment and the secrets in it. The
              # Kubernetes object goes, the Infisical object stays. Identities, their auth config and
              # client secrets keep Delete so credentials are still revoked. Consequence: a
              # decommissioned app's project is left behind and holds its slug - to reuse the slug,
              # adopt the leftover project through the secretstore-provisioner ConfigMap, or delete
              # it in Infisical by hand.
              managementPolicies: ["Create", "Observe", "Update", "LateInitialize"]
              forProvider:
                name: shared
                slug: shared
                projectIdRef:
                  name: <<$projectSlug>>
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
            apiVersion: identity.infisical.m.hangar.io/v1alpha1
            kind: Identity
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity">>
            spec:
              forProvider:
                name: <<$projectSlug>>
                orgId: <<$infisicalOrgId | toJson>>
                role: no-access
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
              <<- if eq $authMethod "kubernetes" >>
            apiVersion: identity.infisical.m.hangar.io/v1alpha1
            kind: IdentityKubernetesAuth
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity-k8s-auth">>
            spec:
              forProvider:
                identityIdRef:
                  name: <<$projectSlug>>
                kubernetesHost: "https://kubernetes.default.svc.cluster.local"
                kubernetesCaCertificate: <<$k8sCaCert | toJson>>
                # The reviewer JWT is read from a Secret in this namespace (the Object below copies it from
                # infisical/infisical-token-reviewer-token server-side); it never appears in this spec.
                tokenReviewerJwtSecretRef:
                  name: <<printf "%s-token-reviewer" $projectSlug>>
                  key: token
                tokenReviewerMode: api
                # Scoped to ESO's own controller ServiceAccount only - it presents its own
                # in-pod projected token, matching clustersecretstore.yaml's own "zero
                # persisted credential" posture, same ESO_SERVICEACCOUNT_NAMESPACE/
                # ESO_SERVICEACCOUNT_NAME the current operator already restricts to.
                allowedNamespaces:
                  - external-secrets
                allowedServiceAccountNames:
                  - external-secrets
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<printf "%s-token-reviewer" $projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-token-reviewer-secret">>
            spec:
              # provider-kubernetes copies the token at apply time, server-side, from the host cluster's
              # token-reviewer Secret into this namespace: the value is never in this manifest, this XR or any
              # function payload. The placeholder key below is what patchesFrom overwrites.
              references:
                - patchesFrom:
                    apiVersion: v1
                    kind: Secret
                    name: infisical-token-reviewer-token
                    namespace: infisical
                    fieldPath: data.token
                  toFieldPath: data.token
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: <<printf "%s-token-reviewer" $projectSlug>>
                    namespace: <<$xrNamespace>>
                  type: Opaque
                  data:
                    token: ""
              managementPolicies: ["*"]
            ---
              <<- else >>
            apiVersion: identity.infisical.m.hangar.io/v1alpha1
            kind: IdentityUniversalAuth
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity-ua">>
            spec:
              forProvider:
                identityIdRef:
                  name: <<$projectSlug>>
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
            apiVersion: identity.infisical.m.hangar.io/v1alpha1
            kind: IdentityUniversalAuthClientSecret
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity-ua-client-secret">>
            spec:
              forProvider:
                identityIdRef:
                  name: <<$projectSlug>>
                description: <<printf "%s (managed by the SecretStore Composition)" $projectSlug | toJson>>
              # Same-namespace connection Secret (the namespaced MR writes into its own
              # namespace, which is this XR's). provider-kubernetes copies key attribute.client_secret
              # out of it into <slug>-infisical-creds (the Object below, patchesFrom); nothing in this
              # pipeline reads it. The client id is not sensitive and comes from status.atProvider.clientId.
              writeConnectionSecretToRef:
                name: <<printf "%s-ua-conn" $projectSlug>>
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
              <<- end >>
            apiVersion: project.infisical.m.hangar.io/v1alpha1
            kind: ProjectIdentity
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-project-identity">>
            spec:
              forProvider:
                adoptExisting: true
                projectIdRef:
                  name: <<$projectSlug>>
                identityIdRef:
                  name: <<$projectSlug>>
                roles:
                  # "viewer" here, not "no-access" - matches the current operator's own
                  # ensure_project_membership(role="viewer") exactly (confirmed against its
                  # source, main.py). "no-access" is correct at the ORG level for the Identity
                  # itself (above) but would leave ESO unable to read any secret through this
                  # store at all - hit live: ESO authenticated successfully via kubernetes
                  # auth, then got a real 403 "not allowed to describeSecret" back from
                  # Infisical with the project-level role wrongly set to no-access too.
                  - roleSlug: viewer
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
                <<- if eq $authMethod "kubernetes" >>
                <<- $identityId := "" >>
                <<- if .observed.resources >>
                  <<- $obsIdentity := index .observed.resources "infisical-identity" >>
                  <<- if $obsIdentity >>
                    <<- if $obsIdentity.resource >>
                      <<- if $obsIdentity.resource.metadata >>
                        <<- if $obsIdentity.resource.metadata.annotations >>
                          <<- $identityId = index $obsIdentity.resource.metadata.annotations "crossplane.io/external-name" | default "" >>
                        <<- end >>
                      <<- end >>
                    <<- end >>
                  <<- end >>
                <<- end >>
                <<- if ne $identityId "" >>
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<printf "%s-identity-secret" $projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity-secret">>
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: <<printf "%s-infisical-creds" $projectSlug>>
                    namespace: <<$xrNamespace>>
                  # data (base64), not stringData: the API server converts stringData to data
                  # server-side and never persists a stringData field, so provider-kubernetes'
                  # managedFields-based Observe (which extracts only the fields it owns) finds
                  # nothing at the stringData path and panics converting a nil into a map -
                  # confirmed live (ReconcileError: "unable to convert managed fields ...
                  # expected map, got <nil>") on every one of this migration's Object/Secret
                  # resources the moment they hit their first real Observe pass.
                  data:
                    identityId: <<$identityId | b64enc>>
              managementPolicies: ["*"]
            ---
                <<- end >>
                <<- else >>
                <<- $uaClientId := "" >>
                <<- if .observed.resources >>
                  <<- $obsCs := index .observed.resources "infisical-identity-ua-client-secret" >>
                  <<- if $obsCs >>
                    <<- if $obsCs.resource >>
                      <<- if $obsCs.resource.status >>
                        <<- if $obsCs.resource.status.atProvider >>
                          <<- $uaClientId = index $obsCs.resource.status.atProvider "clientId" | default "" >>
                        <<- end >>
                      <<- end >>
                    <<- end >>
                  <<- end >>
                <<- end >>
                <<- if ne $uaClientId "" >>
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<printf "%s-identity-secret" $projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-identity-secret">>
            spec:
              # The client secret is copied server-side by provider-kubernetes from the
              # IdentityUniversalAuthClientSecret's connection Secret (<slug>-ua-conn, key
              # attribute.client_secret, same namespace) at apply time: it is never in this manifest, this
              # XR or any function payload (review C2). Until the connection Secret exists the apply fails and
              # retries; the placeholder key is what patchesFrom overwrites.
              references:
                - patchesFrom:
                    apiVersion: v1
                    kind: Secret
                    name: <<printf "%s-ua-conn" $projectSlug>>
                    namespace: <<$xrNamespace>>
                    fieldPath: data[attribute.client_secret]
                  toFieldPath: data.clientSecret
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: <<printf "%s-infisical-creds" $projectSlug>>
                    namespace: <<$xrNamespace>>
                  type: Opaque
                  # data (base64), never stringData - see the kubernetes branch above.
                  data:
                    clientId: <<$uaClientId | b64enc>>
                    clientSecret: ""
              managementPolicies: ["*"]
            ---
                <<- end >>
                <<- end >>

            <<- end >>
            ---
            # ONLY rendered in per-env mode (environmentSlug != "shared"). Does NOT create a
            # project - references the ALREADY-existing one from this (app, cluster) pair's
            # "shared" XR via the SAME computed $projectSlug formula (infisicalproject.yaml's
            # header) - no ExtraResources lookup needed, since airframe-application's own
            # attached/secretstore.yaml always renders the "shared" XR alongside any per-env one,
            # in the SAME chart release, same namespace. If the "shared" XR's own InfisicalProject
            # hasn't finished creating that project yet, InfisicalEnvironment's own reconcile
            # below just waits (TemporaryError) - the same eventual-consistency shape every other
            # not-yet-ready reference in this catalog already uses, no ordering logic needed here.
            #
            # InfisicalEnvironment (a second CRD this same operator reconciles,
            # secrets.idp.io/v1alpha1 - see its own CRD file's header) just ensures ONE
            # additional environment exists in that project. The credentials Secret this store's
            # auth block references is the SAME one the "shared" XR's InfisicalProject wrote -
            # both XRs live in the same namespace (airframe-application's own convention: this chart
            # renders every SecretStore-family XR for one (app, cluster) pair into one dedicated
            # namespace - see that chart's own attached/secretstore.yaml), so a same-namespace
            # secretKeyRef is correct without this Composition needing to know that convention
            # by name.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $appName := $spec.appRef.name >>
            <<- $envSlug := $spec.environmentSlug | default "shared" >>
            <<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
            <<- $credsSecretName := printf "%s-infisical-creds" $projectSlug >>
            <<- $hostAPI := $infisicalUrl >>
            <<- $authMethod := "universal" >>
            <<- if $isInfisicalHost >>
              <<- $authMethod = "kubernetes" >>
            <<- end >>
            <<- if ne $envSlug "shared" >>
            # 2026-09-18 MIGRATION - see infisicalproject.yaml's own header for the full
            # rationale (kubernetes-auth branch only, universal-auth unchanged below, NOT YET
            # live-cut-over to main). Same $projectSlug convention: references the ALREADY
            # -existing Project this (app,cluster) pair's "shared" XR already created (or is
            # creating concurrently - same eventual-consistency shape as the original).
            apiVersion: project.infisical.m.hangar.io/v1alpha1
            kind: ProjectEnvironment
            metadata:
              name: <<$xrName>>
              annotations:
                <<setResourceNameAnnotation "infisical-environment">>
                <<- $adoptThisEnvId := index $adoptEnvIds $envSlug | default "" >>
                <<- if $adoptThisEnvId >>
                crossplane.io/external-name: <<$adoptThisEnvId | toJson>>
                <<- end >>
            spec:
              # No Delete, deliberately: deleting this XR (or ArgoCD pruning the file that declares it)
              # must never delete the Infisical project/environment and the secrets in it. The
              # Kubernetes object goes, the Infisical object stays. Identities, their auth config and
              # client secrets keep Delete so credentials are still revoked. Consequence: a
              # decommissioned app's project is left behind and holds its slug - to reuse the slug,
              # adopt the leftover project through the secretstore-provisioner ConfigMap, or delete
              # it in Infisical by hand.
              managementPolicies: ["Create", "Observe", "Update", "LateInitialize"]
              forProvider:
                name: <<$envSlug>>
                slug: <<$envSlug>>
                projectIdRef:
                  name: <<$projectSlug>>
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<$xrName>>
              annotations:
                <<setResourceNameAnnotation "per-env-cluster-secret-store">>
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ClusterSecretStore
                  metadata:
                    name: <<$xrName>>
                  spec:
                    conditions:
                      # Narrowed to exactly ONE namespace (not the "shared" store's wildcard) -
                      # the real per-env isolation this mode exists for: an ExternalSecret
                      # anywhere else can't even resolve this store, regardless of what its own
                      # remoteRef says.
                      - namespaceRegexes:
                          - <<printf "^app-%s-%s$" $appName $envSlug | toJson>>
                    provider:
                      infisical:
                        hostAPI: <<$hostAPI | toJson>>
                        auth:
                          <<- if eq $authMethod "kubernetes" >>
                          kubernetesAuthCredentials:
                            identityId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: identityId
                          <<- else >>
                          universalAuthCredentials:
                            clientId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientId
                            clientSecret:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientSecret
                          <<- end >>
                        secretsScope:
                          projectSlug: <<$projectSlug>>
                          environmentSlug: <<$envSlug>>
                          secretsPath: "/"
              managementPolicies: ["*"]
            <<- end >>
            ---
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
