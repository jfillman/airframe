# Render cases for tools/test_compositions.py: each renders example/<xr> with the listed required
# (extra) and observed fixtures and is compared with example/expected/<name>.yaml; `expect` adds
# readable assertions. Regenerate expectations with `tools/test_compositions.py --update <composition>`.
cases:
- name: checkout-api-new-project
  xr: xr-checkout-api.yaml
  required:
  - cluster-registry-upper.yaml
- name: checkout-api-adopted
  xr: xr-checkout-api.yaml
  required:
  - cluster-registry-upper.yaml
  - secretstore-provisioner.yaml
- name: checkout-api-staging
  xr: xr-checkout-api-staging.yaml
  required:
  - cluster-registry-upper-kind-prod.yaml
  - secretstore-provisioner.yaml
- name: checkout-api-kubernetes-auth
  xr: xr-checkout-api.yaml
  required:
  - cluster-registry-infisical-host-with-live-urls.yaml
  - kube-root-ca.yaml
  observed:
  - observed-identity.yaml
- name: checkout-api-universal-creds
  xr: xr-checkout-api.yaml
  observed:
  - observed-ua-client-secret.yaml
  required:
  - cluster-registry-upper.yaml
- name: registry-url-universal-auth
  xr: xr-checkout-api.yaml
  required:
  - cluster-registry-upper-with-infisical.yaml
  observed:
  - observed-ua-client-secret.yaml
- name: registry-url-kubernetes-auth
  xr: xr-checkout-api.yaml
  required:
  - cluster-registry-infisical-host-with-urls.yaml
  - kube-root-ca.yaml
  observed:
  - observed-identity.yaml
- name: registry-keys-missing
  xr: xr-checkout-api.yaml
  required:
  - cluster-registry-infisical-host.yaml
  - kube-root-ca.yaml
  expect:
    fatal: true
