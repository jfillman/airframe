# The record of the cluster that runs Infisical, with the live values: infisicalUrl is the in-cluster URL there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-dev
  namespace: crossplane-system
data:
  type: dev
  cicdReady: "true"
  infisicalHost: "true"
  tenantsRepo: gitops-cluster-dev-tenants
  infisicalUrl: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  infisicalOrgId: 820c617c-71a5-45e4-bc19-863a4f88edf8
