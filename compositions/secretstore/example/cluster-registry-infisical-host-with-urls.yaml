# The record of the cluster that runs Infisical (infisicalUrl is the in-cluster URL there), with made-up values
# so the cases that use it prove hostAPI and orgId come from the registry.
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-dev
  namespace: crossplane-system
data:
  type: dev
  cicdReady: "true"
  infisicalHost: "true"
  tenantsRepo: gitops-cluster-dev-tenants
  infisicalUrl: http://infisical.infisical.svc.cluster.local:9999/api
  infisicalOrgId: 11111111-2222-3333-4444-555555555555
