# The record of the cluster that runs Infisical without infisicalUrl/infisicalOrgId: the registry-keys-missing
# case proves the render fails instead of guessing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-dev
  namespace: crossplane-system
data:
  type: dev
  cicdReady: "true"
  infisicalHost: "true"
  tenantsRepo: gitops-cluster-dev-tenants
