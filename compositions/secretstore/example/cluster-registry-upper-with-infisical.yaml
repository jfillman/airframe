# A cluster that doesn't run Infisical, with made-up infisicalUrl/infisicalOrgId values so the cases that use it
# prove hostAPI and orgId come from the registry.
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-dev
  namespace: crossplane-system
data:
  type: upper
  crossplaneReady: "true"
  infisicalUrl: http://infisical.registry.example:31800/api
  infisicalOrgId: 11111111-2222-3333-4444-555555555555
