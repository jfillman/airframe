# The record the cluster-registry chart renders for a cluster that doesn't run Infisical: infisicalUrl is the
# address other clusters reach Infisical at, infisicalOrgId the fleet's org. The values are the live ones.
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-dev
  namespace: crossplane-system
data:
  type: upper
  crossplaneReady: "true"
  infisicalUrl: http://infisical.example:31800/api
  infisicalOrgId: 820c617c-71a5-45e4-bc19-863a4f88edf8
