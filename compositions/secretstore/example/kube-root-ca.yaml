# Every namespace carries this ConfigMap; the kubernetes-auth branch reads the cluster CA from it
# (01-k8s-reviewer-secret-gate.yaml) instead of from the token-reviewer Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-root-ca.crt
  namespace: demo-apps
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    FIXTURE
    -----END CERTIFICATE-----
