# The universal-auth client secret once created: clientId is published in status; the secret itself
# only in the connection Secret, which the composition never reads (provider-kubernetes copies it).
apiVersion: identity.infisical.m.hangar.io/v1alpha1
kind: IdentityUniversalAuthClientSecret
metadata:
  name: checkout-api-kind-dev
  namespace: demo-apps
  annotations:
    crossplane.io/composition-resource-name: infisical-identity-ua-client-secret
status:
  atProvider:
    clientId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
  conditions:
    - type: Ready
      status: "True"
      reason: Available
