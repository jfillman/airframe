# Adoption ids for an Infisical project that already exists, so its secrets stay in place.
# Lives in crossplane-system on the cluster that runs the SecretStore Composition; one key
# per project slug (<appRef.name>-<cluster>). A slug with no key gets a new project.
# See templates/02-provisioner-gate.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: secretstore-provisioner
  namespace: crossplane-system
data:
  # checkout-api-adopted: the project and its shared environment
  checkout-api-example-dev: |
    projectId: 11111111-1111-1111-1111-111111111111
    sharedEnvId: 22222222-2222-2222-2222-222222222222
  # checkout-api-staging: the staging environment
  checkout-api-example-prod: |
    projectId: 33333333-3333-3333-3333-333333333333
    envIds:
      staging: 44444444-4444-4444-4444-444444444444
