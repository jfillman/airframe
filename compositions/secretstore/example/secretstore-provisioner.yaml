# Adoption ids for an Infisical project that ALREADY EXISTS (so its secrets stay in place).
# Lives in crossplane-system on the cluster that runs the SecretStore Composition; one key
# per project slug (<appRef.name>-<cluster>). A slug with no key just gets a NEW project.
# See templates/02-provisioner-gate.yaml. (The `provisioner: provider` line is a leftover of
# the operator-to-provider migration and is now ignored.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: secretstore-provisioner
  namespace: crossplane-system
data:
  boarding-api-kind-prod: |
    provisioner: provider
    projectId: 00000000-0000-0000-0000-000000000000
    sharedEnvId: 00000000-0000-0000-0000-000000000000
    envIds:
      staging: 00000000-0000-0000-0000-000000000000
