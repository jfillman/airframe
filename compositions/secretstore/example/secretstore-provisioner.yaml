# Per-app opt-in to the provider-infisical chain on a universal-auth cluster (kind-prod).
# Lives in crossplane-system on the cluster that runs the SecretStore Composition; one key
# per project slug (<appRef.name>-<cluster>). No ConfigMap, or no key for a slug, keeps the
# old infisical-secretstore-operator. See templates/02-provisioner-gate.yaml.
#
# The id fields are optional and only for ADOPTING an Infisical project that already
# exists (so its secrets stay in place); omit them to create a fresh project instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: secretstore-provisioner
  namespace: crossplane-system
data:
  boarding-api-kind-prod: |
    provisioner: provider
    projectId: 00000000-0000-0000-0000-000000000000
    sharedEnvId: 00000000-0000-0000-0000-000000000000
    envIds:
      staging: 00000000-0000-0000-0000-000000000000
