# kubernetes-auth branch inputs (review C2, 2026-10-09): the cluster CA only.
#
# Until 2026-10-09 this gate read the token-reviewer ServiceAccount Secret
# (infisical/infisical-token-reviewer-token) through ExtraResources and infisicalproject.yaml
# rendered its JWT into IdentityKubernetesAuth.spec.forProvider.tokenReviewerJwt: the long-lived
# token sat in etcd as plain CR spec, in every XR desired-state round trip and in every function
# request and response. Now the JWT never enters the function pipeline:
#   - the CA comes from the kube-root-ca.crt ConfigMap every namespace has (public material, same
#     bytes as the Secret's ca.crt);
#   - the token reaches the identity through a Secret in the XR's namespace that a provider-kubernetes
#     Object copies server-side from infisical/infisical-token-reviewer-token with
#     references[].patchesFrom (infisicalproject.yaml, infisical-token-reviewer-secret), and
#     IdentityKubernetesAuth points at it with tokenReviewerJwtSecretRef (provider-infisical >=
#     v0.0.0-8, where upjet marks the field sensitive).
# Missing ConfigMap (a namespace without kube-root-ca.crt does not exist on a supported cluster)
# renders an empty CA, which the provider rejects loudly rather than silently trusting nothing.
<<- $caExtra := .extraResources | default dict >>
<<- $caEntry := index $caExtra "kube-root-ca" | default dict >>
<<- $caItems := index $caEntry "items" | default list >>
<<- $k8sCaCert := "" >>
<<- if gt (len $caItems) 0 >>
  <<- $caCm := (index $caItems 0).resource >>
  <<- $k8sCaCert = index (index $caCm "data" | default dict) "ca.crt" | default "" >>
<<- end >>
apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
kind: ExtraResources
requirements:
  kube-root-ca:
    apiVersion: v1
    kind: ConfigMap
    namespace: <<.observed.composite.resource.metadata.namespace>>
    matchName: kube-root-ca.crt
---
