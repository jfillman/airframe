# Real Crossplane extra-resources lookup, same mechanism/convention as
# 00-infisical-host-gate.yaml (this same pipeline step - declared once, persists
# across --- separators for every later file in this directory).
#
# Sources the exact same CA cert + TokenReview-capable service-account JWT the
# current hand-rolled operator already uses for its own Kubernetes Auth
# configuration (infisical-secretstore-operator's INFISICAL_K8S_CA_CERT/
# INFISICAL_K8S_TOKEN_REVIEWER_JWT env vars, both sourced from the same Secret -
# confirmed live via `kubectl get deployment infisical-secretstore-operator -o
# jsonpath=...`). Reused here rather than minted fresh: this Secret already exists,
# is already the credential ESO's TokenReview calls against Infisical are meant to
# validate against, and IdentityKubernetesAuth's own forProvider schema takes these
# as plain string fields (not SecretKeySelector references - upjet generated them
# straight from the Terraform provider's own plain-string schema), so the actual
# value has to be resolved at render time and inlined into the rendered CR - never
# committed to git, only ever appearing in the live rendered object in-cluster,
# same posture as every other live-value lookup in this catalog.
<<- $k8sSecretExtra := .extraResources | default dict >>
<<- $k8sSecretEntry := index $k8sSecretExtra "k8s-reviewer-secret" | default dict >>
<<- $k8sSecretItems := index $k8sSecretEntry "items" | default list >>
<<- $k8sCaCert := "" >>
<<- $k8sReviewerJwt := "" >>
<<- if gt (len $k8sSecretItems) 0 >>
  <<- $k8sSecret := (index $k8sSecretItems 0).resource >>
  <<- $k8sSecretData := index $k8sSecret "data" | default dict >>
  <<- $caB64 := index $k8sSecretData "ca.crt" | default "" >>
  <<- $jwtB64 := index $k8sSecretData "token" | default "" >>
  <<- if ne $caB64 "" >>
    <<- $k8sCaCert = $caB64 | b64dec >>
  <<- end >>
  <<- if ne $jwtB64 "" >>
    <<- $k8sReviewerJwt = $jwtB64 | b64dec >>
  <<- end >>
<<- end >>
apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
kind: ExtraResources
requirements:
  k8s-reviewer-secret:
    apiVersion: v1
    kind: Secret
    namespace: infisical
    matchName: infisical-token-reviewer-token
---
