# Per-environment mode (environmentSlug != "shared"): adds the environment <environmentSlug> to
# the project its shared sibling XR created (same computed slug, no lookup), and a
# ClusterSecretStore limited to exactly the namespace app-<app>-<environmentSlug>.
#
# Creates no project and no identity. The store logs in with the shared XR's
# <slug>-infisical-creds Secret, which is in the same namespace because ApplicationEnvironment
# requests both XRs through the same xr-requests folder. If the project doesn't exist yet, the
# ProjectEnvironment waits for it.
<<- $spec := .observed.composite.resource.spec >>
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
<<- $appName := $spec.appRef.name >>
<<- $envSlug := $spec.environmentSlug | default "shared" >>
<<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
<<- $credsSecretName := printf "%s-infisical-creds" $projectSlug >>
<<- $hostAPI := $infisicalUrl >>
<<- $authMethod := "universal" >>
<<- if $isInfisicalHost >>
  <<- $authMethod = "kubernetes" >>
<<- end >>
<<- if ne $envSlug "shared" >>
apiVersion: project.infisical.m.hangar.io/v1alpha1
kind: ProjectEnvironment
metadata:
  name: <<$xrName>>
  annotations:
    <<setResourceNameAnnotation "infisical-environment">>
    <<- $adoptThisEnvId := index $adoptEnvIds $envSlug | default "" >>
    <<- if $adoptThisEnvId >>
    crossplane.io/external-name: <<$adoptThisEnvId | toJson>>
    <<- end >>
spec:
  # No Delete: removing this XR, or ArgoCD pruning the file that declares it, must never
  # delete the project or the secrets in it. Identities and client secrets keep Delete, so
  # credentials are still revoked. A decommissioned app's project keeps its slug: adopt it
  # (02-provisioner-gate.yaml) or delete it in Infisical by hand.
  managementPolicies: ["Create", "Observe", "Update", "LateInitialize"]
  forProvider:
    name: <<$envSlug>>
    slug: <<$envSlug>>
    projectIdRef:
      name: <<$projectSlug>>
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: <<$xrName>>
  annotations:
    <<setResourceNameAnnotation "per-env-cluster-secret-store">>
spec:
  forProvider:
    manifest:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: <<$xrName>>
      spec:
        conditions:
          # Exactly one namespace: an ExternalSecret anywhere else can't use this store,
          # whatever its remoteRef says.
          - namespaceRegexes:
              - <<printf "^(app|infra)-%s-%s$" $appName $envSlug | toJson>>
        provider:
          infisical:
            hostAPI: <<$hostAPI | toJson>>
            auth:
              <<- if eq $authMethod "kubernetes" >>
              kubernetesAuthCredentials:
                identityId:
                  name: <<$credsSecretName>>
                  namespace: <<$xrNamespace>>
                  key: identityId
              <<- else >>
              universalAuthCredentials:
                clientId:
                  name: <<$credsSecretName>>
                  namespace: <<$xrNamespace>>
                  key: clientId
                clientSecret:
                  name: <<$credsSecretName>>
                  namespace: <<$xrNamespace>>
                  key: clientSecret
              <<- end >>
            secretsScope:
              projectSlug: <<$projectSlug>>
              environmentSlug: <<$envSlug>>
              secretsPath: "/"
  managementPolicies: ["*"]
<<- end >>
---
