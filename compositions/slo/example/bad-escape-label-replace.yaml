# A filter that is a function call, not a matcher list.
apiVersion: catalog.hangar.io/v1alpha1
kind: SLO
metadata:
  name: escape-label-replace
  namespace: app-checkout-prod
spec:
  environmentRef:
    name: checkout-example-dev-prod
  service: checkout-api
  objective: 99.9
  indicator:
    type: availability
    metric: http_requests_total
    totalFilter: service="checkout-api"
    errorFilter: code=~"5.."} or label_replace(up, "namespace", "x", "", "")
