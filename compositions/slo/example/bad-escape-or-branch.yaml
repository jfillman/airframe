# Closes the selector and starts a second one that reads another tenant.
apiVersion: catalog.hangar.io/v1alpha1
kind: SLO
metadata:
  name: escape-or-branch
  namespace: app-checkout-prod
spec:
  environmentRef:
    name: checkout-example-dev-prod
  service: checkout-api
  objective: 99.9
  indicator:
    type: availability
    metric: http_requests_total
    totalFilter: service="x"}) or sum(rate(http_requests_total{namespace="app-other-prod"
    errorFilter: code=~"5.."
