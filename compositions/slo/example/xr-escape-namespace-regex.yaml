# namespace=~".*" would match every tenant.
apiVersion: catalog.hangar.io/v1alpha1
kind: SLO
metadata:
  name: escape-namespace-regex
  namespace: app-checkout-prod
spec:
  environmentRef:
    name: checkout-example-dev-prod
  service: checkout-api
  objective: 99.9
  indicator:
    type: availability
    metric: http_requests_total
    totalFilter: namespace=~".*"
    errorFilter: code=~"5.."
