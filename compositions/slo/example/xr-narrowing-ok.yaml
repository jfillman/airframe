# exported_namespace and braces/or inside quoted values are plain matchers: allowed, and they can only narrow.
apiVersion: catalog.hangar.io/v1alpha1
kind: SLO
metadata:
  name: narrowing-ok
  namespace: app-checkout-prod
spec:
  environmentRef:
    name: checkout-example-dev-prod
  service: checkout-api
  objective: 99.9
  indicator:
    type: availability
    metric: http_requests_total
    totalFilter: service="checkout-api",exported_namespace="app-other-prod",path=~"/a} or b"
    errorFilter: code=~"5.."
