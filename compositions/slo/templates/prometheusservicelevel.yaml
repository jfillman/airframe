# Rendered by function-go-templating (source: Inline, see composition.yaml/
# build-composition.sh), using double-angle-bracket delimiters
# (see composition.yaml). Generates Sloth's own CRD (sloth.slok.dev/v1
# PrometheusServiceLevel) instead of a PrometheusRule directly - Sloth's own
# controller (gitops-cluster-dev/10-crds-operators/sloth/) does the
# spec->PrometheusRule translation, including the full canonical Google SRE
# workbook multi-window-multi-burn-rate pattern (page + ticket tiers) with no
# burn-rate fields needed from us at all.
#
# NOTE: never write two literal `<` or `>` characters adjacent to each other
# anywhere in this file outside a real action, including in comments - the
# lexer scans raw text for the delimiter pair regardless of YAML comment
# syntax, and an accidental empty action fails the whole render (bit us once
# already on the previous hand-rolled version of this file).
#
# `{{.window}}` in errorQuery/totalQuery below is Sloth's OWN Go-template
# placeholder syntax (not ours) - it must reach the PrometheusServiceLevel
# object completely literally, for Sloth's controller to substitute per-window
# at generation time. Because this Composition step uses double-angle-bracket
# delimiters instead of Go template's curly-brace default (see
# composition.yaml), that text passes straight through untouched - same
# mechanism that already protects Prometheus's own {{ $value }} alert-
# annotation syntax elsewhere in this catalog.
#
# metadata.labels: release: kube-prometheus-stack below is not decorative -
# it's the ONLY thing that makes kube-prometheus-stack's Prometheus actually
# load the PrometheusRule Sloth generates from this object. Confirmed live by
# reading Sloth's own source (internal/plugin/k8stransform/
# prom_operator_prometheus_rule_v1/plugin.go's `u.SetLabels(kmeta.Labels)`,
# fed by internal/app/kubecontroller/handler.go from THIS object's own
# metadata.labels): Sloth's `sloth.extraLabels` Helm value (also set to
# release=kube-prometheus-stack, see the sloth Application) only stamps that
# label onto each individual generated recording/alert RULE's own `labels:`,
# never onto the generated PrometheusRule K8s OBJECT's metadata.labels, which
# is what Prometheus's ruleSelector actually matches on. Without this, `kubectl
# get prometheusrule` shows the object created, `status.promOpRulesGenerated:
# true` looks healthy, and Prometheus simply never loads it - no error
# anywhere. (Also hit live: kubelet's ConfigMap-volume propagation into the
# Prometheus pod lagged ~35 minutes on this cluster before the rules actually
# appeared in Prometheus's own /api/v1/rules - not a bug in this template, but
# worth knowing before assuming a fresh SLO isn't working.)
#
# Explicit readiness: Sloth's PrometheusServiceLevel never sets
# status.conditions[type=Ready] (confirmed live - it only sets its own custom
# status fields, e.g. promOpRulesGenerated), so function-auto-ready's default
# "no Ready condition = not ready" fallback leaves the parent SLO XR stuck at
# Ready=False/Creating forever, even once Sloth has actually finished
# generating the PrometheusRule. The gotemplating.fn.crossplane.io/ready
# annotation (read by function-go-templating itself, honored by
# function-auto-ready as an explicit override for this named resource) lets
# this template report real readiness instead: True once Sloth's own
# generation status confirms success, False (not simply absent) beforehand so
# a slow first reconcile still reports Creating rather than a false-positive
# Ready.
#
# NOT a single `dig ... false .observed.resources` call (v0.3.60's original
# form) - Sprig's dig only degrades gracefully to its default when a KEY is
# entirely ABSENT at some level; if an intermediate level is PRESENT but nil
# (confirmed live 2026-09-13 on checkout-api-readiness-latency: 36 identical
# failures over 16 minutes, every single reconcile, not a one-off first-pass
# race - checkout-api-liveness-latency happened not to hit this timing, not
# proof it can't), dig's internal type-assert to map[string]interface{}
# panics instead of falling through. Walked one level at a time with `index`
# + an `if` truthiness check instead - a nil value at any level is simply
# falsy in a Go template `if`, no panic, same end result ($promSLReady stays
# false) for the genuinely-doesn't-exist-yet case this was originally meant
# to cover.
<<- $spec := .observed.composite.resource.spec >>
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $service := $spec.service >>
<<- $indicator := $spec.indicator >>
<<- $objective := $spec.objective >>
<<- $promSLReady := false >>
<<- if .observed.resources >>
  <<- $obsPromSL := index .observed.resources "prometheusservicelevel" >>
  <<- if $obsPromSL >>
    <<- $obsPromSLResource := $obsPromSL.resource >>
    <<- if $obsPromSLResource >>
      <<- $obsPromSLStatus := $obsPromSLResource.status >>
      <<- if $obsPromSLStatus >>
        <<- if $obsPromSLStatus.promOpRulesGenerated >>
          <<- $promSLReady = true >>
        <<- end >>
      <<- end >>
    <<- end >>
  <<- end >>
<<- end >>

<<- if eq $indicator.type "availability" >>
  <<- if not $indicator.errorFilter >>
    <<- fail "indicator.type=availability requires indicator.errorFilter" >>
  <<- end >>
<<- else if eq $indicator.type "latency" >>
  <<- if not $indicator.latencyThreshold >>
    <<- fail "indicator.type=latency requires indicator.latencyThreshold" >>
  <<- end >>
<<- else >>
  <<- fail (printf "indicator.type must be availability or latency, got %q" $indicator.type) >>
<<- end >>

<<- $errorQuery := "" >>
<<- $totalQuery := "" >>
<<- if eq $indicator.type "availability" >>
<<- $errorQuery = printf "sum(rate(%s{%s,%s}[{{.window}}]))" $indicator.metric $indicator.totalFilter $indicator.errorFilter >>
<<- $totalQuery = printf "sum(rate(%s{%s}[{{.window}}]))" $indicator.metric $indicator.totalFilter >>
<<- else >>
<<- $errorQuery = printf "sum(rate(%s_count{%s}[{{.window}}])) - sum(rate(%s_bucket{%s,le=%q}[{{.window}}]))" $indicator.metric $indicator.totalFilter $indicator.metric $indicator.totalFilter $indicator.latencyThreshold >>
<<- $totalQuery = printf "sum(rate(%s_count{%s}[{{.window}}]))" $indicator.metric $indicator.totalFilter >>
<<- end >>

apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: <<$xrName>>-slo
  labels:
    release: kube-prometheus-stack
  annotations:
    <<setResourceNameAnnotation "prometheusservicelevel">>
    gotemplating.fn.crossplane.io/ready: <<if $promSLReady>>"True"<<else>>"False"<<end>>
spec:
  service: <<$service | toJson>>
  slos:
    - name: <<$xrName>>
      objective: <<$objective>>
      sli:
        events:
          errorQuery: <<$errorQuery | toJson>>
          totalQuery: <<$totalQuery | toJson>>
      alerting:
        name: <<printf "%s-slo-alert" $xrName | toJson>>
