# xr-defaults.yaml plus the scaffold ledger as it stands once every scaffold file of the defaults
# render has been seen Ready and recorded (status.scaffold.done). The render for this XR must compose
# NONE of those files (scaffold once, reconcile never) and must carry the ledger forward unchanged.
apiVersion: catalog.hangar.io/v1alpha1
kind: SpringBootApplication
metadata:
  name: widget-service
  namespace: demo-apps
spec:
  devCluster: kind-dev
  javaVersion: '21'
  buildTool: maven
  groupId: io.idp.apps
  port: 8080
  visibility: private
status:
  scaffold:
    done:
    - gitops-repo-readme
    - src-repo-application-java
    - src-repo-application-properties
    - src-repo-build-file
    - src-repo-cicd-yaml
    - src-repo-dockerfile
    - src-repo-gitignore
    - src-repo-readme
