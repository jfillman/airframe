<body><div class="frame"><p class="eyebrow">Hangar · keyless cloud deploys</p><h1>Six guardrails around a keyless deploy</h1>
<div class="diagram-container"><svg viewBox="0 0 1000 536" style="min-width:1000px" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fed-layers-title fed-layers-desc"><title id="fed-layers-title">Six guardrails around a keyless deploy</title><desc id="fed-layers-desc">Six independent checks stand between a pipeline step and AWS, from the admission policy that decides who may run as the deploy ServiceAccount down to Crossplane&#x27;s own policy, which cannot create a role without the permissions boundary.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6570"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b9791f"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e7ba6"/></marker></defs><rect width="100%" height="100%" fill="#f2efe9"/><rect x="160" y="40" width="800" height="384" rx="6" fill="#f2efe9" stroke="#5b6570" stroke-width="1"/><line x1="160" y1="104" x2="960" y2="104" stroke="rgba(27,31,36,0.12)" stroke-width="1"/><line x1="160" y1="168" x2="960" y2="168" stroke="rgba(27,31,36,0.12)" stroke-width="1"/><line x1="160" y1="232" x2="960" y2="232" stroke="rgba(27,31,36,0.12)" stroke-width="1"/><line x1="160" y1="360" x2="960" y2="360" stroke="rgba(27,31,36,0.12)" stroke-width="1"/><text x="180" y="77" fill="#5b6570" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">01</text><text x="224" y="78" fill="#1b1f24" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Admission policy</text><text x="940" y="77" fill="#5b6570" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">who may run as glidepath-cloud-deployer</text><text x="180" y="141" fill="#5b6570" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">02</text><text x="224" y="142" fill="#1b1f24" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Short-lived token</text><text x="940" y="141" fill="#5b6570" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1 hour · audience sts.amazonaws.com · bound to the pod</text><text x="180" y="205" fill="#5b6570" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">03</text><text x="224" y="206" fill="#1b1f24" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Trust policy</text><text x="940" y="205" fill="#5b6570" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">this issuer · this audience · this ServiceAccount</text><text x="180" y="269" fill="#5b6570" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">04</text><text x="224" y="270" fill="#1b1f24" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Role policy</text><text x="940" y="269" fill="#5b6570" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">this repository · this function · no deletes</text><rect x="160" y="296" width="800" height="64" fill="rgba(185,121,31,0.08)" stroke="#b9791f" stroke-width="1"/><text x="180" y="333" fill="#b9791f" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">05</text><text x="224" y="334" fill="#1b1f24" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Permissions boundary</text><text x="940" y="333" fill="#5b6570" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">the most any role Crossplane creates can ever do</text><text x="180" y="397" fill="#5b6570" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">06</text><text x="224" y="398" fill="#1b1f24" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Crossplane&#x27;s own policy</text><text x="940" y="397" fill="#5b6570" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">can&#x27;t create or extend a role without the boundary</text><line x1="140" y1="48" x2="140" y2="160" stroke="rgba(27,31,36,0.30)" stroke-width="1"/><line x1="136" y1="48" x2="140" y2="48" stroke="rgba(27,31,36,0.30)" stroke-width="1"/><line x1="136" y1="160" x2="140" y2="160" stroke="rgba(27,31,36,0.30)" stroke-width="1"/><text x="128" y="107.0" fill="#5b6570" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="end">KUBERNETES</text><line x1="140" y1="176" x2="140" y2="416" stroke="rgba(27,31,36,0.30)" stroke-width="1"/><line x1="136" y1="176" x2="140" y2="176" stroke="rgba(27,31,36,0.30)" stroke-width="1"/><line x1="136" y1="416" x2="140" y2="416" stroke="rgba(27,31,36,0.30)" stroke-width="1"/><text x="128" y="299.0" fill="#5b6570" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="end">AWS IAM</text><line x1="56" y1="444" x2="56" y2="468" stroke="#5b6570" stroke-width="1.2" marker-end="url(#arrow)"/><text x="72" y="460" fill="#5b6570" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">A DEPLOY PASSES EVERY LAYER, TOP TO BOTTOM</text><line x1="24" y1="500" x2="976" y2="500" stroke="rgba(27,31,36,0.12)" stroke-width="0.8"/><text x="24" y="520" fill="#5b6570" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><rect x="96" y="512" width="16" height="12" rx="3" fill="#ffffff" stroke="#1b1f24" stroke-width="1"/><text x="120" y="521" fill="#5b6570" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">guardrail</text><rect x="192" y="512" width="16" height="12" rx="3" fill="rgba(185,121,31,0.08)" stroke="#b9791f" stroke-width="1"/><text x="216" y="521" fill="#5b6570" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">the one added to close an escalation path</text></svg></div></div></body></html>
