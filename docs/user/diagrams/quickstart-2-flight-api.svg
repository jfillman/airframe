erif" text-anchor="start">Deleting the environment deletes its data.</text><text x="545" y="250" fill="#5b6570" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">networkPolicy.allowIngressFrom lets boarding-api in.</text></svg>
