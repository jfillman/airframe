spring.application.name=flight-api
server.port=${PORT:8080}
app.version=@project.version@

# The database. In the cluster these come from the CNPG-generated flight-db-app Secret
# (see platform/envs/dev.yaml in the quickstart); the defaults are for a local Postgres.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flight_db}
spring.datasource.username=${DB_USER:flight_db}
spring.datasource.password=${DB_PASSWORD:}

# The app can start before its database is ready (both are created by the same deploy), so
# let Flyway wait for it instead of crash-looping the pod.
spring.flyway.connect-retries=30
spring.flyway.connect-retries-interval=5s

# Turns flights around so the demo has something moving. Every change is written to
# flight_events; that table is what a message broker publishes from in Phase 2.
simulator.enabled=${SIMULATOR_ENABLED:true}
simulator.interval-ms=${SIMULATOR_INTERVAL_MS:30000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Flight events (Phase 2). Off unless EVENTS_ENABLED=true, so the app runs without a broker. In the
# cluster the connection values come from the skyport-broker attach component (see part 3 of the
# quickstart): RABBITMQ_USER/RABBITMQ_PASSWORD from its <name>-user-credentials Secret,
# RABBITMQ_HOST/RABBITMQ_VHOST from its <name>-connection ConfigMap.
events.enabled=${EVENTS_ENABLED:false}
events.exchange=${EVENTS_EXCHANGE:flights.events}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:flights}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# A broker outage must not take the service down or fail its probes.
management.health.rabbit.enabled=false

# Service-to-service auth (Skyport part 5). Tokens are Dex client_credentials JWTs. In the cluster
# both values come from this app's Dex attach component (airframe xrds/dex.meta.yaml outputs
# jwksUrl and issuer, wired with fromComponent). With OAUTH_JWKS_URL unset nothing is enforced
# (and the app logs a warning), so it still runs anywhere; set, every /api/flights request needs
# a valid bearer token. /api/whoami and /actuator/health/** stay open for the canary board and
# the probes. The key set is fetched on the first request, so Dex being down at startup doesn't
# stop the app (requests are refused until it answers).
skyport.auth.jwks-url=${OAUTH_JWKS_URL:}
skyport.auth.issuer=${OAUTH_ISSUER:}
