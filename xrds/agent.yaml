# Agent (Autopilot M4): the DURABLE half of an agent workload, as a pin. An agent definition is a reviewed YAML file in
# the app's own repository (agents/<name>.yaml; schema: clearance src/clearance/schemas/agent-definition.schema.json).
# This XR says which commit of that file is live. Clearance, Autopilot's tool gateway, lists Agent XRs, fetches each
# pinned file through the agents' GitHub App (Glidepath's broker, which allows an onboarded app's own repositories and
# nothing else), validates it against the schema, checks that the file's name is the XR's name and its owner the XR's
# owner, and loads it beside the platform's bundled definitions. The XR carries no definition content and no
# credential: it is the pointer the platform's gitops review signs off on, and what an auditor reads to know which
# definition was live when (Clearance's `definition.load` evidence records the same pin).
#
# Who creates it: a person, through the Autopilot templates in Backstage. "New agent" opens the definition PR on the
# app's repository and this pin in the tenants repo (tenants/<app>/xr-requests/<name>.yaml, so the XR lands in
# app-<app>-cicd like the app's other requests); "Pin agent" moves an existing agent to a new commit. Never Clearance:
# its one Kubernetes write is AgentRun.
#
# What it composes: nothing. An agent needs no in-cluster object until it runs, and AgentRun composes those. The
# composition publishes the pin as status and one condition, AgentPinned, so `kubectl get agents` and the catalog show
# what is pinned. Whether Clearance LOADED the definition is Clearance's record (clearance-api GET /v1/agents: each
# agent's `source`, and `rejected` for pins it could not load), because Clearance writes no XR status.
#
# Fails closed at admission: commit is a full 40-hex SHA (a branch or a tag is not a pin); path is a YAML file inside
# the repository; repo is the app's own (<app>, gitops-<app> or gitops-infra-<app>: the broker's rule, mirrored so a
# wrong pin is refused before Clearance ever asks); app can't change (the tenants folder and the namespace derive from
# it). Re-pinning (a new commit) and a change of owner are ordinary updates.
#
# Not in the Backstage scaffolder (add-to-catalog false): the generated form could not open the definition PR, and it
# asks for a namespace by hand. Agent XRs are ingested as Resources (backstage app-config ingestAsResourcesKinds), never
# as Components: the definition PR carries the agent's Component, and a same-named ingested Component would collide
# with it (the RolloutWatch lesson, backstage#89).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: agents.catalog.hangar.io
  annotations:
    terasky.backstage.io/add-to-catalog: "false"
    hangar.io/catalog-exclusion: "Requested through the Autopilot templates (New agent, Pin agent), which open the definition PR and derive the namespace; the generated form could do neither."
    hangar.io/agent-summary: "Pins one commit of an agent definition in the app's own repository as the live definition Clearance loads; composes nothing."
spec:
  group: catalog.hangar.io
  names:
    kind: Agent
    plural: agents
    singular: agent
  scope: Namespaced
  # Review C13: deterministic Composition choice for an XR that names none (there is one per kind).
  defaultCompositionRef:
    name: agents.catalog.hangar.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: APP
          type: string
          jsonPath: ".spec.app"
          description: "The onboarded app whose repository holds the definition"
        - name: OWNER
          type: string
          jsonPath: ".spec.owner"
          description: "The owner group (also the definition's owner)"
        - name: COMMIT
          type: string
          jsonPath: ".status.shortCommit"
          description: "The pinned commit, short"
        - name: PINNED
          type: string
          jsonPath: ".status.conditions[?(@.type=='AgentPinned')].reason"
          description: "AgentPinned reason (closed set in xrds/agent.meta.yaml)"
      schema:
        openAPIV3Schema:
          type: object
          description: "Agent: pins one commit of an agent definition in the app's own repository as the live definition Clearance loads; composes nothing."
          properties:
            spec:
              type: object
              description: "The pin: which app's repository, which file, which commit, and who owns the agent."
              required: [app, owner, source]
              x-kubernetes-validations:
                - rule: "self.source.repo.endsWith('/' + self.app) || self.source.repo.endsWith('/gitops-' + self.app) || self.source.repo.endsWith('/gitops-infra-' + self.app)"
                  message: "source.repo must be the app's own repository: <owner>/<app>, <owner>/gitops-<app> or <owner>/gitops-infra-<app> (the rule the agents' GitHub App broker enforces)"
              properties:
                app:
                  type: string
                  pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
                  description: "The onboarded app (tenants/<app>) whose repository holds the definition. The pin lives in that app's xr-requests folder and namespace (app-<app>-cicd). Fixed at creation."
                  x-kubernetes-validations:
                    - {rule: "self == oldSelf", message: "app can't change after creation: the tenants folder and the namespace derive from it; make a new Agent instead"}
                owner:
                  type: string
                  pattern: "^group:[a-z0-9-]+/[a-z0-9._-]+$"
                  description: "The owner group, as a catalog entity reference (group:default/<team>). Clearance loads the definition only when its `owner` is this group; the group's members may freeze, end and hold the agent."
                description:
                  type: string
                  maxLength: 200
                  description: "One line for people: what the agent does. The definition's instructions are the agent's; this is the catalog's."
                source:
                  type: object
                  description: "Where the definition is: a file in the app's own repository, at one commit."
                  required: [repo, path, commit]
                  properties:
                    repo:
                      type: string
                      pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
                      description: "The GitHub repository, <owner>/<name>. Must be the app's own: <app>, gitops-<app> or gitops-infra-<app>, which is what the agents' GitHub App broker will issue a read token for."
                    path:
                      type: string
                      pattern: "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*\\.ya?ml$"
                      maxLength: 512
                      description: "The definition file's path in the repository (agents/<name>.yaml by convention). A relative path to a .yaml or .yml file; no leading slash."
                      x-kubernetes-validations:
                        - {rule: "!self.contains('/../') && !self.startsWith('../')", message: "path stays inside the repository"}
                    commit:
                      type: string
                      pattern: "^[0-9a-f]{40}$"
                      description: "The full commit SHA (40 hex) the file is read at. A branch or a tag is not a pin: the point of this XR is that what Clearance loads cannot change without a reviewed change here."
            status:
              type: object
              description: "Published by the Composition: the pin, for `kubectl get` and the catalog. Nothing here says whether Clearance loaded it; that is clearance-api's GET /v1/agents."
              properties:
                repo:
                  type: string
                  description: "spec.source.repo, echoed."
                path:
                  type: string
                  description: "spec.source.path, echoed."
                commit:
                  type: string
                  description: "spec.source.commit, echoed."
                shortCommit:
                  type: string
                  description: "The first seven characters of the commit."
                pin:
                  type: string
                  description: "One line: <repo>@<short commit> <path>."
