# Sidecar contract for AgentRepository (format in tools/sidecars.py). Checked against compositions/agentrepository/
# renders by tools/test_sidecars.py. Role bootstrap: the XR onboards a repository.
kind: AgentRepository
role: bootstrap
summary: 'A team''s repository of prompt-only Autopilot agent definitions: the repo <name> with its scaffold (README,
  agents/, preflight/cases/, a checks-only cicd.yaml) and the TektonCICD child that registers it with Glidepath.'
outputs:
  repo:
    kind: literal
    value: '{name}'
    description: The GitHub repository the agent definitions live in (agents/<name>.yaml).
    at:
      kind: Repository
      field: spec.forProvider.name
  tektonCicd:
    kind: literal
    value: '{name}-tektoncicd'
    description: The composed TektonCICD child XR; DevClusterReady and CicdOnboarded are copied from it.
    at:
      kind: TektonCICD
      field: metadata.name
sources:
- object:
    kind: Repository
    name: '{name}-repo'
  createdBy: composition
- object:
    kind: TektonCICD
    name: '{name}-tektoncicd'
  createdBy: composition
conditions:
- type: DevClusterReady
  reasons:
  - reason: DevClusterReady
    status: 'True'
    meaning: The dev cluster named in spec.devCluster is registered with type dev and cicdReady true.
  - reason: DevClusterNotReady
    status: 'False'
    meaning: The dev cluster is not in the cluster registry, not type dev, or not cicdReady yet; nothing is composed until it is.
- type: CicdOnboarded
  reasons:
  - reason: CicdOnboarded
    status: 'True'
    meaning: The tenants repo carries this repo's identity.yaml, so Glidepath onboards it (its checks run).
  - reason: CicdOnboardingPending
    status: 'False'
    meaning: identity.yaml has not been observed Ready yet (normal for a minute after creation).
verify:
- id: dev-cluster-ready
  check: The XR's DevClusterReady condition is True (DevClusterReady).
  run: {kind: condition, type: DevClusterReady, reasons: [DevClusterReady]}
- id: cicd-onboarded
  check: The XR's CicdOnboarded condition is True (CicdOnboarded).
  run: {kind: condition, type: CicdOnboarded, reasons: [CicdOnboarded]}
agentNotes:
  - "Prompt-only agents only. A code agent (its own source and image) is an app: onboard it with an application kind; its agents/ definitions get the same checks and release."
  - "The scaffold is create-once: after the first write the files are the team's."
  - "The pins this repo's releases open land in tenants/<name>/xr-requests/ (the broker's /agent-pin), namespace app-<name>-cicd."
owner: human
