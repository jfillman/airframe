# Cloud-target XRD (2026-10-08): the minimum AWS infrastructure Glidepath's `deploy.target:
# aws-ecs` needs to exist before an app can deploy - deploy-ecs.yaml only registers a new task
# definition revision with the built image and updates an EXISTING service, so the cluster, the
# task definition family (named <appName>-<env> by Glidepath's own default), the container inside
# it and the service all have to be there first, along with somewhere to run: a Fargate task needs
# subnets with a route to the internet (to pull the image from ghcr.io) and a security group that
# lets the smoke test reach the container port. By default this XR creates a small dedicated
# network for exactly that (one VPC, one public subnet, an internet gateway, a route and a security
# group), so a target is self-contained and deleting the XR removes everything; `network.mode:
# existing` uses subnets and security groups you already have instead.
#
# Stand-alone and disposable, requested as its own XR in tenants/<app>/xr-requests/. Not composed
# by any app XRD. The service and task definition are composed WITHOUT the Update management
# policy: Glidepath rotates task-definition revisions and re-points the service on every deploy,
# and Crossplane must never revert that to the placeholder.
#
# No load balancer, on purpose (minimum infrastructure): the task gets a public IP and the
# container port is open to the internet on the security group, so `aws ecs describe-tasks` plus
# `curl http://<public-ip>:<port>/` is the smoke test. An ALB is the first thing to add if a
# stable hostname is ever needed.
#
# apiextensions.crossplane.io/v2, scope: Namespaced - matches every other XRD in this catalog.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: awsecstargets.catalog.hangar.io
  annotations:
    terasky.backstage.io/add-to-catalog: "true"
    terasky.backstage.io/target-path: "tenants/${{ parameters.xrName }}/xr-requests"
    terasky.backstage.io/description: "Stand up the AWS infrastructure a container deploys into on ECS Fargate (cluster, task definition, service, execution role and a small public network) - disposable, for an app's deploy.target: aws-ecs."
    hangar.io/agent-summary: "Stand up the AWS infrastructure a container deploys into on ECS Fargate (cluster, task definition, service, execution role and a small public network) - disposable, for an app's deploy.target: aws-ecs."
spec:
  group: catalog.hangar.io
  names:
    kind: AwsEcsTarget
    plural: awsecstargets
    singular: awsecstarget
  scope: Namespaced
  # Review C13: deterministic Composition choice for an XR that names none (there is one per kind).
  defaultCompositionRef:
    name: awsecstargets.catalog.hangar.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: TARGET
          type: string
          jsonPath: ".status.conditions[?(@.type=='TargetReady')].reason"
          description: "TargetReady reason (closed set in xrds/<kind>.meta.yaml)"
      schema:
        openAPIV3Schema:
          type: object
          description: "AwsEcsTarget: Stand up the AWS infrastructure a container deploys into on ECS Fargate (cluster, task definition, service, execution role and a small public network) - disposable, for an app's deploy.target: aws-ecs."
          properties:
            spec:
              type: object
              description: "Desired state of the AwsEcsTarget. Each field below is documented; the XRD rejects unknown fields at sync time (server-side apply)."
              properties:
                appName:
                  type: string
                  description: >-
                    The app this target serves. Defaults to this XR's own name. Names everything:
                    the ECS cluster (<appName>), the service and task-definition family
                    (<appName>-<env>, Glidepath's own default family name) and the container
                    (<appName>, the deploy.ecs.containerName the app's cicd.yaml must carry).
                  pattern: '^[a-z][a-z0-9-]{0,30}$'
                env:
                  type: string
                  description: >-
                    The environment this target is for - "dev" for the smoke apps. Part of the
                    service and family names (<appName>-<env>); must equal the `env` of the deploy
                    step in the app's cicd.yaml, because deploy-ecs derives the family from it.
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                  maxLength: 20
                  default: dev
                region:
                  type: string
                  description: AWS region for every resource here. Must equal deploy.ecs.region in the app's cicd.yaml.
                  pattern: '^[a-z]{2}(-[a-z]+)+-[0-9]$'
                  default: us-east-1
                architecture:
                  type: string
                  description: >-
                    Fargate runtime platform: arm64 (Graviton) or x86_64. The app's build.platforms
                    must include it, because the image Glidepath deploys is built per platform.
                  enum: [arm64, x86_64]
                  default: arm64
                cpu:
                  type: string
                  description: Fargate task CPU units, as a string. Paired with memory per Fargate's allowed combinations.
                  enum: ["256", "512", "1024", "2048"]
                  default: "256"
                memory:
                  type: string
                  description: Fargate task memory in MiB, as a string. 256 CPU allows 512 to 2048; 512 allows 1024 to 4096.
                  enum: ["512", "1024", "2048", "4096"]
                  default: "512"
                containerPort:
                  type: integer
                  description: >-
                    The port the app listens on. Mapped on the container, opened on the security
                    group, and passed to the container as the PORT environment variable (the
                    scaffolded apps read it).
                  minimum: 1
                  maximum: 65535
                  default: 8080
                desiredCount:
                  type: integer
                  description: Number of tasks the service keeps running. 0 parks the target without deleting it.
                  minimum: 0
                  maximum: 3
                  default: 1
                bootstrapImage:
                  type: string
                  description: >-
                    The placeholder image the first task-definition revision runs until Glidepath's
                    first deploy replaces it. Must exist for the chosen architecture and start
                    without arguments; deploy-ecs keeps every other field of the container
                    definition, so no command or entrypoint is set here.
                  minLength: 1
                  default: public.ecr.aws/nginx/nginx:stable-alpine
                network:
                  type: object
                  description: Where the Fargate task runs.
                  properties:
                    mode:
                      type: string
                      description: >-
                        create (default): this XR composes a dedicated VPC with one public subnet,
                        an internet gateway, a route and a security group opening containerPort to
                        the internet. existing: use the subnets and security groups listed below
                        and compose no network resources at all (then provider-aws-ec2 is not
                        needed).
                      enum: [create, existing]
                      default: create
                    vpcCidr:
                      type: string
                      description: (create) The VPC's /16; the single subnet is its first /24.
                      pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}/16$'
                      default: 10.42.0.0/16
                    availabilityZone:
                      type: string
                      description: (create) Availability zone of the subnet. Defaults to "<region>a".
                      pattern: '^[a-z]{2}(-[a-z]+)+-[0-9][a-z]$'
                    subnetIds:
                      type: array
                      description: (existing) Subnets the task runs in; they need a route to the internet and public IPs on launch.
                      items:
                        type: string
                        description: A subnet id, e.g. subnet-0123456789abcdef0.
                    securityGroupIds:
                      type: array
                      description: (existing) Security groups for the task; one must allow inbound TCP on containerPort.
                      items:
                        type: string
                        description: A security group id, e.g. sg-0123456789abcdef0.
                  x-kubernetes-validations:
                    - rule: "self.mode != 'existing' || (has(self.subnetIds) && self.subnetIds.size() > 0)"
                      message: "network.subnetIds is required when network.mode == existing"
                    - rule: "self.mode != 'existing' || (has(self.securityGroupIds) && self.securityGroupIds.size() > 0)"
                      message: "network.securityGroupIds is required when network.mode == existing"
            status:
              type: object
              description: Published by the Composition - everything the app's cicd.yaml needs, and where to look for the running task.
              properties:
                cluster:
                  type: string
                  description: ECS cluster name (deploy.ecs.cluster).
                service:
                  type: string
                  description: ECS service name (deploy.ecs.service).
                taskDefinitionFamily:
                  type: string
                  description: Task-definition family (Glidepath's default <appName>-<env>, so deploy.ecs.taskDefinitionFamily can stay unset).
                containerName:
                  type: string
                  description: Container name inside the task definition (deploy.ecs.containerName).
                region:
                  type: string
                  description: The region (deploy.ecs.region).
                containerPort:
                  type: integer
                  description: The port open on the task's public IP.
                subnetIds:
                  type: array
                  description: Subnets the service runs in.
                  items:
                    type: string
                    description: A subnet id.
                securityGroupIds:
                  type: array
                  description: Security groups on the service's tasks.
                  items:
                    type: string
                    description: A security group id.
                cicd:
                  type: string
                  description: The cicd.yaml deploy block, ready to paste, that targets this service.
          required: ["spec"]
