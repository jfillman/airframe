# Bootstrap-tier XRD for an Azure Functions app packaged as a container image and hosted on
# Azure Container Apps. Same reasoning as LambdaFunction's header: no ports, replicas, Rollout
# or Helm chart, so the application XRDs' parameters do not apply.
#
# BRING YOUR OWN APP. Glidepath's azure-container-apps target only updates an existing
# Container App's image; nothing here creates the resource group, the Container Apps environment
# or the app. Create them first (a function app hosted on Container Apps), then onboard.
#
# Deploys through the existing azure-container-apps target rather than a new azure-functions
# one: a function app on Container Apps is a Container App, updated with
# `az containerapp update --image`. Assumption, not yet verified against a real subscription.
#
# amd64 only: Microsoft's Functions base images have no arm64 variant, so the starter
# cicd.yaml sets build.platforms: [amd64].
#
# No gitops-<app> repo; see LambdaFunction's header for why and for the TektonCICD caveat.
# The Component should carry hangar.io/service-class: function and
# hangar.io/deploy-target: azure-container-apps (tower docs/service-classes.md); Tower also
# infers both from the kind:azurefunction tag.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: azurefunctions.catalog.hangar.io
  annotations:
    terasky.backstage.io/add-to-catalog: "true"
    terasky.backstage.io/target-path: "tenants/${{ parameters.xrName }}/xr-requests"
    terasky.backstage.io/description: "Onboard a new Azure Functions app (container image) - creates its source repo with an HTTP function and CI/CD that deploys to an existing Container App."
    hangar.io/agent-summary: "Onboard a new Azure Functions app (container image) - creates its source repo with an HTTP function and CI/CD that deploys to an existing Container App."
spec:
  group: catalog.hangar.io
  names:
    kind: AzureFunction
    plural: azurefunctions
    singular: azurefunction
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                devCluster:
                  type: string
                  description: >-
                    Which dev cluster this app is onboarded onto - e.g. "kind-dev". An app is pinned to
                    exactly one. Checked live against the cluster registry via a Crossplane
                    extra-resources lookup: must resolve to a ConfigMap with type: dev and
                    cicdReady: "true", or the Composition creates nothing and reports
                    DevClusterReady: False rather than partially succeeding.
                  minLength: 1
                description:
                  type: string
                  description: >-
                    Free-text description - the src repo's GitHub description and the
                    generated README. Optional.
                  minLength: 1
                visibility:
                  type: string
                  description: GitHub visibility for the src repo.
                  enum: [private, public]
                  default: private
                runtime:
                  type: string
                  description: >-
                    Language and Microsoft Functions base image: nodejs20
                    (mcr.microsoft.com/azure-functions/node:4-node20, programming model v4) or
                    python3.12 (azure-functions/python:4-python3.12, model v2).
                  enum: ["nodejs20", "python3.12"]
                  default: "nodejs20"
                resourceGroup:
                  type: string
                  description: Resource group of the existing Container App. Required, since the app already exists.
                  minLength: 1
                appName:
                  type: string
                  description: >-
                    Name of the existing Container App hosting the function app. Defaults to the XR's own name.
                  minLength: 1
                  maxLength: 32
              required: ["devCluster", "resourceGroup"]
          required: ["spec"]
