# Bootstrap-tier XRD for an Azure Functions app packaged as a container image and hosted on
# Azure Container Apps. Same reasoning as LambdaFunction's header: no ports, replicas, Rollout
# or Helm chart, so the application XRDs' parameters do not apply.
#
# BRING YOUR OWN APP. Glidepath's azure-container-apps target only updates an existing
# Container App's image; nothing here creates the resource group, the Container Apps environment
# or the app. Create them first (a function app hosted on Container Apps), then onboard.
#
# Deploys through the existing azure-container-apps target rather than a new azure-functions
# one: a function app on Container Apps is a Container App, updated with
# `az containerapp update --image`. Assumption, not yet verified against a real subscription.
#
# amd64 only: Microsoft's Functions base images have no arm64 variant, so the starter
# cicd.yaml sets build.platforms: [amd64].
#
# No gitops-<app> repo; see LambdaFunction's header for why and for the TektonCICD caveat.
# The Component should carry hangar.io/service-class: function and
# hangar.io/deploy-target: azure-container-apps (tower docs/service-classes.md); Tower also
# infers both from the kind:azurefunction tag.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: azurefunctions.catalog.hangar.io
  annotations:
    terasky.backstage.io/add-to-catalog: "true"
    terasky.backstage.io/target-path: "tenants/${{ parameters.xrName }}/xr-requests"
    terasky.backstage.io/description: "Onboard a new Azure Functions app (container image) - creates its source repo with an HTTP function and CI/CD that deploys to an existing Container App."
    hangar.io/agent-summary: "Onboard a new Azure Functions app (container image) - creates its source repo with an HTTP function and CI/CD that deploys to an existing Container App."
spec:
  group: catalog.hangar.io
  names:
    kind: AzureFunction
    plural: azurefunctions
    singular: azurefunction
  scope: Namespaced
  # Review C13: deterministic Composition choice for an XR that names none (there is one per kind).
  defaultCompositionRef:
    name: azurefunctions.catalog.hangar.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: DEVCLUSTER
          type: string
          jsonPath: ".status.conditions[?(@.type=='DevClusterReady')].reason"
          description: "DevClusterReady reason"
        - name: CICD
          type: string
          jsonPath: ".status.conditions[?(@.type=='CicdOnboarded')].reason"
          description: "CicdOnboarded reason"
        - name: TARGET
          type: string
          jsonPath: ".status.conditions[?(@.type=='TargetReady')].reason"
          description: TargetReady reason when spec.target.enabled
      schema:
        openAPIV3Schema:
          type: object
          description: "AzureFunction: Onboard a new Azure Functions app (container image) - creates its source repo with an HTTP function and CI/CD that deploys to an existing Container App."
          properties:
            metadata:
              type: object
              description: "Standard object metadata. Only name is constrained here (its length)."
              properties:
                name:
                  type: string
                  maxLength: 52
                  description: >-
                    At most 52 characters (review C13). The composed TektonCICD child is <name>-tektoncicd, and its name becomes a 63-character label on everything it composes.
            status:
              type: object
              description: "Observed state of the AzureFunction, written by its Composition (conditions are added by Crossplane)."
              properties:
                scaffold:
                  type: object
                  description: >-
                    Scaffold ledger, written by the Composition. Scaffold files (RepositoryFiles the
                    platform writes once and then hands to the developer: boilerplate source, cicd.yaml,
                    README, the gitops values.yaml) are composed only until they are observed Ready;
                    their composition-resource-names are then recorded here and the managed resources
                    retire, leaving the GitHub files in place. "Scaffold once, reconcile never": a name
                    in this list is never rendered again for this XR, so a later template change cannot
                    overwrite a developer's edits and the provider has nothing to poll.
                  properties:
                    done:
                      type: array
                      description: >-
                        composition-resource-names of the scaffold files this XR has already written
                        (sorted, unique). Empty or absent on a fresh XR, and again after a cluster
                        rebuild, when the pinned external names let the provider adopt the existing
                        files without writing them - after which they re-enter this list.
                      items:
                        type: string
                        description: "A composition-resource-name, e.g. src-repo-readme."
            spec:
              type: object
              description: "Desired state of the AzureFunction. Each field below is documented; the XRD rejects unknown fields at sync time (server-side apply)."
              properties:
                devCluster:
                  type: string
                  description: >-
                    Which dev cluster this app is onboarded onto - e.g. "kind-dev". An app is pinned to
                    exactly one. Checked live against the cluster registry via a Crossplane
                    extra-resources lookup: must resolve to a ConfigMap with type: dev and
                    cicdReady: "true", or the Composition creates nothing and reports
                    DevClusterReady: False rather than partially succeeding.
                  minLength: 1
                description:
                  type: string
                  description: >-
                    Free-text description - the src repo's GitHub description and the
                    generated README. Optional.
                  minLength: 1
                visibility:
                  type: string
                  description: GitHub visibility for the src repo.
                  enum: [private, public]
                  default: private
                runtime:
                  type: string
                  description: >-
                    Language and Microsoft Functions base image: nodejs20
                    (mcr.microsoft.com/azure-functions/node:4-node20, programming model v4) or
                    python3.12 (azure-functions/python:4-python3.12, model v2).
                  enum: ["nodejs20", "python3.12"]
                  default: "nodejs20"
                resourceGroup:
                  type: string
                  description: Resource group of the existing Container App. Required, since the app already exists.
                  minLength: 1
                appName:
                  type: string
                  description: >-
                    Name of the existing Container App hosting the function app. Defaults to the XR's own name.
                  minLength: 1
                  maxLength: 32
                target:
                  type: object
                  description: >-
                    Opt-in (2026-10-08): let this app own the Azure infrastructure it deploys into.
                    With enabled: true the Composition composes an AzureContainerAppTarget child
                    named <name>-target (xrds/azurecontainerapptarget.yaml) from this spec's own
                    appName, resourceGroup and runtime - the same values the scaffolded cicd.yaml
                    carries, so they can never drift - and proxies its TargetReady condition onto
                    this XR. Note what that means for resourceGroup: the child CREATES and owns
                    that resource group (and deletes it with this app), so it must not name a
                    group that already exists for something else. Leave it off (the default) to
                    stand a target up and down independently, as its own AzureContainerAppTarget
                    XR in this app's xr-requests. Both need the Azure provider installed.
                  properties:
                    enabled:
                      type: boolean
                      description: Compose the AzureContainerAppTarget child.
                      default: false
                    location:
                      type: string
                      description: Azure region for the child's resource group, environment and app.
                      pattern: '^[a-z0-9]+$'
                      default: eastus
              required: ["devCluster", "resourceGroup"]
          required: ["spec"]
