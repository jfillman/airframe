# Sidecar meta for the Dex component (SP-4), attach mode only - verified against
# compositions/dex/templates/attach.yaml. Server mode has no consumer-facing outputs (it's the
# shared infrastructure other apps attach to, not something an app's own env references via
# fromComponent).
kind: Dex
role: component
summary: >-
  attach mode: a confidential OAuth2 client on an existing shared Dex server, for
  machine-to-machine client_credentials auth. server mode (no outputs below apply): the shared
  OIDC server itself.
outputs:
  clientId:
    kind: secretKeyRef
    secret: "{name}-oauth-credentials"
    key: client-id
  clientSecret:
    kind: secretKeyRef
    secret: "{name}-oauth-credentials"
    key: client-secret
  issuer:
    kind: secretKeyRef
    secret: "{name}-oauth-credentials"
    key: issuer
  tokenUrl:
    kind: secretKeyRef
    secret: "{name}-oauth-credentials"
    key: token-url
  jwksUrl:
    kind: secretKeyRef
    secret: "{name}-oauth-credentials"
    key: jwks-url
sources:
  - object: {kind: Secret, name: "{name}-oauth-credentials"}
    createdBy: function
    checkedBy: functions/function-dex/tests/test_fn.py::test_sidecar_secret_and_service_match_the_function
    when: {field: spec.mode, equals: attach}
  - object: {kind: Service, name: "{name}"}
    createdBy: function
    checkedBy: functions/function-dex/tests/test_fn.py::test_sidecar_secret_and_service_match_the_function
    when: {field: spec.mode, equals: server}
conditions:
  # AF-6a: a custom ComponentReady condition, in addition to Crossplane's own generic Ready/Synced -
  # see compositions/dex/templates/status.yaml. One reason set per mode; both live under the same
  # condition type since a real XR is always exactly one mode.
  - type: ComponentReady
    reasons:
      - reason: DexAttachReady
        status: "True"
        meaning: (attach mode) the client is registered on the server and {name}-oauth-credentials carries the secret the server actually holds - created fresh, confirmed unchanged, or adopted from the server when the Secret had been lost or drifted (the message says which; adoption also raises a Warning event).
      - reason: DexAttachFailed
        status: "False"
        meaning: (attach mode) the live CreateClient/GetClient call to the Dex server's gRPC Admin API failed (server unreachable, or a real error), or the client exists on the server without a secret this XR can use. A previously observed Secret is kept as it was, never pruned.
      - reason: DexServerReady
        status: "True"
        meaning: (server mode) the Dex Deployment has at least one available replica.
      - reason: DexServerProvisioning
        status: "False"
        meaning: (server mode) the Dex Deployment has not reported an available replica yet.
verify:
  - id: xr-ready
    check: The Dex XR's ComponentReady condition has reason DexAttachReady (attach) or DexServerReady (server).
    run: {kind: condition, type: ComponentReady, reasons: [DexAttachReady, DexServerReady]}
  - id: secret-exists
    check: Secret {name}-oauth-credentials exists in the app namespace with non-empty client-id and client-secret keys.
    when: {field: spec.mode, equals: attach}
    run: {kind: secretKeys, secret: "{name}-oauth-credentials", keys: [client-id, client-secret]}
  - id: token-issuance
    check: >-
      POST {tokenUrl} with grant_type=client_credentials and the client-id/client-secret from the
      Secret returns a real access_token whose signing key is published at {jwksUrl} (reached through
      kubectl port-forward to the Dex server's Service).
    when: {field: spec.mode, equals: attach}
    run: {kind: oauthClientCredentials, secret: "{name}-oauth-credentials"}
  - id: server-discovery
    check: >-
      The Dex server's {name} Service answers GET /dex/.well-known/openid-configuration with 200 on
      5556 (through kubectl port-forward).
    when: {field: spec.mode, equals: server}
    run: {kind: http, service: "{name}", port: 5556, path: /dex/.well-known/openid-configuration, expectStatus: 200}
agentNotes:
  - "Rendered by function-dex (Python, functions/function-dex), not go-templating. Build and push per its README; it has unit tests in CI."
  - "Attach mode adopts the secret the server already holds on already_exists and never prunes a live credentials Secret on a transient failure (review C1). It composes a Usage that blocks deleting the server while attachers exist."
owner: human
