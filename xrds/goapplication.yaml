# Fourth Bootstrap-tier stack XRD - structural port of NodeJSApplication, same as
# SpringBootApplication/PythonApplication were. CI/CD onboarding is composed from
# the shared TektonCICD XRD (see compositions/goapplication/templates/
# render-github-resources/tekton-cicd-child.yaml), same as PythonApplication.
#
# XR's own metadata.name IS the app name (no separate spec.appName) - matches every
# other app XRD's own convention.
#
# No spec.githubOwner - same reasoning as every other app XRD's header.
#
# No package-manager-equivalent field: Go has one real toolchain (go modules), unlike
# Node/Python's several - nothing to branch on, so unlike those two this XRD doesn't
# carry one. No spec.modulePath either - the module path is derivable the same way
# appRepoUrl already is (github.com/jfillman/<xrName>, matching the real repo URL,
# the Go-conventional choice for a module path), computed as a template literal in
# src-repo.yaml, not taken as input - same "platform computes it, not each app"
# reasoning SpringBootApplication's own header gives for omitting springBootVersion.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: goapplications.catalog.hangar.io
  annotations:
    terasky.backstage.io/add-to-catalog: "true"
    terasky.backstage.io/target-path: "tenants/${{ parameters.xrName }}/xr-requests"
    terasky.backstage.io/description: "Onboard a new Go service - creates its source repo (with boilerplate) and an empty GitOps deploy repo, then wires up CI/CD."
    hangar.io/agent-summary: "Onboard a new Go service - creates its source repo (with boilerplate) and an empty GitOps deploy repo, then wires up CI/CD."
spec:
  group: catalog.hangar.io
  names:
    kind: GoApplication
    plural: goapplications
    singular: goapplication
  scope: Namespaced
  # Review C13: deterministic Composition choice for an XR that names none (there is one per kind).
  defaultCompositionRef:
    name: goapplications.catalog.hangar.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: DEVCLUSTER
          type: string
          jsonPath: ".status.conditions[?(@.type=='DevClusterReady')].reason"
          description: "DevClusterReady reason"
        - name: CICD
          type: string
          jsonPath: ".status.conditions[?(@.type=='CicdOnboarded')].reason"
          description: "CicdOnboarded reason"
      schema:
        openAPIV3Schema:
          type: object
          description: "GoApplication: Onboard a new Go service - creates its source repo (with boilerplate) and an empty GitOps deploy repo, then wires up CI/CD."
          properties:
            metadata:
              type: object
              description: "Standard object metadata. Only name is constrained here (its length)."
              properties:
                name:
                  type: string
                  maxLength: 52
                  description: >-
                    At most 52 characters (review C13). The composed TektonCICD child is <name>-tektoncicd, and its name becomes a 63-character label on everything it composes.
            status:
              type: object
              description: "Observed state of the GoApplication, written by its Composition (conditions are added by Crossplane)."
              properties:
                scaffold:
                  type: object
                  description: >-
                    Scaffold ledger, written by the Composition. Scaffold files (RepositoryFiles the
                    platform writes once and then hands to the developer: boilerplate source, cicd.yaml,
                    README, the gitops values.yaml) are composed only until they are observed Ready;
                    their composition-resource-names are then recorded here and the managed resources
                    retire, leaving the GitHub files in place. "Scaffold once, reconcile never": a name
                    in this list is never rendered again for this XR, so a later template change cannot
                    overwrite a developer's edits and the provider has nothing to poll.
                  properties:
                    done:
                      type: array
                      description: >-
                        composition-resource-names of the scaffold files this XR has already written
                        (sorted, unique). Empty or absent on a fresh XR, and again after a cluster
                        rebuild, when the pinned external names let the provider adopt the existing
                        files without writing them - after which they re-enter this list.
                      items:
                        type: string
                        description: "A composition-resource-name, e.g. src-repo-readme."
            spec:
              type: object
              description: "Desired state of the GoApplication. Each field below is documented; the XRD rejects unknown fields at sync time (server-side apply)."
              properties:
                devCluster:
                  type: string
                  description: >-
                    Which dev cluster this app is onboarded onto - e.g. "kind-dev".
                    An app is pinned to exactly one. Checked live against the
                    cluster registry (gitops-cluster-dev/00-bootstrap/
                    cluster-registry/) via a Crossplane extra-resources lookup:
                    must resolve to a ConfigMap with type: dev and
                    cicdReady: "true", or the Composition creates nothing and
                    reports DevClusterReady: False rather than partially
                    succeeding - see this XRD's own header comment.
                  minLength: 1
                description:
                  type: string
                  description: >-
                    Free-text description - used as the src repo's GitHub description
                    and in the generated boilerplate README. Optional; omitted sections
                    render a generic placeholder instead.
                  minLength: 1
                goVersion:
                  type: string
                  description: >-
                    Go minor version - drives the Containerfile's build-stage FROM line
                    and go.mod's own go directive. One of this platform's
                    currently-supported lines, not a free-form string, so a typo
                    fails XR admission instead of producing a Containerfile that pulls
                    a nonexistent image tag.
                  enum: ["1.22", "1.23", "1.24"]
                  default: "1.23"
                port:
                  type: integer
                  description: >-
                    Port the boilerplate HTTP server listens on (also the
                    Containerfile's EXPOSE). Matches airframe-application's own
                    rollout.ports default convention.
                  minimum: 1
                  maximum: 65535
                  default: 8080
                visibility:
                  type: string
                  description: GitHub visibility for both the src and gitops repos.
                  enum: [private, public]
                  default: private
              required: ["devCluster"]
          required: ["spec"]
