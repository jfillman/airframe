# Bootstrap-tier XRD for a container-image AWS Lambda function. A function is not a
# GoApplication with a different deploy step: it has no ports, replicas, probes, Rollout or Helm
# chart, so none of the application XRDs' parameters apply. Language and target are still
# independent of the build, which reuses the same Containerfile -> OCI image path.
#
# BRING YOUR OWN FUNCTION. Glidepath's aws-lambda deploy target only updates an existing
# function's image; nothing here creates the function, its execution role or its ECR
# repository. Create those first (package type Image), then onboard.
#
# No gitops-<app> repo is created: there is no Flight environment (no Helm chart), and
# Glidepath renders the release Application only for apps that declare a release stage, which
# the starter cicd.yaml does not. TektonCICD still requires a gitopsRepoUrl, so one is passed
# by the same naming convention; it points at a repo that does not exist. Unverified whether
# anything reads it for this kind of app; see compositions/lambdafunction/example/README.md.
#
# The Component this produces should carry the Tower catalog annotations
# hangar.io/service-class: function and hangar.io/deploy-target: aws-lambda
# (tower docs/service-classes.md). Tower also infers both from the kind:lambdafunction tag.
#
# Not yet usable end to end: Glidepath has no way to push to ECR (see cicd-yaml.yaml's header).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: lambdafunctions.catalog.hangar.io
  annotations:
    terasky.backstage.io/add-to-catalog: "true"
    terasky.backstage.io/target-path: "tenants/${{ parameters.xrName }}/xr-requests"
    terasky.backstage.io/description: "Onboard a new AWS Lambda function (container image) - creates its source repo with a handler and CI/CD that deploys to an existing function."
    hangar.io/agent-summary: "Onboard a new AWS Lambda function (container image) - creates its source repo with a handler and CI/CD that deploys to an existing function."
spec:
  group: catalog.hangar.io
  names:
    kind: LambdaFunction
    plural: lambdafunctions
    singular: lambdafunction
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              properties:
                scaffold:
                  type: object
                  description: >-
                    Scaffold ledger, written by the Composition. Scaffold files (RepositoryFiles the
                    platform writes once and then hands to the developer: boilerplate source, cicd.yaml,
                    README, the gitops values.yaml) are composed only until they are observed Ready;
                    their composition-resource-names are then recorded here and the managed resources
                    retire, leaving the GitHub files in place. "Scaffold once, reconcile never": a name
                    in this list is never rendered again for this XR, so a later template change cannot
                    overwrite a developer's edits and the provider has nothing to poll.
                  properties:
                    done:
                      type: array
                      description: >-
                        composition-resource-names of the scaffold files this XR has already written
                        (sorted, unique). Empty or absent on a fresh XR, and again after a cluster
                        rebuild, when the pinned external names let the provider adopt the existing
                        files without writing them - after which they re-enter this list.
                      items:
                        type: string
            spec:
              type: object
              properties:
                devCluster:
                  type: string
                  description: >-
                    Which dev cluster this app is onboarded onto - e.g. "kind-dev". An app is pinned to
                    exactly one. Checked live against the cluster registry via a Crossplane
                    extra-resources lookup: must resolve to a ConfigMap with type: dev and
                    cicdReady: "true", or the Composition creates nothing and reports
                    DevClusterReady: False rather than partially succeeding.
                  minLength: 1
                description:
                  type: string
                  description: >-
                    Free-text description - the src repo's GitHub description and the
                    generated README. Optional.
                  minLength: 1
                visibility:
                  type: string
                  description: GitHub visibility for the src repo.
                  enum: [private, public]
                  default: private
                runtime:
                  type: string
                  description: >-
                    Handler language and AWS Lambda base image: nodejs22 (public.ecr.aws/lambda/nodejs:22),
                    python3.13 (lambda/python:3.13) or go (lambda/provided:al2023, a static binary).
                    Drives the boilerplate, the Containerfile's FROM and build.agent.
                  enum: ["nodejs22", "python3.13", "go"]
                  default: "nodejs22"
                architecture:
                  type: string
                  description: >-
                    CPU architecture of the existing Lambda function: arm64 or x86_64. Must match the
                    function. The pipeline builds only this architecture (deploy-lambda copies the
                    matching single-platform image and refuses a function it has no image for), which
                    also avoids the amd64 build that runs under emulation on the arm64 build node.
                  enum: ["arm64", "x86_64"]
                  default: "arm64"
                region:
                  type: string
                  description: AWS region of the function and its ECR repository.
                  pattern: '^[a-z]{2}(-[a-z]+)+-[0-9]$'
                  default: "us-east-1"
                functionName:
                  type: string
                  description: >-
                    Name of the existing Lambda function Glidepath deploys to. Defaults to the XR's
                    own name. Lambda names are unique per account and region, so set this if that
                    name is taken.
                  minLength: 1
                  maxLength: 64
                target:
                  type: object
                  description: >-
                    Opt-in (2026-10-08): let this app own the AWS infrastructure it deploys into.
                    With enabled: true the Composition composes an AwsLambdaTarget child named
                    <name>-target (xrds/awslambdatarget.yaml) from this spec's own functionName,
                    region, architecture and runtime - the same values the scaffolded cicd.yaml
                    carries, so they can never drift - and proxies its TargetReady condition onto
                    this XR. The infrastructure then lives exactly as long as this app does. Leave
                    it off (the default) to stand a target up and down independently, as its own
                    AwsLambdaTarget XR in this app's xr-requests, which is the shape for a smoke
                    app you only want to pay for while testing. Both need the AWS provider
                    installed and the app's aws-access-key-id/aws-secret-access-key secrets in
                    place (the child's bootstrap Job waits for them).
                  properties:
                    enabled:
                      type: boolean
                      description: Compose the AwsLambdaTarget child.
                      default: false
                    functionUrl:
                      type: boolean
                      description: Passed to the child's spec.functionUrl - a public Function URL for smoke tests.
                      default: true
              required: ["devCluster"]
          required: ["spec"]
