# Cloud-dependency XRD (2026-10-24): a managed PostgreSQL server with one database - Amazon RDS for
# PostgreSQL or Azure Database for PostgreSQL Flexible Server - stood up and torn down on request like the
# cloud targets (docs/user/cloud-dependencies.md). The in-cluster counterpart is PostgreSQL (CloudNativePG,
# a `components:` entry); this one is for workloads that run outside the cluster (Lambda, ECS, Container
# Apps) or need a database the cluster does not hold.
#
# Network: a public endpoint that admits ONLY `allowedCidrs` (the default admits no one), TLS required
# (RDS's rds.force_ssl, on by default since PostgreSQL 15; Azure's require_secure_transport, on by default),
# encrypted storage. AWS gets its own VPC with two public subnets in two availability zones (RDS needs two)
# and a security group with one ingress rule per CIDR; nothing else in that VPC. Azure gets one firewall rule
# per CIDR.
#
# Credentials: the provider generates the admin password and writes it into the Secret <name>-credentials
# (key password). The ConfigMap <name>-connection carries host, port, database, username and sslmode. Both in
# this XR's namespace. The database is owned by the admin user; there is no separate app role yet.
#
# Deleting: the server is deleted with no final snapshot, unless protect: true (AWS only), which turns on
# RDS deletion protection and a final snapshot - the XR's deletion then fails until protect is set false.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: managedpostgresqls.catalog.hangar.io
  annotations:
    terasky.backstage.io/add-to-catalog: "true"
    terasky.backstage.io/target-path: "tenants/${{ parameters.xrName }}/xr-requests"
    terasky.backstage.io/description: "A managed PostgreSQL server with one database - Amazon RDS or Azure Flexible Server - reachable only from the CIDRs you list, TLS required. Costs money while it exists."
    hangar.io/agent-summary: "A managed PostgreSQL server with one database - Amazon RDS or Azure Flexible Server - reachable only from the CIDRs you list, TLS required. Costs money while it exists."
spec:
  group: catalog.hangar.io
  names:
    kind: ManagedPostgreSQL
    plural: managedpostgresqls
    singular: managedpostgresql
  scope: Namespaced
  # Review C13: deterministic Composition choice for an XR that names none (there is one per kind).
  defaultCompositionRef:
    name: managedpostgresqls.catalog.hangar.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: CLOUD
          type: string
          jsonPath: ".spec.cloud"
        - name: HOST
          type: string
          jsonPath: ".status.host"
        - name: DEPENDENCY
          type: string
          jsonPath: ".status.conditions[?(@.type=='DependencyReady')].reason"
          description: "DependencyReady reason (closed set in xrds/<kind>.meta.yaml)"
      schema:
        openAPIV3Schema:
          type: object
          description: "ManagedPostgreSQL: A managed PostgreSQL server with one database - Amazon RDS or Azure Flexible Server - reachable only from the CIDRs you list, TLS required. Costs money while it exists."
          properties:
            metadata:
              type: object
              description: "Standard object metadata. Only name is constrained here (its length)."
              properties:
                name:
                  type: string
                  maxLength: 40
                  description: >-
                    At most 40 characters: composed objects are named <name>-<suffix>, and the
                    firewall rules <name>-allow-<n>.
            spec:
              type: object
              description: "Desired state of the ManagedPostgreSQL. Each field below is documented; the XRD rejects unknown fields at sync time (server-side apply)."
              x-kubernetes-validations:
                - rule: "self.cloud == 'aws' || !self.protect"
                  message: "protect (deletion protection and a final snapshot) is AWS only"
              properties:
                cloud:
                  type: string
                  description: aws (Amazon RDS for PostgreSQL) or azure (Azure Database for PostgreSQL Flexible Server). Fixed at creation.
                  enum: [aws, azure]
                  default: aws
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "cloud can't change after creation; delete and re-create the ManagedPostgreSQL"
                serverName:
                  type: string
                  description: >-
                    The RDS instance identifier or the Flexible Server's name. Defaults to this XR's own
                    name. Azure server names are global across Azure (they become <name>.postgres.database.azure.com).
                  pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "serverName can't change after creation"
                version:
                  type: string
                  description: PostgreSQL major version.
                  enum: ["16", "17"]
                  default: "17"
                size:
                  type: string
                  description: >-
                    small: 2 vCPU burstable, 1 GiB (RDS db.t4g.micro) or 1 vCPU, 2 GiB (Azure
                    B_Standard_B1ms). medium: db.t4g.small / B_Standard_B2s. large: db.t4g.medium /
                    GP_Standard_D2s_v3.
                  enum: [small, medium, large]
                  default: small
                storageGiB:
                  type: integer
                  description: Allocated storage in GiB (sizes both clouds accept).
                  enum: [32, 64, 128, 256]
                  default: 32
                databaseName:
                  type: string
                  description: >-
                    The database to create. Defaults to the XR's name with hyphens turned into
                    underscores. Lowercase letters, digits and underscores.
                  pattern: '^[a-z][a-z0-9_]{0,62}$'
                backupRetentionDays:
                  type: integer
                  description: Days of automated backups (point-in-time restore window).
                  minimum: 7
                  maximum: 35
                  default: 7
                allowedCidrs:
                  type: array
                  description: >-
                    The IPv4 networks that may connect on 5432. Empty (the default) admits no one. A
                    Lambda function outside a VPC has no fixed address, so reaching this server from one
                    means 0.0.0.0/0: then the password and TLS are the only protection.
                  maxItems: 20
                  items:
                    type: string
                    pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/([0-9]|[12][0-9]|3[0-2])$'
                  default: []
                protect:
                  type: boolean
                  description: >-
                    AWS only. RDS deletion protection plus a final snapshot (<serverName>-final) when the
                    server is deleted. While true, deleting the XR fails; set it false first.
                  default: false
                region:
                  type: string
                  description: AWS only. The region of the server and its VPC.
                  pattern: '^[a-z]{2}(-[a-z]+)+-[0-9]$'
                  default: us-east-1
                vpcCidr:
                  type: string
                  description: AWS only. The /16 of the server's own VPC; its two subnets are the first two /24s.
                  pattern: '^10\.([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.0\.0/16$'
                  default: 10.43.0.0/16
                location:
                  type: string
                  description: Azure only. The server's Azure region.
                  pattern: '^[a-z0-9]+$'
                  default: eastus
                resourceGroup:
                  type: string
                  description: >-
                    Azure only. The resource group this XR CREATES and owns (deleting the XR deletes the
                    group). Defaults to <serverName>-rg.
                  pattern: '^[a-zA-Z0-9._()-]{1,90}$'
            status:
              type: object
              description: Published by the Composition once the server exists.
              properties:
                cloud:
                  type: string
                  description: The cloud the server lives in.
                serverName:
                  type: string
                  description: The RDS instance identifier or the Flexible Server's name.
                host:
                  type: string
                  description: The server's DNS name.
                port:
                  type: integer
                  description: The port, 5432.
                database:
                  type: string
                  description: The database's name.
                username:
                  type: string
                  description: The admin user, which owns the database.
                connectionConfigMap:
                  type: string
                  description: The ConfigMap in this namespace with host, port, database, username and sslmode.
                credentialsSecret:
                  type: string
                  description: The Secret in this namespace whose key password holds the admin password.
          required: ["spec"]
