# Sidecar meta for the MongoDB component (SP-3, born A+ per AF-3's own contract from day one).
# Verified against compositions/mongodb/templates/replicaset.yaml and the real MongoDB Controllers
# for Kubernetes operator source (mongodb-community-operator/controllers/mongodb_users.go's own
# connectionStringSecret field list: connectionString.standard, connectionString.standardSrv,
# username, password) - not illustrative.
kind: MongoDB
summary: A dedicated MongoDB replica set, one per application environment.
outputs:
  # {name} is the components[] entry's own `name` field.
  username:
    kind: secretKeyRef
    secret: "{name}-app"
    key: username
  password:
    kind: secretKeyRef
    secret: "{name}-app"
    key: password
  uri:
    kind: secretKeyRef
    secret: "{name}-app"
    key: connectionString.standard
    description: >-
      A full mongodb:// connection string, credentials and all replica set members included. The
      key itself contains a literal dot - it is one flat Secret key, "connectionString.standard",
      not a nested field.
  uriSrv:
    kind: secretKeyRef
    secret: "{name}-app"
    key: connectionString.standardSrv
    description: The same connection string, using mongodb+srv:// DNS seedlist discovery instead of listing every member.
conditions:
  # AF-6a: a custom ComponentReady condition, in addition to Crossplane's own generic Ready/Synced -
  # see compositions/mongodb/templates/status.yaml. Closed set, from the real operator's own three
  # phase values (mongodb-community-operator/api/v1/mongodbcommunity_types.go).
  - type: ComponentReady
    reasons:
      - reason: MongoDBReady
        status: "True"
        meaning: The MongoDBCommunity replica set reports phase Running.
      - reason: MongoDBFailed
        status: "False"
        meaning: The MongoDBCommunity replica set reports phase Failed - a real problem, not just startup. Check its own status.message.
      - reason: MongoDBPending
        status: "False"
        meaning: The MongoDBCommunity replica set reports phase Pending (agents still converging the replica set).
      - reason: MongoDBProvisioning
        status: "False"
        meaning: The replica set has not been observed yet (just created).
verify:
  - id: xr-ready
    check: The MongoDB XR's ComponentReady condition has reason MongoDBReady.
  - id: secret-exists
    check: Secret {name}-app exists in the app namespace and has non-empty username/password keys.
  - id: reachable
    check: A TCP connect to {name}-0.{name}-svc:27017 succeeds from the app namespace.
owner: human
