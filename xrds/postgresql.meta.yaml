# Sidecar meta for the PostgreSQL component (AF-3). Verified against compositions/postgresql/templates/
# cluster.yaml and xrds/postgresql.yaml's own header: CNPG's bootstrap.initdb creates the database and its
# owning role together and writes the generated password into the `{name}-app` Secret it manages itself
# (not rendered by this Composition - CNPG's own convention, documented and unchanged since).
kind: PostgreSQL
role: component
summary: A dedicated PostgreSQL database (CloudNativePG), one per application environment.
outputs:
  host:
    kind: secretKeyRef
    secret: "{name}-app"
    key: host
  port:
    kind: secretKeyRef
    secret: "{name}-app"
    key: port
  username:
    kind: secretKeyRef
    secret: "{name}-app"
    key: username
  password:
    kind: secretKeyRef
    secret: "{name}-app"
    key: password
  database:
    kind: secretKeyRef
    secret: "{name}-app"
    key: dbname
  uri:
    kind: secretKeyRef
    secret: "{name}-app"
    key: uri
    description: A full postgres:// connection string, credentials included.
  jdbcUri:
    kind: secretKeyRef
    secret: "{name}-app"
    key: jdbc-uri
sources:
  - object: {kind: Secret, name: "{name}-app"}
    createdBy: operator
    from: {kind: Cluster, name: "{name}", field: spec.bootstrap.initdb}
    note: CloudNativePG creates <Cluster>-app (owner role, generated password, uri, jdbc-uri) from bootstrap.initdb.
  - object: {kind: Service, name: "{name}-rw"}
    createdBy: operator
    from: {kind: Cluster, name: "{name}"}
    note: CloudNativePG creates <Cluster>-rw (primary), -ro and -r Services for every Cluster.
conditions:
  # AF-6a: a custom ComponentReady condition, in addition to Crossplane's own generic Ready/Synced -
  # see compositions/postgresql/templates/status.yaml. Closed set.
  - type: ComponentReady
    reasons:
      - reason: PostgreSQLReady
        status: "True"
        meaning: The CNPG Cluster's own Ready condition is True.
      - reason: PostgreSQLDegraded
        status: "False"
        meaning: The CNPG Cluster has been observed but its own Ready condition is False - a real problem, not just startup. Check the Cluster's own status/events.
      - reason: PostgreSQLProvisioning
        status: "False"
        meaning: The Cluster has not been observed yet (just created).
# Known failures (review C8). Crossplane applies every composed resource in one pass and returns on the first
# apply error, before it writes the status the pipeline computed - so an operator outage cannot be reported
# through ComponentReady (it keeps its last value). It lands in Synced=False's message instead, and these
# patterns let airframe-verify (and any agent) name it instead of reading it as "the component is broken".
knownFailures:
  - id: CNPGWebhookUnavailable
    condition: Synced
    match: 'failed calling webhook "[a-z]+\.cnpg\.io"'
    example: >-
      cannot compose resources: cannot apply composed resource "cluster": Internal error occurred: failed calling
      webhook "mcluster.cnpg.io": failed to call webhook: Post
      "https://cnpg-webhook-service.cnpg-system.svc:443/mutate-postgresql-cnpg-io-v1-cluster?timeout=10s": dial tcp
      10.108.177.11:443: connect: connection refused
    meaning: >-
      The CloudNativePG operator's admission webhook did not answer, so Crossplane could not apply the Cluster.
      The database itself is unaffected; ComponentReady keeps its last value. Every PostgreSQL XR on the cluster
      reports this at once.
    hint: >-
      Check the operator, not the database: kubectl -n cnpg-system get pods,endpointslices. It runs two replicas so a
      leader exit does not drop the webhook; if both are down, look for leader-election losses in their logs. The XR
      re-syncs on its own once the webhook answers.
verify:
  - id: xr-ready
    check: The PostgreSQL XR's ComponentReady condition has reason PostgreSQLReady.
    run: {kind: condition, type: ComponentReady, reasons: [PostgreSQLReady]}
  - id: secret-exists
    check: Secret {name}-app exists in the app namespace and has non-empty password and uri keys.
    run: {kind: secretKeys, secret: "{name}-app", keys: [password, uri]}
  - id: reachable
    check: >-
      {name}-rw accepts a TCP connection on 5432 (CNPG's read-write Service), through kubectl port-forward, so it proves the server is listening, not that the app namespace's NetworkPolicy admits the app.
    run: {kind: tcp, service: "{name}-rw", port: 5432}
agentNotes:
  - "CloudNativePG, not this composition, creates {name}-app and the {name}-rw Service. Its admission webhook fails closed: an operator outage shows as Synced=False with CNPGWebhookUnavailable, the database is unaffected."
owner: human
