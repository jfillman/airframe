# Attached-tier Component XRD: a dedicated PostgreSQL database for one app environment,
# backed by CloudNativePG (service-catalog-design.md, Round 2026-09-24). A `components:`
# entry (`type: postgresql`) in an environment's values.yaml, rendered by
# airframe-application's generic templates/attached/components.yaml.
#
# DEDICATED mode only: one CNPG `Cluster` per app-env, in the app's own namespace, the same
# shape as Redis. Shared-tenant / attach mode is deliberately not here - it needs a
# cross-namespace design (CNPG's Database/DatabaseRole reference their Cluster by name, so
# they must live beside it, and a namespaced XR can only compose into its own namespace).
# See the design doc before adding one; this schema leaves room for a future `mode`.
#
# The database and its owning role are created by the Cluster's own initdb bootstrap, with
# the SAME name. That is load-bearing: the Cluster's pg_hba uses `samerole`, which lets a
# role connect only to a database named for it.
#
# The app's credentials are CNPG's own `<name>-app` Secret (keys: username, password, host,
# port, dbname, uri, jdbc-uri) in the app's namespace. Wiring it into the consuming app is
# not built - same gap Redis documents.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresqls.catalog.hangar.io
  annotations:
    terasky.backstage.io/add-to-catalog: "false"
    hangar.io/catalog-exclusion: "Requested as a components[] entry in an app's values file (the airframe-application chart renders the XR); not a standalone self-service request."
    hangar.io/agent-summary: "A dedicated PostgreSQL database (CloudNativePG), one per application environment."
spec:
  group: catalog.hangar.io
  names:
    kind: PostgreSQL
    plural: postgresqls
    singular: postgresql
  scope: Namespaced
  # Review C13: deterministic Composition choice for an XR that names none (there is one per kind).
  defaultCompositionRef:
    name: postgresql.catalog.hangar.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: COMPONENT
          type: string
          jsonPath: ".status.conditions[?(@.type=='ComponentReady')].reason"
          description: "ComponentReady reason (closed set in xrds/<kind>.meta.yaml)"
      schema:
        openAPIV3Schema:
          type: object
          description: "PostgreSQL: A dedicated PostgreSQL database (CloudNativePG), one per application environment."
          properties:
            metadata:
              type: object
              description: "Standard object metadata. Only name is constrained here (its length)."
              properties:
                name:
                  type: string
                  maxLength: 54
                  description: >-
                    At most 54 characters (review C13). CloudNativePG names its bootstrap Job <name>-1-initdb, and a Job name must fit a 63-character label.
            spec:
              type: object
              description: "Desired state of the PostgreSQL. Each field below is documented; the XRD rejects unknown fields at sync time (server-side apply)."
              required:
                - environmentRef
              properties:
                environmentRef:
                  type: object
                  description: >-
                    Names the owning ApplicationEnvironment (app + cluster + env identity).
                    Labeling/audit only, not a live lookup. Auto-stamped by
                    airframe-application's components.yaml renderer.
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                      description: The ApplicationEnvironment XR's own name.
                size:
                  type: string
                  description: CPU/memory requests and limits for each instance.
                  enum: [small, medium, large]
                  default: small
                instances:
                  type: integer
                  description: >-
                    1 is a single instance with no failover. 2-3 give a primary plus streaming
                    replicas with automatic failover, for real environments. Each instance
                    gets its own volume.
                  enum: [1, 2, 3]
                  default: 1
                storageSize:
                  type: string
                  description: Size of each instance's volume (a Kubernetes quantity, e.g. 1Gi).
                  pattern: '^[0-9]+(\.[0-9]+)?(Mi|Gi|Ti)$'
                  default: 1Gi
                databaseName:
                  type: string
                  description: >-
                    Name of the database AND of the role that owns it (they must match, see
                    above). Defaults to the XR's own name with hyphens turned into
                    underscores. Lowercase letters, digits and underscores only.
                  pattern: '^[a-z][a-z0-9_]{0,62}$'
          required: ["spec"]
