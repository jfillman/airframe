# Sidecar meta for the RabbitMQ component (AF-3), attach mode only - verified against
# compositions/rabbitmq/templates/attach.yaml. Broker mode has no consumer-facing outputs (it's the shared
# infrastructure other apps attach to, not something an app's own env references via fromComponent).
kind: RabbitMQ
role: component
summary: >-
  attach mode: a user + permissions on an existing shared broker, scoped to this app's own queue prefix
  and exchanges. broker mode (no outputs below apply): the shared broker itself.
outputs:
  username:
    kind: secretKeyRef
    secret: "{name}-user-credentials"
    key: username
  password:
    kind: secretKeyRef
    secret: "{name}-user-credentials"
    key: password
  host:
    kind: configMapKeyRef
    configMap: "{name}-connection"
    key: host
  port:
    kind: configMapKeyRef
    configMap: "{name}-connection"
    key: port
  vhost:
    kind: configMapKeyRef
    configMap: "{name}-connection"
    key: vhost
sources:
  - object: {kind: Secret, name: "{name}-user-credentials"}
    createdBy: operator
    from: {kind: User, name: "{name}"}
    when: {field: spec.mode, equals: attach}
    note: The RabbitMQ messaging-topology operator writes a generated username/password to <User>-user-credentials.
  - object: {kind: ConfigMap, name: "{name}-connection"}
    createdBy: composition
    when: {field: spec.mode, equals: attach}
  - object: {kind: Service, name: "{name}"}
    createdBy: operator
    from: {kind: RabbitmqCluster, name: "{name}"}
    when: {field: spec.mode, equals: broker}
    note: The RabbitMQ cluster operator creates a client Service named after the RabbitmqCluster.
conditions:
  # AF-6a: a custom ComponentReady condition, in addition to Crossplane's own generic Ready/Synced -
  # see compositions/rabbitmq/templates/status.yaml. One reason set per mode; both live under the same
  # condition type since a real XR is always exactly one mode.
  - type: ComponentReady
    reasons:
      - reason: RabbitMQAttachReady
        status: "True"
        meaning: (attach mode) The User and Permission are provisioned on the shared broker.
      - reason: RabbitMQAttachProvisioning
        status: "False"
        meaning: (attach mode) The User has not reported Ready yet (just created, or the broker is unavailable).
      - reason: RabbitMQBrokerReady
        status: "True"
        meaning: (broker mode) The RabbitmqCluster reports at least one endpoint available.
      - reason: RabbitMQBrokerProvisioning
        status: "False"
        meaning: (broker mode) The RabbitmqCluster has not reported ClusterAvailable=True yet.
# Known failures (review C8). Crossplane applies every composed resource in one pass and returns on the first
# apply error, before it writes the status the pipeline computed - so an operator outage cannot be reported
# through ComponentReady (it keeps its last value). It lands in Synced=False's message instead, and these
# patterns let airframe-verify (and any agent) name it instead of reading it as "the component is broken".
knownFailures:
  - id: RabbitMQTopologyWebhookUnavailable
    condition: Synced
    match: 'failed calling webhook "[a-z0-9-]+\.kb\.io".*messaging-topology-webhook-service'
    example: >-
      cannot compose resources: cannot apply composed resource "user": Internal error occurred: failed calling
      webhook "vuser.kb.io": failed to call webhook: Post
      "https://messaging-topology-webhook-service.rabbitmq-system.svc:443/validate-rabbitmq-com-v1beta1-user?timeout=10s":
      dial tcp 10.96.0.12:443: connect: connection refused
    meaning: >-
      The RabbitMQ messaging-topology operator's admission webhook did not answer, so Crossplane could not apply a
      User, Vhost or Permission. The broker and existing credentials are unaffected; ComponentReady keeps its last
      value.
    hint: >-
      Check the operator: kubectl -n rabbitmq-system get pods,endpointslices -l app.kubernetes.io/name=messaging-topology-operator.
      It runs two replicas; if both are down, look for leader-election losses in their logs. The XR re-syncs on its own.
verify:
  - id: xr-ready
    check: The RabbitMQ XR's ComponentReady condition has reason RabbitMQAttachReady (attach) or RabbitMQBrokerReady (broker).
    run: {kind: condition, type: ComponentReady, reasons: [RabbitMQAttachReady, RabbitMQBrokerReady]}
  - id: secret-exists
    check: Secret {name}-user-credentials exists in the app namespace and has non-empty username and password keys.
    when: {field: spec.mode, equals: attach}
    run: {kind: secretKeys, secret: "{name}-user-credentials", keys: [username, password]}
  - id: configmap-exists
    check: ConfigMap {name}-connection exists in the app namespace with host/port/vhost keys.
    when: {field: spec.mode, equals: attach}
    run: {kind: configMapKeys, configMap: "{name}-connection", keys: [host, port, vhost]}
  - id: broker-reachable
    check: >-
      The broker's {name} Service accepts an AMQP TCP connection on 5672, through kubectl port-forward, so it proves the server is listening, not that the app namespace's NetworkPolicy admits the app.
    when: {field: spec.mode, equals: broker}
    run: {kind: tcp, service: "{name}", port: 5672}
owner: human
