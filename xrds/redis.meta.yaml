# Sidecar meta for the Redis component (AF-3). Verified against compositions/redis/templates/release.yaml,
# not illustrative: outputs below are exactly what that Composition's connectionDetails/
# writeConnectionSecretToRef actually produce. A Kubernetes CRD's structural schema rejects unknown `x-`
# keys, so this vocabulary lives beside the XRD instead, keyed by output name; tools/component_outputs.py
# reads every `xrds/*.meta.yaml` and the chart's `fromComponent` feature resolves against it.
kind: Redis
role: component
summary: A Redis cache or shared-counter store, dedicated to one application environment.
outputs:
  # {name} is the components[] entry's own `name` field; {namespace} is the release namespace.
  host:
    kind: literal
    value: "{name}-master.{namespace}.svc.cluster.local"
    description: The master Service's in-cluster DNS name.
  port:
    kind: literal
    value: 6379
  url:
    kind: literal
    value: "redis://{name}-master.{namespace}.svc.cluster.local:6379"
    description: >-
      host:port only, no credentials embedded (auth.enabled is true on this component, so a
      connection still needs the password output supplied separately - e.g. as its own env var).
  password:
    kind: secretKeyRef
    secret: "{name}-connection"
    key: password
    description: >-
      The Crossplane-composed connection Secret (writeConnectionSecretToRef), not the raw Bitnami chart
      Secret (which also exists, named `{name}`, key `redis-password` - the connection Secret copies the
      same value here so every component type has one canonical `<name>-connection` output surface).
sources:
  - object: {kind: Secret, name: "{name}-connection"}
    createdBy: crossplane
    from: {kind: Release, name: "{name}", field: spec.writeConnectionSecretToRef.name, equals: "{name}-connection"}
    keysFrom: "spec.connectionDetails[].toConnectionSecretKey"
    note: provider-helm writes the Release's connectionDetails into its writeConnectionSecretToRef Secret.
  - object: {kind: Service, name: "{name}-master"}
    createdBy: operator
    from: {kind: Release, name: "{name}", field: spec.forProvider.values.fullnameOverride, equals: "{name}"}
    note: The Bitnami chart names the master Service <fullname>-master; the composition sets fullnameOverride to the XR name.
conditions:
  # AF-6a: a custom ComponentReady condition, in addition to Crossplane's own generic Ready/Synced -
  # see compositions/redis/templates/status.yaml. Closed set; each reason has a stable meaning an
  # agent can act on without reading the Composition.
  - type: ComponentReady
    reasons:
      - reason: RedisReady
        status: "True"
        meaning: The wrapped Bitnami chart reports deployed.
      - reason: RedisDeploying
        status: "False"
        meaning: The Release is mid-rollout (a real Helm state, e.g. pending-install/pending-upgrade). Retry later.
      - reason: RedisReleaseFailed
        status: "False"
        meaning: The Helm release failed. Check the Release's own events; this will not resolve on its own.
      - reason: RedisProvisioning
        status: "False"
        meaning: The Release has not been observed yet (just created).
verify:
  - id: xr-ready
    check: The Redis XR's ComponentReady condition has reason RedisReady.
    run: {kind: condition, type: ComponentReady, reasons: [RedisReady]}
  - id: secret-exists
    check: Secret {name}-connection exists in the app namespace and has a non-empty password key.
    run: {kind: secretKeys, secret: "{name}-connection", keys: [password]}
  - id: reachable
    check: >-
      {name}-master accepts a TCP connection on 6379, through kubectl port-forward, so it proves the server is listening, not that the app namespace's NetworkPolicy admits the app.
    run: {kind: tcp, service: "{name}-master", port: 6379}
agentNotes:
  - "The image is pinned to bitnamilegacy; the upstream Bitnami images moved. Use hasKey, not default, for booleans: Sprig's default turns an explicit false into the default."
  - "The {name}-connection Secret comes from the Release's connectionDetails; an output key that is not a connection key is caught by tools/test_sidecars.py."
owner: human
