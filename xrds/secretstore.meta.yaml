# Sidecar contract for SecretStore (review A3; format in tools/sidecars.py). Checked against
# compositions/secretstore/ renders by tools/test_sidecars.py. The XR's name is the Infisical project slug and the
# ClusterSecretStore's name.
kind: SecretStore
role: platform
summary: An Infisical project plus a machine identity for one app (and environment), wrapped into an External Secrets
  ClusterSecretStore that ExternalSecrets in the app's namespaces read from.
outputs:
  clusterSecretStore:
    kind: literal
    value: '{name}'
    description: The ClusterSecretStore an ExternalSecret's secretStoreRef names (kind ClusterSecretStore).
    at:
      kind: ClusterSecretStore
      field: metadata.name
sources:
- object:
    kind: ClusterSecretStore
    name: '{name}'
  createdBy: composition
  note: Composed through a provider-kubernetes Object.
conditions: []
# Known failures (review C8 format). Review C9: Infisical's URL and org id come only from the cluster registry.
knownFailures:
  - id: InfisicalRegistryKeysMissing
    condition: Synced
    match: 'cluster registry record "[^"]+" has no infisicalUrl/infisicalOrgId'
    example: "cannot compose resources: cannot run Composition pipeline step \"render-secretstore-resources\": cannot execute template: template: manifests:61:6: executing \"manifests\" at <fail ...>: error calling fail: cluster registry record \"kind-prod\" has no infisicalUrl/infisicalOrgId: add the infisical: block to the hub's clusters.yaml and sync this cluster's cluster-registry Application"
    meaning: >-
      This cluster's registry record (crossplane-system ConfigMap named after spec.cluster) is missing, or was
      rendered without the hub clusters.yaml's infisical: block. The render stops before applying anything, so every
      existing store, identity and project is untouched; only new or changed SecretStores wait.
    hint: >-
      Check kubectl -n crossplane-system get cm <cluster> -o jsonpath='{.data}' for infisicalUrl and infisicalOrgId.
      If absent, add the infisical: block to gitops-cluster-dev/clusters.yaml and sync this cluster's
      cluster-registry Application (manual by design).
verify:
- id: xr-ready
  check: The SecretStore XR is Ready (every Infisical resource and the store are up).
  run:
    kind: condition
    type: Ready
    reasons:
    - Available
- id: store-valid
  check: 'ClusterSecretStore {name} reports Ready True: External Secrets authenticated to Infisical with the identity.'
  run:
    kind: resource
    resource: clustersecretstores.external-secrets.io
    name: '{name}'
    clusterScoped: true
    condition:
      type: Ready
      status: 'True'
agentNotes:
  - "Credentials never pass through the function pipeline: provider-kubernetes Objects copy the reviewer token and the universal-auth client secret server-side (references.patchesFrom). Keep it that way (review C2)."
  - "Kubernetes auth on the Infisical-hosting cluster, universal auth elsewhere; the cluster registry decides, not the spec. Infisical's URL and org id come only from the registry (infisicalUrl, infisicalOrgId, rendered from clusters.yaml's top-level infisical: block, review C9); a record without them fails the render fatally, which leaves every composed object as it is. Never hard-code them in a template."
owner: human
