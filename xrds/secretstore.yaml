# SecretStore: an Infisical project, a machine identity and an External Secrets
# ClusterSecretStore for one app on one cluster.
#
# Never requested by hand. The app stacks commit a shared-mode XR for the app's dev cluster
# (compositions/_shared/render-github-resources/secretstore-xr.yaml), and ApplicationEnvironment
# commits a shared-mode and a per-environment XR for each upper-cluster environment
# (compositions/applicationenvironment/templates/render-github-resources/secretstore-xrs.yaml).
# Both go through the target cluster's tenants repo (xr-requests/), because the store has to be
# created on that cluster.
#
# Two modes, chosen by environmentSlug:
#   - shared (the default): creates the project <appRef.name>-<cluster>, its "shared"
#     environment, the identity, and a ClusterSecretStore open to every app-<app>-* namespace.
#   - any other value: adds that environment to the existing project and a second
#     ClusterSecretStore limited to exactly app-<app>-<environmentSlug>. Creates no project.
#
# Naming: a shared XR is <appRef.name>-<cluster>, a per-env XR <appRef.name>-<cluster>-<environmentSlug>.
# The project slug is always computed as <appRef.name>-<cluster>, so a per-env XR finds its
# project without a lookup.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: secretstores.catalog.hangar.io
  annotations:
    terasky.backstage.io/add-to-catalog: "false"
    hangar.io/catalog-exclusion: "Composed by the application kinds and requested by ApplicationEnvironment as XR-request files; never requested directly from Backstage."
    hangar.io/agent-summary: "Creates or extends this app's Infisical-backed secret store (project, identity, ClusterSecretStore) for one cluster."
spec:
  group: catalog.hangar.io
  names:
    kind: SecretStore
    plural: secretstores
    singular: secretstore
  scope: Namespaced
  # Review C13: deterministic Composition choice for an XR that names none (there is one per kind).
  defaultCompositionRef:
    name: secretstores.catalog.hangar.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          description: "SecretStore: Creates or extends this app's Infisical-backed secret store (project, identity, ClusterSecretStore) for one cluster."
          properties:
            spec:
              type: object
              description: "Desired state of the SecretStore. Each field below is documented; the XRD rejects unknown fields at sync time (server-side apply)."
              required:
                - appRef
                - cluster
              properties:
                appRef:
                  type: object
                  description: >-
                    The application this store belongs to (any application kind or an
                    InfraService). Its name sets the project slug and the namespaces the
                    store serves; it is not a live lookup. The store belongs to the app,
                    not to one environment.
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                      description: The owning application's XR name (not an ApplicationEnvironment).
                cluster:
                  type: string
                  description: >-
                    The cluster registry name of the cluster this store is for. Its
                    registry record decides the rest: infisicalHost selects Kubernetes
                    auth (on the cluster that runs Infisical) or universal auth
                    (everywhere else), and infisicalUrl and infisicalOrgId say where
                    Infisical is. A missing record, or one without those two keys, fails
                    the render and leaves existing objects unchanged.
                  minLength: 1
                environmentSlug:
                  type: string
                  default: shared
                  description: >-
                    "shared" (the default) creates the project, its "shared" environment,
                    the identity and a ClusterSecretStore open to every
                    app-<appRef.name>-* namespace. Any other value adds that environment to
                    the existing project and a ClusterSecretStore limited to the namespace
                    app-<appRef.name>-<environmentSlug>, and creates no project.
          required: ["spec"]
