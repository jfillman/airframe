# Sidecar contract for SLO (review A3; format in tools/sidecars.py). Checked against compositions/slo/ renders
# by tools/test_sidecars.py.
kind: SLO
role: observability
summary: 'A service-level objective for one app environment: a Sloth PrometheusServiceLevel (recording and burn-rate
  alert rules) plus a Grafana dashboard ConfigMap.'
outputs:
  prometheusServiceLevel:
    kind: literal
    value: '{name}-slo'
    description: The Sloth PrometheusServiceLevel in the XR's namespace.
    at:
      kind: PrometheusServiceLevel
      field: metadata.name
  dashboard:
    kind: literal
    value: '{name}-slo-dashboard'
    description: The ConfigMap Grafana's dashboard sidecar loads.
    at:
      kind: ConfigMap
      field: metadata.name
sources:
- object:
    kind: PrometheusServiceLevel
    name: '{name}-slo'
  createdBy: composition
- object:
    kind: ConfigMap
    name: '{name}-slo-dashboard'
  createdBy: composition
conditions: []
verify:
- id: xr-ready
  check: The SLO XR is Ready.
  run:
    kind: condition
    type: Ready
    reasons:
    - Available
- id: rules-generated
  check: 'Sloth reports status.promOpRulesGenerated true on {name}-slo: the PrometheusRule exists.'
  run:
    kind: resource
    resource: prometheusservicelevels.sloth.slok.dev
    name: '{name}-slo'
    field: status.promOpRulesGenerated
    equals: true
owner: human
